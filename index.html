<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مخازن المنصور ستي</title>
<meta name="theme-color" content="#1F5468">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="المنصور ستي">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@600;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: one operations column; role bar on top, queue cards below, detail sheet over it. Concrete greys + kiln orange. */
:root{
  --bg:#E9EBE8; --surface:#FFFFFF; --sunk:#F3F4F1; --ink:#1C2225; --muted:#5B6569; --line:#D3D7D3;
  --brand:#1F5468; --accent:#BF4F17; --accent-ink:#FFFFFF; --accent-soft:#F7E3D7;
  --ok:#2C7A4C; --ok-soft:#DDF0E3; --warn:#9A6411; --warn-soft:#F6EBD3; --bad:#B03A2E; --bad-soft:#F6DEDA; --info:#2A6487; --info-soft:#DCEAF2;
  --display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131719; --surface:#1C2226; --sunk:#171C1F; --ink:#E6EAE9; --muted:#97A2A6; --line:#2D363A;
  --brand:#7FB8CC; --accent:#E7793F; --accent-ink:#1A0E07; --accent-soft:#3A2418;
  --ok:#5BC08A; --ok-soft:#183126; --warn:#E0A84A; --warn-soft:#33281A; --bad:#EE7B6C; --bad-soft:#3A1E1B; --info:#6DB2DA; --info-soft:#17293A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131719; --surface:#1C2226; --sunk:#171C1F; --ink:#E6EAE9; --muted:#97A2A6; --line:#2D363A;
  --brand:#7FB8CC; --accent:#E7793F; --accent-ink:#1A0E07; --accent-soft:#3A2418;
  --ok:#5BC08A; --ok-soft:#183126; --warn:#E0A84A; --warn-soft:#33281A; --bad:#EE7B6C; --bad-soft:#3A1E1B; --info:#6DB2DA; --info-soft:#17293A;
  color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:1080px;margin:0 auto}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
.small{font-size:13px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark{width:48px;height:48px;border-radius:10px;background:#FFFFFF;display:grid;place-items:center;flex:none;border:1px solid var(--line);overflow:hidden}
.mark img{width:40px;height:40px;display:block}
.brand .en{font-family:var(--body);font-weight:600;font-size:13px;color:var(--brand);letter-spacing:.02em;direction:ltr;unicode-bidi:isolate}
.brand h1{font-size:17px}
.brand p{margin:0;font-size:12px;color:var(--muted)}
.nav{display:flex;gap:6px;align-items:center}
.ib{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--ink)}
.ib:hover{border-color:var(--muted)}
.ib:disabled{opacity:.35;cursor:default}
.ib svg{width:20px;height:20px}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none;display:inline-block;vertical-align:middle;background:var(--sunk)}
.av0{border:1px solid var(--line)}
.wn{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.wn span{font-size:11.5px;color:var(--muted)}
.gate{display:grid;place-items:center;padding-block:40px}
.gcard{max-width:460px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 22px;display:flex;flex-direction:column;gap:14px;text-align:center;align-items:center}
.glogo{width:84px;height:84px;border-radius:14px;background:#fff;padding:6px;border:1px solid var(--line)}
.gcard h2{font-size:20px}
.gcard p{margin:0;color:var(--muted);font-size:14px;max-width:46ch}
.gme{display:flex;gap:10px;align-items:center;text-align:start;background:var(--sunk);border-radius:10px;padding:10px 14px}
.gme b{display:block}
.acc{display:flex;flex-direction:column;gap:4px}
.arow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow .mono{width:36px;height:36px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-family:var(--display);font-size:13px;color:var(--accent);border:1px solid var(--line)}
.an{display:flex;flex-direction:column;gap:3px;min-width:0}
.ap{display:inline-flex;gap:6px;align-items:center;font-size:13.5px}
.accres{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow-y:auto}
.hit{display:flex;gap:10px;align-items:center;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;width:100%}
.hit:hover{border-color:var(--accent)}
@media (max-width:520px){.arow{grid-template-columns:auto 1fr}.arow .acts{grid-column:1/-1}}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 6px 5px 14px}
.who b{font-weight:600;font-size:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface);font-weight:600}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}

.banner{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner .btn{margin-inline-start:auto}

/* role picker */
.pick{padding-block:28px 8px}
.pick h2{font-size:22px}
.pick>p{margin:6px 0 20px;color:var(--muted);max-width:60ch}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.rc{text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.rc:hover{border-color:var(--accent)}
.rc .mono{width:40px;height:40px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-family:var(--display);font-size:15px;color:var(--accent);border:1px solid var(--line)}
.rc strong{display:block;font-size:15px}
.rc span{font-size:12px;color:var(--muted)}
.rc .cnt{min-width:28px;height:28px;border-radius:999px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:600;padding:0 8px}
.rc .cnt.watch{background:var(--info-soft);color:var(--info)}
.rc .cnt.zero{background:var(--sunk);color:var(--muted)}
.group-label{font-size:12px;letter-spacing:.04em;color:var(--muted);margin:22px 0 8px;font-weight:600}

/* role home */
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-block:22px 4px}
.head h2{font-size:21px}
.head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.head .btn{margin-inline-start:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:22px;font-family:var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.hot b{color:var(--accent)}
.tabs{display:flex;gap:4px;margin-top:20px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .c{font-size:12px;background:var(--sunk);border-radius:999px;padding:1px 7px;margin-inline-start:4px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.filters{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
.filters input{flex:1 1 200px}

.card{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;text-align:start;width:100%}
.card:hover{border-color:var(--muted)}
.card.crit{border-inline-start:4px solid var(--bad)}
.card.urg{border-inline-start:4px solid var(--warn)}
.thumb{width:56px;height:56px;border-radius:8px;background:var(--sunk);object-fit:cover;display:grid;place-items:center;color:var(--muted);font-size:11px;border:1px solid var(--line)}
.card .mid{min-width:0}
.card .t{font-weight:600;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);margin-top:2px}
.card .end{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-info{background:var(--info-soft);color:var(--info)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-ok{background:var(--ok-soft);color:var(--ok)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-accent{background:var(--accent-soft);color:var(--accent)} .p-mute{background:var(--sunk);color:var(--muted)}
.tag-demo{font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:0 5px}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted);margin-top:14px}
.empty b{display:block;color:var(--ink);font-family:var(--display);margin-bottom:4px}
.empty .row{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}

/* track */
.track{display:flex;gap:0;margin:14px 0 4px;overflow-x:auto;padding-bottom:4px}
.step{flex:1 0 70px;text-align:center;font-size:11.5px;color:var(--muted);position:relative;padding-top:20px}
.step::before{content:"";position:absolute;top:6px;inset-inline:0;height:2px;background:var(--line)}
.step::after{content:"";position:absolute;top:1px;inset-inline-start:calc(50% - 6px);width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.step.done::before,.step.done::after{background:var(--ok);border-color:var(--ok)}
.step.now{color:var(--ink);font-weight:600}
.step.now::after{background:var(--accent);border-color:var(--accent)}
.step.skip{opacity:.45}
.step.rej::after{background:var(--bad);border-color:var(--bad)}

/* overlay */
.ov{position:fixed;inset:0;background:rgb(10 12 14 / .5);z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--bg);border-radius:14px;width:100%;max-width:720px;border:1px solid var(--line)}
.sh-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);background:var(--surface);border-radius:14px 14px 0 0}
.sh-h h3{font-size:17px;flex:1;min-width:0}
.x{border:0;background:var(--sunk);width:34px;height:34px;border-radius:8px;font-size:18px;line-height:1}
.sh-b{padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sec h4{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 16px}
.kv div span{display:block;font-size:12px;color:var(--muted)}
.kv div b{font-weight:500;overflow-wrap:anywhere}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.ph img,.ph .none{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--sunk);max-width:100%}
.ph .none{display:grid;place-items:center}
.ph a{color:var(--info)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.log li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13.5px}
.log li i{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:7px;font-style:normal}
.log li small{grid-column:2;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.acts textarea{flex:1 1 100%}

/* forms */
form.f{display:flex;flex-direction:column;gap:14px}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label.l{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;min-width:0}
label.l em{font-style:normal;color:var(--muted);font-weight:400;font-size:12px}
.in{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea.in{min-height:70px;resize:vertical}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg label{flex:1;text-align:center;padding:8px 6px;font-size:13px;cursor:pointer;border-inline-start:1px solid var(--line)}
.seg label:first-child{border-inline-start:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent-soft);color:var(--accent);font-weight:600}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:12px;display:flex;gap:12px;align-items:center;background:var(--surface);cursor:pointer;min-height:84px}
.drop:hover{border-color:var(--accent)}
.drop img{width:72px;height:60px;object-fit:cover;border-radius:6px;flex:none}
.drop .dt{min-width:0;font-size:13px}
.drop .dt b{display:block}
.drop input{display:none}
.gps{display:flex;gap:8px;flex-wrap:wrap}
.gps .in{flex:1 1 220px}
.note{font-size:12.5px;color:var(--muted)}
.note.ok{color:var(--ok)} .note.bad{color:var(--bad)}
.err{color:var(--bad);font-size:13px}

/* inventory */
.tbl-wrap{overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:14px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.q{font-variant-numeric:tabular-nums;font-weight:600}
.low td.q{color:var(--bad)}

/* map */
.mapgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;margin-top:14px}
@media (max-width:760px){.mapgrid{grid-template-columns:1fr}}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.mapbox svg{width:100%;height:auto;display:block}
.sites{display:flex;flex-direction:column;gap:8px}
.site{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.site .r1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.site .r1 b{flex:1;min-width:0}
.site a{color:var(--info);font-size:13px}
.feed{display:flex;flex-direction:column;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fday{font-size:12px;font-weight:600;color:var(--muted);background:var(--sunk);padding:7px 14px;border-bottom:1px solid var(--line)}
.fi{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:start;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:start;width:100%;font-size:14px}
.fi:last-child{border-bottom:0}
button.fi:hover{background:var(--sunk)}
.ft{color:var(--muted);font-size:12.5px;padding-top:1px}
.fb{min-width:0;overflow-wrap:anywhere}
.fb small{display:block;color:var(--muted);font-size:12.5px}
.dot{width:9px;height:9px;border-radius:50%;margin-top:7px}
.d-ok{background:var(--ok)}.d-bad{background:var(--bad)}.d-accent{background:var(--accent)}.d-info{background:var(--info)}.d-mute{background:var(--muted)}
.lock{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:var(--sunk);border:1px dashed var(--line);border-radius:8px;padding:8px 12px}
.lock svg{width:16px;height:16px;flex:none}
.scanbox{position:relative;width:100%;aspect-ratio:1;max-width:420px;margin:0 auto;border-radius:12px;overflow:hidden;background:#000}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;inset:18%;border:3px solid var(--accent);border-radius:14px;box-shadow:0 0 0 999px rgb(0 0 0 / .35)}
.rcbox{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.qr{background:#fff;padding:10px;border-radius:12px;width:100%;max-width:280px}
.qr svg{width:100%;height:auto;display:block}
.rcdig{font-family:var(--display);font-size:30px;letter-spacing:.12em;color:var(--ink)}
.okmark{width:64px;height:64px;border-radius:50%;background:var(--ok);color:var(--surface);display:grid;place-items:center;font-size:34px;font-weight:700}
.nc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:start}
.nc[role=button]{cursor:pointer}.nc[role=button]:hover{border-color:var(--muted)}
.nc.new{border-inline-start:4px solid var(--accent)}
.nh{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap}
.nc .kv small{display:block;font-size:11.5px}
.appr{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;margin-top:8px;color:var(--muted)}
.appr .yes{color:var(--ok);font-weight:600}
.bell{position:relative;width:34px;height:34px}
.bdg{position:absolute;top:-5px;inset-inline-end:-5px;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;font-weight:700;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.rpick{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;background:var(--surface);font-size:13px}
.rpick input{position:absolute;opacity:0;pointer-events:none}
.rpick .mono{width:30px;height:30px;border-radius:7px;background:var(--sunk);display:grid;place-items:center;font-family:var(--display);font-size:12px;color:var(--accent);flex:none}
.rpick:has(input:checked){border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.quotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}

/* EXIF GPS from phone photos */
async function exifGps(file){
  try{
    const buf=await file.slice(0,262144).arrayBuffer();const v=new DataView(buf);
    if(v.getUint16(0)!==0xFFD8)return null;let o=2;
    while(o<v.byteLength-10){const m=v.getUint16(o),len=v.getUint16(o+2);
      if(m===0xFFE1&&v.getUint32(o+4)===0x45786966)return tiffGps(v,o+10);
      if((m&0xFF00)!==0xFF00)break;o+=2+len}
  }catch(e){}return null}

      if(m===0xFFE1&&v.getUint32(o+4)===0x45786966){const t=o+10,le=v.getUint16(t)===0x4949,u16=p=>v.getUint16(p,le),u32=p=>v.getUint32(p,le);

function tiffGps(v,t){
  const le=v.getUint16(t)===0x4949,u16=p=>v.getUint16(p,le),u32=p=>v.getUint32(p,le);
  const i0=t+u32(t+4),n=u16(i0);let g=0;

function openScanner(title,hint,onCode){

  let done=false,stream=null,raf=0;const vid=$('#scVid'),cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  const finish=async txt=>{if(done)return;done=true;stop();await onCode(txt)};
  const stop=()=>{cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null};scanStop=stop;
  $('#scForm').addEventListener('submit',e=>{e.preventDefault();const v=$('#scManual').value.trim();if(v)finish(v)});

async function devDelReq(r){
  try{chk(await sb.from('requests').delete().eq('id',r.id));await invLog('حذف الطلب #'+r.code,r.item);S.requests=S.requests.filter(x=>x.id!==r.id);closeOv();render();toast('حُذف الطلب')}catch(e){toast('تعذر الحذف: '+e.message)}}

/* ---------- accounts ---------- */
function plabel(l){const n=l.uid&&S.names[l.uid]?.name;return`<b>${esc(ROLES[l.role]?.name||(l.role==='owner'?OWNER_NAME:l.role))}</b>${n?` <span class="muted">(${esc(n)})</span>`:''}`}
const isOwner=()=>S.me?.role==='owner';
const isDev=()=>!!S.me?.hidden;
function loginView(){
  const reg=S.authTab==='register';
  return`<section class="gate"><div class="gcard"><img src="${LOGO}" alt="شعار المنصور ستي" class="glogo"><h2>${reg?'تسجيل جديد':'تسجيل الدخول'}</h2><p>نظام مخازن ومشتريات معمل الإسمنت</p>
  <div class="seg" style="width:100%"><label><input type="radio" name="authTab" value="login" ${reg?'':'checked'}>دخول</label><label><input type="radio" name="authTab" value="register" ${reg?'checked':''}>تسجيل جديد</label></div>
  ${reg?registerView():`<form class="f" id="fLogin" style="width:100%;text-align:start">
  <label class="l">رقم الهاتف أو اسم المستخدم<input id="lUser" class="in" autocomplete="username" autocapitalize="off" dir="ltr" required></label>
  <label class="l">كلمة السر<input id="lPass" class="in" type="password" autocomplete="current-password" dir="ltr" required></label>
  <div class="err" id="lErr"></div><button class="btn pri" type="submit" id="lSub" style="width:100%">دخول</button>
  <p class="small muted" style="margin:0">إذا نسيت كلمة السر راجع مسؤول النظام.</p></form>`}</div></section>`}
function bindLogin(){bindRegister();const f=$('#fLogin');if(!f)return;f.addEventListener('submit',async e=>{e.preventDefault();const b=$('#lSub');b.disabled=true;b.textContent='جارِ الدخول…';
  let u=normDigits($('#lUser').value.trim()).toLowerCase();if(/^[+\d\s-]+$/.test(u))u=u.replace(/\D/g,'');
  const {error}=await sb.auth.signInWithPassword({email:u.includes('@')?u:u+'@'+EMAIL_DOMAIN,password:$('#lPass').value});
  if(error){$('#lErr').textContent='الرقم أو كلمة السر غير صحيحة.';b.disabled=false;b.textContent='دخول';return}
  await afterLogin()})}
function noRoleView(){return`<section class="gate"><div class="gcard"><img src="${LOGO}" alt="" class="glogo"><h2>الحساب موقوف</h2><p>هذا الحساب غير مفعّل أو ليس له صفة. راجع مسؤول النظام.</p><button class="btn" data-a="logout">خروج</button></div></section>`}
function accountsView(){
  const staff=[...S.staff].filter(p=>!p.hidden||p.id===S.me.id).sort((a,b)=>(a.role==='owner'?-1:0)-(b.role==='owner'?-1:0));
  let h=`<div class="head"><div><h2>الحسابات</h2><p>أنشئ حساباً لكل موظف باسم مستخدم ورمز سري وحدد صفته. يدخل الموظف لواجهته فقط.</p></div><button class="btn pri" data-a="accNew">+ حساب جديد</button></div>`;
  h+=`<div class="sec" style="margin-top:14px"><div class="acc">`;
  const used={};staff.forEach(p=>{if(p.active)used[p.role]=(used[p.role]||0)+1});
  staff.forEach(p=>{h+=`<div class="arow"><div class="mono">${p.hidden?'دف':p.role==='owner'?'مس':(ROLES[p.role]?.mono||'؟')}</div><div class="an"><b>${esc(p.full_name||p.username)}</b><span class="muted small"><span class="num">${esc(p.phone||p.username)}</span>${p.status==='pending'?' · <span style="color:var(--warn)">بانتظار الموافقة</span>':''} · ${p.hidden?'مطوّر النظام (مخفي)':p.role==='owner'?OWNER_NAME:esc(ROLES[p.role]?.name||p.role)}${p.active||p.status==='pending'?'':' · <span style="color:var(--bad)">موقوف</span>'}</span></div>
   <div class="acts">${p.id===S.me.id?'<span class="muted small">أنت</span> ':''}<button class="btn sm" data-a="accEdit" data-v="${p.id}">${p.id===S.me.id?'تغيير رمزي':'تعديل'}</button></div></div>`});
  h+=`</div></div>`;
  const missing=Object.keys(ROLES).filter(k=>!used[k]);
  if(missing.length)h+=`<p class="note" style="margin-top:10px">صفات بدون حساب: ${missing.map(k=>ROLES[k].name).join('، ')}</p>`;
  return h}
function genPass(){const c='abcdefghjkmnpqrstuvwxyz23456789';let p='';const a=new Uint32Array(8);crypto.getRandomValues(a);a.forEach(n=>p+=c[n%c.length]);return p}
function accForm(p){const n=!p;p=p||{full_name:'',username:'',role:'machines',active:true};const pw=n?genPass():'';
  const b=`<form class="f" id="fAcc"><div class="fr"><label class="l">الاسم الكامل<input id="aName" class="in" required value="${esc(p.full_name||'')}"></label>
   <label class="l">اسم المستخدم <em>(إنكليزي بدون مسافات)</em><input id="aUser" class="in num" dir="ltr" required pattern="[a-zA-Z0-9._-]{3,30}" value="${esc(p.username)}" ${n?'':'disabled'}></label></div>
   <div class="fr"><label class="l">الصفة<select id="aRole" class="in">${Object.entries(ROLES).map(([k,r])=>`<option value="${k}" ${p.role===k?'selected':''}>${r.name}</option>`).join('')}<option value="owner" ${p.role==='owner'?'selected':''}>${OWNER_NAME}</option></select></label>
   <label class="l">${n?'الرمز السري':'رمز سري جديد'} <em>${n?'':'(اتركه فارغاً بدون تغيير)'}</em><div class="gps"><input id="aPass" class="in num" dir="ltr" value="${pw}" ${n?'required minlength="6"':'minlength="6"'}><button type="button" class="btn" id="aGen">توليد</button></div></label></div>
   ${n?'':`<label class="l" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="aAct" ${p.active?'checked':''}> الحساب مفعّل</label>`}
   <div class="err" id="aErr"></div><div class="acts"><button class="btn pri" type="submit" id="aSub">${n?'إنشاء الحساب':'حفظ'}</button><button class="btn ghost" type="button" data-a="close">إلغاء</button>${n?'':`<button class="btn bad" type="button" id="aDel">حذف الحساب</button><span id="aConf"></span>`}</div>
   <div id="aDone" hidden class="sec" style="background:var(--ok-soft)"></div></form>`;
  overlay('acc',n?'حساب جديد':'تعديل حساب',b);
  $('#aGen').addEventListener('click',()=>{$('#aPass').value=genPass()});
  const call=async body=>{const {data,error}=await sb.functions.invoke('staff-admin',{body});if(error){let m=error.message;try{const j=await error.context.json();m=j.error||m}catch(x){}throw new Error(m)}if(data?.error)throw new Error(data.error);return data};
  $('#fAcc').addEventListener('submit',async e=>{e.preventDefault();const sbt=$('#aSub');sbt.disabled=true;$('#aErr').textContent='';
    try{const role=$('#aRole').value,full_name=$('#aName').value.trim(),pass=$('#aPass').value.trim();
      if(n){const u=$('#aUser').value.trim().toLowerCase();await call({action:'create',username:u,password:pass,full_name,role});
        await invLog('أنشأ حساب '+full_name+' بصفة '+(ROLES[role]?.name||OWNER_NAME),'');
        await loadAll('staff');render();
        const d=$('#aDone');d.hidden=false;d.innerHTML=`<b>تم إنشاء الحساب. أرسل هذه البيانات للموظف:</b><pre class="num" style="white-space:pre-wrap;margin:8px 0 0" id="aCopyT">الرابط: ${esc(location.href.split('#')[0])}
اسم المستخدم: ${esc(u)}
الرمز: ${esc(pass)}</pre><button type="button" class="btn sm" id="aCopy" style="margin-top:8px">نسخ</button>`;
        $('#aCopy').addEventListener('click',()=>{navigator.clipboard?.writeText($('#aCopyT').textContent).then(()=>toast('نُسخ'),()=>{})});sbt.hidden=true}
      else{await call({action:'update',id:p.id,role,full_name,active:$('#aAct').checked,password:pass||undefined});
        await invLog('عدّل حساب '+full_name,(p.role!==role?'الصفة: '+(ROLES[role]?.name||OWNER_NAME):'')+(pass?' · غيّر الرمز':'')+(p.active&&!$('#aAct').checked?' · أوقف الحساب':''));
        await loadAll('staff');closeOv();render();toast('حُفظ')}
    }catch(x){$('#aErr').textContent=x.message;sbt.disabled=false}});
  if(!n)$('#aDel').addEventListener('click',()=>{$('#aConf').innerHTML='<button class="btn bad sm" type="button" id="aDel2">تأكيد الحذف</button>';$('#aDel2').addEventListener('click',async()=>{try{await call({action:'delete',id:p.id});await invLog('حذف حساب '+(p.full_name||p.username),'');await loadAll('staff');closeOv();render();toast('حُذف الحساب')}catch(x){$('#aErr').textContent=x.message}})});
}

const MARK=`<svg viewBox="0 0 24 24" fill="none" stroke="var(--bg)" stroke-width="1.8"><path d="M3 20h18M5 20V9l4 2V9l4 2V9l4 2v9M17 20V5h3v15"/></svg>`;
function render(){
  const app=$('#app');
  const canBack=!!$('#ovroot').innerHTML||S.hist.length>0;
  const dark=isDark();
  let h=`<header class="top"><div class="nav"><button class="ib" data-a="goback" aria-label="رجوع خطوة" title="رجوع" ${canBack?'':'disabled'}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button><button class="ib" data-a="theme" aria-label="${dark?'الإضاءة الصباحية':'الإضاءة الليلية'}" title="${dark?'الإضاءة الصباحية':'الإضاءة الليلية'}">${dark?SUN:MOON}</button></div><div class="brand"><div class="mark"><img src="${LOGO}" alt="شعار المنصور ستي"></div><div style="min-width:0"><h1>المنصور ستي <span class="en">Mansour City</span></h1><p>نظام مخازن ومشتريات معمل الإسمنت</p></div></div>`;
  if(S.me){
    h+=`<div class="who"><span class="wn"><b>${esc(S.me.full_name||S.me.username)}</b><span>${S.role&&!S.view?esc(ROLES[S.role].name):(isDev()?'مطوّر النظام':isOwner()?OWNER_NAME:'')}</span></span>`;
    if(isDev()&&S.view!=='dev')h+=`<button class="btn sm pri" data-a="devPanel">لوحة المطوّر</button>`;
    if(isOwner())h+=`${S.view!=='accounts'?`<button class="btn sm" data-a="accounts">الحسابات</button>`:''}${S.role||S.view?`<button class="btn sm" data-a="switch">الواجهات</button>`:''}`;
    if(seesNotifs()&&S.me.active){const u=unread();h+=`<button class="ib bell" data-a="bell" aria-label="الإشعارات" title="الإشعارات"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>${u?`<span class="bdg num">${u>99?'99+':u}</span>`:''}</button>`}
    h+=`<button class="btn sm ghost" data-a="logout">خروج</button></div>`;
  }
  h+=`</header>`;
  if(S.mode==='loading')h+=`<div class="empty"><b>جارِ التحميل…</b>تحميل الطلبات والمخزون</div>`;
  else if(S.mode==='login')h+=loginView();
  else if(S.me&&S.me.status==='pending')h+=pendingView();
  else if(!S.me||!S.me.active||(!isOwner()&&!ROLES[S.me.role]))h+=noRoleView();
  else if(isOwner()&&S.view==='accounts')h+=accountsView();
  else if(isDev()&&S.view==='dev')h+=devView();
  else h+=S.role?roleHome():rolePicker();
  app.innerHTML=h;bindLogin();
  if(S.open&&$('#ovroot').dataset.kind==='req'){const r=S.requests.find(x=>x.id===S.open);if(r&&r.updatedAt!==S.openSig)openReq(r,true)}
}
function rolePicker(){
  const card=k=>{const ad=ROLES[k].kind==='admin',n=ad?recent24():queueFor(k).length;return`<button class="rc" data-a="role" data-v="${k}"><div class="mono">${ROLES[k].mono}</div><div><strong>${ROLES[k].name}</strong><span>${roleDesc(k)}</span></div><div class="cnt ${n?'':'zero'} ${ad?'watch':''} num" title="${ad?'حركات آخر 24 ساعة':'بانتظار إجرائك'}">${n}</div></button>`};
  return`<section class="pick"><h2>اختر واجهتك</h2>${isOwner()?`<div class="banner" style="background:var(--info-soft);color:var(--info);margin:0 0 14px">أنت مسؤول النظام: تستطيع فتح أي واجهة للمعاينة. الموظفون يدخلون بحساباتهم مباشرة لواجهاتهم.<button class="btn sm" data-a="accounts">إدارة الحسابات</button></div>`:''}<p>كل شخص يدخل بصفته. الرقم على كل بطاقة هو عدد الطلبات التي تنتظر إجراءه الآن، وعند الإدارة هو عدد الحركات خلال آخر 24 ساعة.</p>
  <div class="group-label">رؤساء الأقسام</div><div class="roles">${['machines','elec','mech'].map(card).join('')}</div>
  <div class="group-label">المخزن والمشروع</div><div class="roles">${['store','project'].map(card).join('')}</div>
  <div class="group-label">الإدارة (مراقبة)</div><div class="roles">${['admin1','admin2'].map(card).join('')}</div>
  <div class="group-label">المشتريات</div><div class="roles">${['purchase','purchase2'].map(card).join('')}</div></section>`;
}
function roleDesc(k){return{dept:'رفع طلبات المواد ومتابعتها',store:'فحص الطلبات، الصرف، الاستلام، الرصيد',project:'الموافقة الأولى على الشراء',admin:'مراقبة كل الطلبات والحركات والمصروف',purchase:'الموافقة على الشراء، التنفيذ، الفواتير، GPS'}[ROLES[k].kind]}

function tabsFor(role){
  const k=ROLES[role].kind,q=queueFor(role);
  if(k==='dept')return[['mine','طلباتي',mine(role).filter(r=>!['done','rejected'].includes(r.status)).length],['closed','المنجزة',0]];
  if(k==='store')return[['check','للفحص',S.requests.filter(r=>r.status==='store_check').length],['receive','للاستلام',S.requests.filter(r=>r.status==='receive').length],['inv','المخزون',S.inventory.filter(i=>+i.qty<=+i.min).length],['all','كل الطلبات',0]];
  if(k==='project')return[['approve','للموافقة',q.length],['notif','الإشعارات',unread()],['join','طلبات الانضمام',pendingStaff().length],['all','كل الطلبات',0]];
  if(k==='admin')return[['notif','الإشعارات',unread()],['feed','سجل الحركات',recent24()],['join','طلبات الانضمام',pendingStaff().length],['all','كل الطلبات',0],['sum','الملخص',0]];
  return[['buy','للموافقة والشراء',q.length],['map','المواقع GPS',0],['done','مشترياتي',0]];
}
function roleHome(){
  const role=S.role,R=ROLES[role],tabs=tabsFor(role);
  if(!S.tab||!tabs.find(t=>t[0]===S.tab))S.tab=tabs[0][0];
  const open=S.requests.filter(r=>!['done','rejected'].includes(r.status));
  const crit=open.filter(r=>r.priority==='critical').length;
  const mq=queueFor(role).length;
  const canNew=['dept','project','store'].includes(R.kind);
  let h=`<div class="head"><div><h2>${esc(R.name)}</h2><p>${roleDesc(role)}</p></div>${canNew?`<button class="btn pri" data-a="new">+ طلب مواد جديد</button>`:''}</div>`;
  const spent=S.requests.reduce((s,r)=>s+(r.purchase?.total||0),0);
  h+=`<div class="stats">${R.kind==='admin'?`<div class="stat"><b>${recent24()}</b><span>حركات آخر 24 ساعة</span></div>`:`<div class="stat ${mq?'hot':''}"><b>${mq}</b><span>بانتظار إجرائك</span></div>`}<div class="stat"><b>${open.length}</b><span>طلبات مفتوحة</span></div><div class="stat ${crit?'hot':''}"><b>${crit}</b><span>طارئة - توقف إنتاج</span></div>${R.kind==='admin'||R.kind==='purchase'?`<div class="stat"><b class="num" style="font-size:18px">${money(spent)}</b><span>مجموع المشتريات</span></div>`:`<div class="stat"><b>${S.inventory.filter(i=>+i.qty<=+i.min).length}</b><span>مواد تحت الحد الأدنى</span></div>`}</div>`;
  h+=`<div class="tabs" role="tablist">${tabs.map(([k,t,c])=>`<button class="tab" role="tab" aria-selected="${S.tab===k}" data-a="tab" data-v="${k}">${t}${c?`<span class="c num">${c}</span>`:''}</button>`).join('')}</div>`;
  h+=tabBody(role);
  if(!S.requests.length&&!S.inventory.length)h+=`<div class="empty"><b>لا توجد بيانات بعد</b>ابدأ برفع أول طلب.${isOwner()?`<div class="row"><button class="btn" data-a="demo">تحميل بيانات تجريبية</button></div>`:''}</div>`;
  else if(isOwner()&&(S.requests.some(r=>r.demo)||S.inventory.some(i=>i.demo)))h+=`<div class="banner" style="background:var(--sunk);color:var(--muted)">تحتوي القائمة على بيانات تجريبية معلّمة.<button class="btn sm" data-a="cleardemo">حذف البيانات التجريبية</button></div>`;
  return h;
}
function filtered(list){const q=S.q.trim();if(!q)return list;return list.filter(r=>[r.item,r.code,r.dept,r.area,r.notes].join(' ').includes(q))}
function listView(list,emptyMsg,withSearch){
  const sorted=[...list].sort((a,b)=>({critical:0,urgent:1,normal:2}[a.priority]-{critical:0,urgent:1,normal:2}[b.priority])||b.createdAt-a.createdAt);
  let h=withSearch?`<div class="filters"><input id="q" class="in" placeholder="بحث بالمادة أو الرقم أو القسم…" value="${esc(S.q)}"></div>`:'';
  const f=filtered(sorted);
  if(!f.length)return h+`<div class="empty"><b>لا شيء هنا</b>${emptyMsg}</div>`;
  return h+`<div class="list">${f.map(card).join('')}</div>`;
}
function card(r){
  const st=ST[r.status],p=PRI[r.priority]||PRI.normal;
  return`<button class="card ${r.priority==='critical'?'crit':r.priority==='urgent'?'urg':''}" data-a="open" data-v="${r.id}">
   ${r.productImg?imgTag(r.productImg,'thumb'):`<div class="thumb">${esc((r.unit||'').slice(0,4))}</div>`}
   <div class="mid"><div class="t">${esc(r.item)}</div><div class="meta"><span class="num">#${esc(r.code)}</span><span>${esc(r.dept)}</span><span><span class="num">${nf.format(r.qty)}</span> ${esc(r.unit)}</span>${r.area?`<span>${esc(r.area)}</span>`:''}${r.site?'<span>📍 GPS</span>':''}${r.demo?'<span class="tag-demo">تجريبي</span>':''}</div></div>
   <div class="end"><span class="pill p-${st.c}">${st.t}</span><span class="small muted">${r.priority!=='normal'?`<span class="pill p-${p[1]}">${p[0]}</span> `:''}${ago(r.updatedAt||r.createdAt)}</span></div></button>`;
}
function tabBody(role){
  const t=S.tab,R=ROLES[role];
  if(R.kind==='dept'){const m=mine(role);return t==='mine'?listView(m.filter(r=>!['done','rejected'].includes(r.status)),'لا توجد طلبات مفتوحة لقسمك. اضغط "طلب مواد جديد".'):listView(m.filter(r=>['done','rejected'].includes(r.status)),'لم يكتمل أي طلب بعد.',true)}
  if(t==='check')return listView(S.requests.filter(r=>r.status==='store_check'),'لا توجد طلبات جديدة تحتاج فحص الرصيد.');
  if(t==='receive')return listView(S.requests.filter(r=>r.status==='receive'),'لا توجد مواد مشتراة بانتظار الاستلام.');
  if(t==='inv')return invView();
  if(t==='approve')return listView(queueFor(role),'لا توجد طلبات بانتظار موافقتك.');
  if(t==='sum')return sumView();
  if(t==='feed')return feedView();
  if(t==='notif'){const v=notifView();setTimeout(()=>{if(S.tab==='notif'&&unread()){setSeen()}},4000);return v}
  if(t==='join')return approvalsView();
  if(t==='buy')return listView(queueFor(role),'لا توجد طلبات معتمدة للشراء حالياً.');
  if(t==='map')return mapView();
  if(t==='done')return listView(S.requests.filter(r=>r.purchase),'لم تُسجّل أي عملية شراء بعد.',true);
  return listView(S.requests,'لا توجد طلبات.',true);
}
function allEvents(){
  const ev=[];S.requests.forEach(r=>(r.log||[]).forEach(l=>ev.push({...l,req:r})));
  S.invlog.forEach(l=>ev.push({...l,inv:true}));
  return ev.sort((a,b)=>b.t-a.t)}
function recent24(){const c=Date.now()-864e5;return allEvents().filter(e=>e.t>=c).length}
function feedView(){
  let ev=allEvents();if(S.feedRole)ev=ev.filter(e=>e.role===S.feedRole);
  let h=`<div class="filters"><select id="feedRole" class="in" aria-label="تصفية حسب الشخص"><option value="">كل الأشخاص</option>${Object.entries(ROLES).filter(([k,r])=>r.kind!=='admin').map(([k,r])=>`<option value="${k}" ${S.feedRole===k?'selected':''}>${r.name}</option>`).join('')}</select></div>`;
  if(!ev.length)return h+`<div class="empty"><b>لا توجد حركات بعد</b>كل طلب وموافقة ورفض وشراء وصرف وتعديل بالمخزون يظهر هنا بالوقت والاسم.</div>`;
  let day='';h+=`<div class="feed">`;
  ev.slice(0,300).forEach(e=>{const d=new Date(e.t).toLocaleDateString('ar-IQ-u-nu-latn',{weekday:'long',day:'numeric',month:'long'});
    if(d!==day){day=d;h+=`<div class="fday">${d}</div>`}
    const tm=new Date(e.t).toLocaleTimeString('ar-IQ-u-nu-latn',{hour:'2-digit',minute:'2-digit'});
    const kind=/رفض/.test(e.a)?'bad':/شراء|الفاتورة/.test(e.a)?'accent':/وافق|صرف|استلم/.test(e.a)?'ok':e.inv?'info':'mute';
    h+=e.req?`<button class="fi" data-a="open" data-v="${e.req.id}"><span class="dot d-${kind}"></span><span class="num ft">${tm}</span><span class="fb">${plabel(e)} ${esc(e.a)} — ${esc(e.req.item)} <span class="num muted">#${esc(e.req.code)}</span>${e.req.purchase&&/أكد الشراء/.test(e.a)?` <span class="num">(${money(e.req.purchase.total)})</span>`:''}${e.note?`<small>${esc(e.note)}</small>`:''}</span></button>`
     :`<div class="fi"><span class="dot d-${kind}"></span><span class="num ft">${tm}</span><span class="fb">${plabel(e)} ${esc(e.a)}${e.note?`<small>${esc(e.note)}</small>`:''} <span class="pill p-info">المخزون</span></span></div>`});
  return h+`</div>`}
async function invLog(a,note){const e={t:Date.now(),role:S.role,uid:S.me?.id||null,a,note:note||''};
  S.invlog.unshift(e);try{await sb.from('invlog').insert({data:e})}catch(x){}}
function invView(){

function sumView(){
  const by={};S.requests.forEach(r=>{by[r.dept]=by[r.dept]||{n:0,s:0};by[r.dept].n++;by[r.dept].s+=r.purchase?.total||0});
  const max=Math.max(1,...Object.values(by).map(v=>v.s));
  const cnt={};Object.keys(ST).forEach(k=>cnt[k]=S.requests.filter(r=>r.status===k).length);
  return`<div class="mapgrid"><div class="sec"><h4>المصروف حسب القسم</h4><div class="bars">${Object.entries(by).sort((a,b)=>b[1].s-a[1].s).map(([d,v])=>`<div class="bar"><span>${esc(d)}</span><div class="tr"><i style="width:${v.s/max*100}%"></i></div><span class="num small">${money(v.s)}</span></div>`).join('')||'<span class="muted">لا بيانات</span>'}</div></div>
  <div class="sec"><h4>الطلبات حسب المرحلة</h4><div class="kv">${Object.entries(ST).map(([k,s])=>`<div><span>${s.t}</span><b class="num">${cnt[k]}</b></div>`).join('')}</div></div></div>`;
}
function mapView(){
  const sites=S.requests.filter(r=>r.site&&!['done','rejected'].includes(r.status));
  const plant=S.settings.plant;
  let h=`<div class="sec" style="margin-top:14px"><h4>موقع المعمل (نقطة الانطلاق)</h4><div class="gps"><input id="plantIn" class="in num" placeholder="مثال: 33.3152, 44.3661 أو رابط خرائط Google" value="${plant?plant.lat+', '+plant.lng:''}"><button class="btn" data-a="plantSave">حفظ</button><button class="btn ghost" data-a="plantHere">موقعي الحالي</button></div>${plant&&plant.demo?'<p class="note">الموقع الحالي تجريبي. ضع إحداثيات المعمل الحقيقية.</p>':''}</div>`;
  if(!sites.length)return h+`<div class="empty"><b>لا توجد مواقع عمل محددة</b>الطلبات التي تحمل إحداثيات GPS لمكان العمل تظهر هنا مع المسافة والاتجاهات.</div>`;
  const c=plant||{lat:sites.reduce((s,r)=>s+r.site.lat,0)/sites.length,lng:sites.reduce((s,r)=>s+r.site.lng,0)/sites.length};
  const pts=sites.map(r=>({r,x:(r.site.lng-c.lng)*111.32*Math.cos(c.lat*Math.PI/180),y:(r.site.lat-c.lat)*110.57,d:km(c,r.site)}));
  const maxd=Math.max(.2,...pts.map(p=>Math.hypot(p.x,p.y)));
  const nice=[.25,.5,1,2,5,10,20,50,100,200,500].find(n=>n>=maxd)||maxd;
  const sc=170/nice;const rings=[nice/2,nice];
  let svg=`<svg viewBox="0 0 400 400" role="img" aria-label="مخطط مواقع العمل بالنسبة للمعمل"><rect width="400" height="400" fill="var(--sunk)" rx="8"/>`;
  rings.forEach(rv=>{svg+=`<circle cx="200" cy="200" r="${rv*sc}" fill="none" stroke="var(--line)" stroke-dasharray="4 4"/><text x="${200+rv*sc*.71+4}" y="${200-rv*sc*.71}" font-size="11" fill="var(--muted)" font-family="IBM Plex Sans Arabic,sans-serif">${rv<1?Math.round(rv*1000)+' م':rv+' كم'}</text>`});
  svg+=`<line x1="200" y1="18" x2="200" y2="382" stroke="var(--line)"/><line x1="18" y1="200" x2="382" y2="200" stroke="var(--line)"/><text x="200" y="14" text-anchor="middle" font-size="11" fill="var(--muted)">ش</text>`;
  svg+=`<rect x="192" y="192" width="16" height="16" fill="var(--ink)" rx="3"/><text x="200" y="226" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)" font-family="IBM Plex Sans Arabic,sans-serif">${plant?'المعمل':'المركز'}</text>`;
  pts.forEach(p=>{const X=200+p.x*sc,Y=200-p.y*sc,col=p.r.priority==='critical'?'var(--bad)':'var(--accent)';svg+=`<circle cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r="7" fill="${col}" stroke="var(--surface)" stroke-width="2"/><text x="${X.toFixed(1)}" y="${(Y-11).toFixed(1)}" text-anchor="middle" font-size="11" fill="var(--ink)" font-family="IBM Plex Sans Arabic,sans-serif">${esc(p.r.code)}</text>`});
  svg+=`</svg>`;
  h+=`<div class="mapgrid"><div class="mapbox">${svg}</div><div class="sites">${pts.sort((a,b)=>a.d-b.d).map(p=>`<div class="site"><div class="r1"><b>${esc(p.r.item)}</b><span class="pill p-${ST[p.r.status].c}">${ST[p.r.status].t}</span></div><div class="meta"><span class="num">#${esc(p.r.code)}</span><span>${esc(p.r.area||'')}</span><span>${plant?'يبعد':'عن المركز'} <span class="num">${p.d<1?Math.round(p.d*1000)+' م':p.d.toFixed(1)+' كم'}</span></span></div><div class="r1"><a href="${gdir(p.r.site)}" target="_blank" rel="noopener">الاتجاهات في خرائط Google ↗</a><span class="num small muted">${p.r.site.lat}, ${p.r.site.lng}</span></div></div>`).join('')}</div></div>`;
  return h;
}

function track(r){
  if(r.status==='rejected'){const last=(r.log||[]).length;return`<div class="track"><div class="step done">الطلب</div><div class="step now rej">مرفوض</div></div>`}
  if(r.fromStock)return`<div class="track"><div class="step done">الطلب</div><div class="step done">المخزن</div><div class="step skip">المشروع</div><div class="step skip">الإدارة</div><div class="step skip">الشراء</div><div class="step done">التسليم</div></div>`;
  const cur=r.status==='buying'?'buy':r.status;const idx=STAGES.findIndex(s=>s[0]===cur);
  return`<div class="track"><div class="step done">الطلب</div>${STAGES.map((s,i)=>`<div class="step ${i<idx||cur==='done'?'done':i===idx?'now':''}">${s[1]}${s[0]==='buy'&&r.status==='buying'?' (جارٍ)':''}</div>`).join('')}</div>`;
}

   <div class="photos" style="margin-top:12px">${pu.invoice?(pu.invoice.pdf?`<div class="ph">الفاتورة<a href="/_blob/${esc(pu.invoice.ref.slice(2))}" target="_blank" rel="noopener">فتح فاتورة PDF ↗</a></div>`:`<div class="ph">الفاتورة${imgTag(pu.invoice.ref,'','الفاتورة')}</div>`):'<div class="ph">الفاتورة<div class="none">غير مرفقة</div></div>'}

function actionsHTML(r,role){if(!role||!ROLES[role])return"";
  if(ROLES[role].kind==='admin')return`<p class="note">وضع المراقبة: ترى كل التفاصيل والسجل والفاتورة. ${ST[r.status].who.length?'المرحلة الحالية بيد: '+ST[r.status].who.map(w=>ROLES[w].name).join(' أو '):''}</p>`;
  if(!canAct(r,role))return ST[r.status].who.length?`<p class="note">هذه المرحلة بيد: ${ST[r.status].who.map(w=>ROLES[w].name).join(' أو ')}</p>`:'';
  const note=`<textarea id="actNote" class="in" placeholder="ملاحظة (اختيارية)"></textarea>`;
  const rej=`<button class="btn bad" data-a="do" data-v="reject">رفض</button>`;
  let a='';
  switch(r.status){
    case'store_check':a=`<button class="btn ok" data-a="issueForm">صرف من المخزن</button><button class="btn pri" data-a="do" data-v="toBuy">غير متوفر - تحويل للشراء</button>${rej}`;break;
    case'proj':a=`<button class="btn ok" data-a="do" data-v="projOk">موافقة</button>${rej}`;break;
    case'pur_ok':a=`<button class="btn ok" data-a="do" data-v="purOk">موافقة على الشراء</button>${rej}`;break;
    case'buy':a=`<button class="btn" data-a="do" data-v="startBuy">بدء الشراء</button><button class="btn pri" data-a="buyForm">تأكيد الشراء وإرفاق الفاتورة</button>`;break;
    case'buying':a=`<button class="btn pri" data-a="buyForm">تأكيد الشراء وإرفاق الفاتورة</button>`;break;
    case'receive':a=ROLES[role].kind==='store'?`<button class="btn pri" data-a="rcIssue">إصدار باركود الاستلام</button><span class="note">يمسحه مدير المشتريات عند تسليم المادة</span>`:`<button class="btn pri" data-a="rcScan">مسح باركود الاستلام</button><span class="note">اطلب من مدير المخزن إظهار الباركود</span>`;return`<div class="sec"><h4>الاستلام بالباركود</h4><div class="acts">${a}</div></div>`;

function fileField(id,label,hint,capture){

function bindPreview(id,onFile){const inp=$('#'+id);inp.addEventListener('change',async()=>{const f=inp.files[0];if(!f)return;const pv=$('#'+id+'P');
  if(f.type.startsWith('image/')){const u=URL.createObjectURL(f);pv.outerHTML=`<img id="${id}P" src="${u}" alt="">`}else pv.textContent='PDF';
  inp.closest('.drop').querySelector('.dt span').textContent=f.name;onFile&&onFile(f)})}
function bindGps(btnId,inId,noteId){
  $('#'+btnId).addEventListener('click',()=>{const n=$('#'+noteId);n.className='note';n.textContent='جارِ تحديد الموقع…';
    if(!navigator.geolocation){n.className='note bad';n.textContent='تحديد الموقع غير متاح هنا. الصق الإحداثيات من تطبيق الخرائط.';return}
    navigator.geolocation.getCurrentPosition(p=>{$('#'+inId).value=p.coords.latitude.toFixed(6)+', '+p.coords.longitude.toFixed(6);n.className='note ok';n.textContent='تم تحديد موقعك'},
      ()=>{n.className='note bad';n.textContent='المتصفح لم يسمح بقراءة الموقع هنا. صوّر المكان بكاميرا الهاتف (تُقرأ الإحداثيات من الصورة) أو انسخ الإحداثيات من خرائط Google والصقها.'},{enableHighAccuracy:true,timeout:9000})});
  $('#'+inId).addEventListener('input',()=>{const n=$('#'+noteId),v=$('#'+inId).value;if(!v.trim()){n.textContent='';return}const c=parseCoords(v);n.className=c?'note ok':'note bad';n.textContent=c?'إحداثيات صحيحة: '+c.lat+', '+c.lng:'لم أتعرف على الإحداثيات. اكتبها هكذا: 33.3152, 44.3661'})
}

function newReqForm(){
  const R=ROLES[S.role];
  const b=`<form class="f" id="fNew">

أجب بـ JSON فقط بهذا الشكل وبالعربية:
{"pick":"معرف العرض المختار","summary":"جملتان أو ثلاث توضح لماذا هذا العرض هو الأفضل قيمة مقابل السعر","ranking":[{"id":"معرف العرض","score":رقم من 0 إلى 100,"pros":"أهم ميزة باختصار","cons":"أهم عيب باختصار"}],"warning":"تحذير مهم إن وجد (مثلاً فرق سعر مريب أو قطعة مستعملة لمعدة حرجة)، أو نص فارغ"}`;

    try{const inv=await saveFile($('#fInv').files[0],'فاتورة #'+r.code+' · صُوّرت '+new Date(S.invShotAt||Date.now()).toLocaleString('ar-IQ-u-nu-latn',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})+' · '+ROLES[S.role].name);
      if(!inv){$('#bErr').textContent='أرفق صورة الفاتورة قبل التأكيد.';s.disabled=false;s.textContent='تأكيد الشراء وإرسال للمخزن';return}
      await act(r,'bought',{toast:'تمت الموافقة على الشراء وأُرسلت المادة للمخزن للاستلام',note:$('#bSup').value.trim(),purchase:{supplier:$('#bSup').value.trim(),unitPrice:+u.value,total:+t.value,invoice:inv,loc:parseCoords($('#bGps').value),at:Date.now()}});
      const nr=S.requests.find(x=>x.id===r.id);nr?openReq(nr):closeOv();
    }catch(x){$('#bErr').textContent='تعذر الحفظ: '+(x.message||x.code);s.disabled=false;s.textContent='تأكيد الشراء وإرسال للمخزن'}});
}
function issueForm(r){
  const opts=[...S.inventory].sort((a,b)=>score(b,r)-score(a,r));
  const b=`<form class="f" id="fIss"><p class="muted" style="margin:0">اختر المادة من المخزون. تُخصم الكمية من الرصيد ويُغلق الطلب.</p>
   <div class="fr"><label class="l">المادة في المخزون<select id="iItem" class="in">${opts.map(i=>`<option value="${i.id}">${esc(i.name)} — الرصيد ${nf.format(+i.qty)} ${esc(i.unit)}</option>`).join('')}<option value="">غير مسجلة بالمخزون (صرف بدون خصم)</option></select></label>
   <label class="l">الكمية المصروفة<input id="iQty" class="in num" type="number" min="0" step="any" value="${r.qty}"></label></div>
   <div class="err" id="iErr"></div><div class="acts"><button class="btn ok" type="submit">صرف وإغلاق الطلب</button><button class="btn ghost" type="button" data-a="back">رجوع</button></div></form>`;
  overlay('iss',`صرف من المخزن <span class="num">#${esc(r.code)}</span>`,b);
  $('#fIss').addEventListener('submit',async e=>{e.preventDefault();const id=$('#iItem').value,q=+$('#iQty').value||0;const it=S.inventory.find(i=>i.id===id);
    if(it&&q>+it.qty){$('#iErr').textContent='الرصيد لا يكفي ('+it.qty+' '+it.unit+'). حوّل الطلب للشراء أو قلّل الكمية.';return}
    if(it){await putInv({...it,qty:+(+it.qty-q).toFixed(3)});await invLog('صرف '+q+' '+it.unit+' من '+it.name,'للطلب #'+r.code+' — الرصيد المتبقي '+(+(+it.qty-q).toFixed(3)))}
    await act(r,'issue',{note:$('#actNote')?.value,itemName:it?it.name:''});closeOv()});
}
function score(i,r){const a=i.name,b=r.item;let s=0;a.split(/\s+/).forEach(w=>{if(w.length>1&&b.includes(w))s++});return s}
function invForm(it){
  const n=!it;it=it||{id:uid(),name:'',sku:'',qty:0,unit:'قطعة',min:0,shelf:''};
  const b=`<form class="f" id="fInvE"><div class="fr"><label class="l">اسم المادة<input id="vName" class="in" required value="${esc(it.name)}"></label><label class="l">الرمز<input id="vSku" class="in num" value="${esc(it.sku)}"></label></div>
   <div class="fr"><label class="l">الرصيد<input id="vQty" class="in num" type="number" step="any" value="${it.qty}"></label><label class="l">الوحدة<input id="vUnit" class="in" list="units2" value="${esc(it.unit)}"></label><label class="l">الحد الأدنى<input id="vMin" class="in num" type="number" step="any" value="${it.min}"></label><label class="l">الرف<input id="vShelf" class="in num" value="${esc(it.shelf)}"></label></div>
   <datalist id="units2">${UNITS.map(u=>`<option value="${u}">`).join('')}</datalist>
   <div class="acts"><button class="btn pri" type="submit">حفظ</button>${n?'':`<button class="btn bad" type="button" id="vDel">حذف المادة</button><span id="vConf"></span>`}</div></form>`;
  overlay('inv',n?'إضافة مادة':'تعديل مادة',b);
  $('#fInvE').addEventListener('submit',async e=>{e.preventDefault();const nu={...it,name:$('#vName').value.trim(),sku:$('#vSku').value.trim(),qty:+$('#vQty').value||0,unit:$('#vUnit').value.trim(),min:+$('#vMin').value||0,shelf:$('#vShelf').value.trim()};await putInv(nu);
    await invLog(n?'أضاف مادة للمخزون: '+nu.name:'عدّل مادة بالمخزون: '+nu.name,n?'الرصيد '+nu.qty+' '+nu.unit:(+it.qty!==nu.qty?'الرصيد من '+it.qty+' إلى '+nu.qty+' '+nu.unit:''));closeOv();render();toast('حُفظت المادة')});
  if(!n)$('#vDel').addEventListener('click',()=>{$('#vConf').innerHTML=`<button class="btn bad sm" type="button" id="vDel2">تأكيد الحذف</button>`;$('#vDel2').addEventListener('click',async()=>{await delInv(it.id);await invLog('حذف مادة من المخزون: '+it.name,'كان الرصيد '+it.qty+' '+it.unit);closeOv();toast('حُذفت المادة')})});
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,v=el.dataset.v;
  if(a==='ovbg'&&e.target!==el)return;
  const cur=S.requests.find(x=>x.id===S.open);
  switch(a){
    case'role':if(!isOwner())break;pushHist();S.view=null;S.role=v;S.tab=null;S.q='';saveRole();render();scrollTo(0,0);break;
    case'switch':if(!isOwner())break;pushHist();S.role=null;S.view=null;saveRole();render();break;
    case'tab':if(S.tab===v)break;pushHist();S.tab=v;S.q='';render();break;
    case'goback':goBack();break;
    case'accounts':pushHist();S.view='accounts';closeOv();render();scrollTo(0,0);break;
    case'accNew':accForm();break;
    case'devPanel':pushHist();S.view='dev';S.role=null;closeOv();render();scrollTo(0,0);break;
    case'devTab':{const [r,t]=v.split(':');pushHist();S.view=null;S.role=r;S.tab=t;render();scrollTo(0,0);break}
    case'devReload':await loadAll();render();toast('تم التحديث');break;
    case'rcIssue':if(cur)await rcIssue(cur);break;
    case'rcScan':if(cur)rcScan(cur);break;
    case'apScan':apScan();break;
    case'bell':pushHist();S.tab='notif';closeOv();render();scrollTo(0,0);break;
    case'markSeen':setSeen();render();break;
    case'sysNotif':try{const p=await Notification.requestPermission();toast(p==='granted'?'تم تفعيل التنبيهات':'لم يُسمح بالتنبيهات')}catch(x){}render();break;
    case'openReq':{const r=S.requests.find(x=>x.id===v);if(r)openReq(r);break}
    case'recheck':await afterLogin();break;
    case'accEdit':accForm(S.staff.find(p=>p.id===v));break;
    case'logout':await sb.auth.signOut();S.me=null;S.role=null;S.view=null;S.hist=[];S.mode='login';closeOv();render();break;
    case'theme':document.documentElement.dataset.theme=isDark()?'light':'dark';try{localStorage.setItem('cm_theme',document.documentElement.dataset.theme)}catch(x){}render();break;
    case'open':{const r=S.requests.find(x=>x.id===v);if(r)openReq(r);break}
    case'close':case'ovbg':closeOv();render();break;
    case'back':if(cur)openReq(cur);else closeOv();break;
    case'new':newReqForm();break;
    case'do':if(cur){el.disabled=true;try{await act(cur,v,{note:$('#actNote')?.value})}catch(x){el.disabled=false;toast('تعذر الحفظ: '+(x.message||x.code))}}break;
    case'buyForm':if(cur)buyForm(cur);break;
    case'qAdd':if(cur)quoteForm(cur);break;
    case'qDel':if(cur){el.disabled=true;await quoteDel(cur,v)}break;
    case'qPick':if(cur){el.disabled=true;await quotePick(cur,v)}break;
    case'aiRun':if(cur&&!S.aiBusy)aiRun(cur);break;
    case'issueForm':if(cur)issueForm(cur);break;
    case'invNew':invForm();break;
    case'invEdit':invForm(S.inventory.find(i=>i.id===v));break;
    case'demo':el.disabled=true;await loadDemo();break;
    case'cleardemo':el.disabled=true;await clearDemo();break;
    case'plantSave':{const c=parseCoords($('#plantIn').value);if(!c){toast('اكتب الإحداثيات هكذا: 33.3152, 44.3661');break}await putSettings({plant:c});await invLog('غيّر موقع المعمل',c.lat+', '+c.lng);toast('حُفظ موقع المعمل');break}
    case'plantHere':if(!navigator.geolocation){toast('تحديد الموقع غير متاح هنا');break}navigator.geolocation.getCurrentPosition(p=>{$('#plantIn').value=p.coords.latitude.toFixed(6)+', '+p.coords.longitude.toFixed(6)},()=>toast('المتصفح لم يسمح بقراءة الموقع. الصق الإحداثيات يدوياً.'));break;
  }
});
document.addEventListener('change',e=>{if(e.target.name==='authTab'){S.authTab=e.target.value;render();return}if(e.target.id==='feedRole'){S.feedRole=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=$('#q');if(q){q.focus();q.setSelectionRange(pos,pos)}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#ovroot').innerHTML)goBack()});

/* ---------- boot ---------- */
async function afterLogin(){
  const {data:{user}}=await sb.auth.getUser();if(!user){S.mode='login';render();return}
  const {data:me}=await sb.from('staff').select('id,username,full_name,role,active,status,phone,admin_ok,project_ok,hidden').eq('id',user.id).maybeSingle();
  S.me=me||null;
  if(me&&me.status==='pending'){const {data:c}=await sb.from('staff_codes').select('code').eq('id',me.id).maybeSingle();S.myCode=c?.code||null;S.mode='db';render();
    if(!S.pendSub){S.pendSub=setInterval(async()=>{const {data:m2}=await sb.from('staff').select('status,active,admin_ok,project_ok').eq('id',me.id).maybeSingle();if(m2&&(m2.status!==S.me.status||m2.admin_ok!==S.me.admin_ok||m2.project_ok!==S.me.project_ok)){if(m2.status==='active'){clearInterval(S.pendSub);S.pendSub=null;await afterLogin()}else{Object.assign(S.me,m2);render()}}},5000)}
    return}
  S.mode='loading';render();
  if(!me||!me.active){S.mode='db';render();return}
  if(me.role!=='owner'){S.role=me.role}else if(S.role&&!ROLES[S.role])S.role=null;
  if(me.hidden&&!S.role&&!S.view)S.view='dev';
  await loadAll();S.mode='db';render();subscribe();
}
render();
(async()=>{const {data:{session}}=await sb.auth.getSession();if(session)await afterLogin();else{S.mode='login';render()}})();
</script>
</body>
