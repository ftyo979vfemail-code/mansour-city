  const pts=sites.map(r=>({r,x:(r.site.lng-c.lng)*111.32*Math.cos(c.lat*Math.PI/180),y:(r.site.lat-c.lat)*110.57,d:km(c,r.site)}));
  const maxd=Math.max(.2,...pts.map(p=>Math.hypot(p.x,p.y)));
  const nice=[.25,.5,1,2,5,10,20,50,100,200,500].find(n=>n>=maxd)||maxd;
  const sc=170/nice;const rings=[nice/2,nice];
  let svg=`<svg viewBox="0 0 400 400" role="img" aria-label="مخطط مواقع العمل بالنسبة للمعمل"><rect width="400" height="400" fill="var(--sunk)" rx="8"/>`;
  rings.forEach(rv=>{svg+=`<circle cx="200" cy="200" r="${rv*sc}" fill="none" stroke="var(--line)" stroke-dasharray="4 4"/><text x="${200+rv*sc*.71+4}" y="${200-rv*sc*.71}" font-size="11" fill="var(--muted)" font-family="IBM Plex Sans Arabic,sans-serif">${rv<1?Math.round(rv*1000)+' م':rv+' كم'}</text>`});
  svg+=`<line x1="200" y1="18" x2="200" y2="382" stroke="var(--line)"/><line x1="18" y1="200" x2="382" y2="200" stroke="var(--line)"/><text x="200" y="14" text-anchor="middle" font-size="11" fill="var(--muted)">ش</text>`;
  svg+=`<rect x="192" y="192" width="16" height="16" fill="var(--ink)" rx="3"/><text x="200" y="226" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)" font-family="IBM Plex Sans Arabic,sans-serif">${plant?'المعمل':'المركز'}</text>`;
  pts.forEach(p=>{const X=200+p.x*sc,Y=200-p.y*sc,col=p.r.priority==='critical'?'var(--bad)':'var(--accent)';svg+=`<circle cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r="7" fill="${col}" stroke="var(--surface)" stroke-width="2"/><text x="${X.toFixed(1)}" y="${(Y-11).toFixed(1)}" text-anchor="middle" font-size="11" fill="var(--ink)" font-family="IBM Plex Sans Arabic,sans-serif">${esc(p.r.code)}</text>`});
  svg+=`</svg>`;
  h+=`<div class="mapgrid"><div class="mapbox">${svg}</div><div class="sites">${pts.sort((a,b)=>a.d-b.d).map(p=>`<div class="site"><div class="r1"><b>${esc(p.r.item)}</b><span class="pill p-${ST[p.r.status].c}">${ST[p.r.status].t}</span></div><div class="meta"><span class="num">#${esc(p.r.code)}</span><span>${esc(p.r.area||'')}</span><span>${plant?'يبعد':'عن المركز'} <span class="num">${p.d<1?Math.round(p.d*1000)+' م':p.d.toFixed(1)+' كم'}</span></span></div><div class="r1"><a href="${gdir(p.r.site)}" target="_blank" rel="noopener">الاتجاهات في خرائط Google ↗</a><span class="num small muted">${p.r.site.lat}, ${p.r.site.lng}</span></div></div>`).join('')}</div></div>`;
  return h;
}

function track(r){
  if(r.status==='rejected'){const last=(r.log||[]).length;return`<div class="track"><div class="step done">الطلب</div><div class="step now rej">مرفوض</div></div>`}
  if(r.fromStock)return`<div class="track"><div class="step done">الطلب</div><div class="step done">المخزن</div><div class="step skip">المشروع</div><div class="step skip">الإدارة</div><div class="step skip">الشراء</div><div class="step done">التسليم</div></div>`;
  const cur=r.status==='buying'?'buy':r.status==='pur_ok'?'proj':r.status;const idx=STAGES.findIndex(s=>s[0]===cur);
  return`<div class="track"><div class="step done">الطلب</div>${STAGES.map((s,i)=>`<div class="step ${i<idx||cur==='done'?'done':i===idx?'now':''}">${s[1]}${s[0]==='buy'&&r.status==='buying'?' (جارٍ)':''}</div>`).join('')}</div>`;
}

function actionsHTML(r,role){if(!role||!ROLES[role])return"";
  if(ROLES[role].kind==='admin'&&!canAct(r,role))return`<p class="note">وضع المراقبة: ترى كل التفاصيل والسجل والفاتورة. ${ST[r.status].who.length?'المرحلة الحالية بيد: '+ST[r.status].who.map(w=>ROLES[w].name).join(' أو '):''}</p>`;
  if(!canAct(r,role))return ST[r.status].who.length?`<p class="note">هذه المرحلة بيد: ${ST[r.status].who.map(w=>ROLES[w].name).join(' أو ')}</p>`:'';
  const note=`<textarea id="actNote" class="in" placeholder="ملاحظة (اختيارية)"></textarea>`;
  const rej=`<button class="btn bad" data-a="do" data-v="reject">رفض</button>`;
  let a='';
  switch(r.status){
    case'store_check':a=`<button class="btn ok" data-a="issueForm">صرف من المخزن</button><button class="btn pri" data-a="do" data-v="toBuy">غير متوفر - تحويل للشراء</button>${rej}`;break;
    case'proj':a=`<button class="btn ok" data-a="do" data-v="projOk">موافقة</button>${rej}`;break;

    case'buy':a=`<button class="btn" data-a="do" data-v="startBuy">بدء الشراء</button><button class="btn pri" data-a="buyForm">تأكيد الشراء وإرفاق الفاتورة</button>`;break;
    case'buying':a=`<button class="btn pri" data-a="buyForm">تأكيد الشراء وإرفاق الفاتورة</button>`;break;
    case'receive':a=role==='receiver'?`<button class="btn pri" data-a="rcIssue">إصدار باركود الاستلام</button><span class="note">يمسحه مندوب المشتريات عند تسليم المادة</span>`:role==='project'?`<button class="btn" data-a="rcIssue">إصدار باركود الاستلام</button><button class="btn pri" data-a="rcScan">مسح باركود الاستلام</button>`:ROLES[role].kind==='store'?`<button class="btn pri" data-a="rcIssue">إصدار باركود الاستلام</button><span class="note">يمسحه مندوب المشتريات عند تسليم المادة</span>`:`<button class="btn pri" data-a="rcScan">مسح باركود الاستلام</button><span class="note">اطلب من مدير المخزن إظهار الباركود</span>`;return`<div class="sec"><h4>الاستلام بالباركود</h4><div class="acts">${a}</div></div>`;
  }

  return`<div class="sec"><h4>إجراؤك</h4><div class="acts">${note}${a}</div></div>`;
}

function bindGps(btnId,inId,noteId){

const sameDayT=t=>new Date(t).toDateString()===new Date().toDateString();
const sameMonthT=t=>{const a=new Date(t),b=new Date();return a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear()};
function expEntries(wh){const E=[];const ok=w=>!wh||w===wh;
  S.requests.forEach(r=>{const w=whOf(r);if(!ok(w))return;
    if(r.issue)E.push({t:r.issue.t||r.updatedAt,k:'issue',d:`${r.issue.name} × ${nf.format(r.issue.qty)} ${r.issue.unit||''} ← ${r.dept} #${r.code}`,a:r.issue.total||0,uid:r.issue.uid,wh:w});
    if(r.purchase?.total)E.push({t:r.purchase.at||r.updatedAt,k:'buy',d:`${r.item} × ${nf.format(r.qty)} — ${r.purchase.supplier||''}`,a:+r.purchase.total,wh:w,uid:(r.log||[]).filter(l=>/الشراء|اشترى/.test(l.a)).slice(-1)[0]?.uid});});
  if(ok('mach')){S.machines.forEach(m=>(m.issues||[]).forEach(x=>E.push({t:x.t,k:'issue',d:`${x.item} × ${nf.format(x.qty)} ${x.unit||''} ← ${m.name}`,a:x.total||0,uid:x.uid,wh:'mach'})));
    const f=fuelItem();(f?.log||[]).forEach(l=>{if(l.k==='adj')return;if(l.k==='in')E.push({t:l.at||l.t,k:'fuelin',d:`استلام كاز ${nf.format(l.l)} لتر${l.sup?' — '+l.sup:''}`,a:l.p?l.l*l.p:0,uid:l.uid,wh:'mach'});else E.push({t:l.at||l.t,k:'fuelout',d:`كاز ${nf.format(l.l)} لتر ← ${l.to||''}`,a:l.p?l.l*l.p:0,uid:l.uid,wh:'mach'})})}
  S.invlog.forEach(e=>{if(e.kind==='out'&&ok(e.wh))E.push({t:e.at||e.t,k:'out',d:`${e.item} × ${nf.format(e.qty)} ${e.unit||''}${e.to?' ← '+e.to:''}${e.dept?' ('+e.dept+')':''}`,a:e.total||0,uid:e.uid,wh:e.wh})});
  (S.invoices||[]).forEach(v=>{if(ok(v.wh))E.push({t:v.at||v.createdAt,k:v.kind==='in'?'in':'inv',d:`فاتورة${v.number?' #'+v.number:''} ${v.supplier||''}${v.lines?.length?' — '+v.lines.length+' مادة':''}`,a:+v.total||0,uid:v.uid,wh:v.wh,id:v.id})});
  return E.sort((a,b)=>b.t-a.t)}

/* bulk import of products & prices from a spreadsheet */
let XLSXP=null;
function loadXLSX(){if(window.XLSX)return Promise.resolve(window.XLSX);if(XLSXP)return XLSXP;XLSXP=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>ok(window.XLSX);s.onerror=()=>{XLSXP=null;no(new Error('تعذر تحميل قارئ الملفات. تأكد من الإنترنت.'))};document.head.appendChild(s)});return XLSXP}
const toNum=v=>{if(typeof v==='number')return v;const s=String(v??'').replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632).replace(/[۰-۹]/g,d=>d.charCodeAt(0)-1776).replace(/[٬,\s]/g,'').replace('٫','.').replace(/[^\d.\-]/g,'');return s===''?null:+s};
function mapCols(head){const m={};const H=head.map(h=>String(h||'').trim().toLowerCase());
  const find=(keys)=>H.findIndex(h=>keys.some(k=>h.includes(k)));
  m.name=find(['اسم','المادة','مادة','المنتج','منتج','الصنف','صنف','البيان','item','name','product','description']);
  m.price=find(['سعر','السعر','price','cost','الكلفة']);m.qty=find(['كمية','الكمية','العدد','عدد','رصيد','الرصيد','qty','quantity','stock']);
  m.unit=find(['وحدة','الوحدة','unit']);m.sku=find(['رمز','الرمز','كود','code','sku','رقم القطعة']);m.min=find(['حد','الحد','min']);return m}
function importForm(){const fixed=isStoreRole(S.role)?myWh(S.role):null;
  overlay('imp','رفع ملف أسعار ومواد',`<div class="f"><p class="muted" style="margin:0">اسحب ملف Excel أو CSV أو PDF، أو صورة قائمة الأسعار، فيه أسماء المواد وأسعارها (وممكن الكمية والوحدة والرمز). النظام يقرا الملف ويرتبه وحده.</p>
   <label class="drop" id="impDrop" style="display:block;text-align:center;padding:26px 14px;border:2px dashed var(--line);border-radius:12px;cursor:pointer"><input type="file" id="impF" accept=".xlsx,.xls,.xlsm,.ods,.csv,.pdf,image/*,application/pdf,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" hidden><div style="font-size:30px">📥</div><b>اسحب الملف هنا أو اضغط للاختيار</b><div class="small muted">Excel · CSV · PDF · صورة</div></label>
   <div id="impBody"></div></div>`);
  const drop=$('#impDrop'),inp=$('#impF');
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.style.borderColor='var(--accent)'}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.style.borderColor=''}));
  drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)readImport(f,fixed)});
  inp.addEventListener('change',()=>{if(inp.files[0])readImport(inp.files[0],fixed)})}
async function readImportAI(f,fixed){const box=$('#impBody');const isPdf=f.type==='application/pdf'||/\.pdf$/i.test(f.name);
  box.innerHTML=`<div class="rcbox"><div class="spin"></div><b>جارِ قراءة ${isPdf?'ملف PDF':'الصورة'} بالذكاء الاصطناعي…</b><span class="note">ممكن ياخذ دقيقة إذا القائمة طويلة</span></div>`;
  if(isPdf&&f.size>20*1024*1024)throw new Error('ملف الـPDF كبير (أكثر من 20 ميغا). قسّمه أو صوّر الصفحات.');
  const blob=isPdf?f:await compress(f,2000,.85);const b64=(await blobToData(blob)).split(',')[1];
  const {data,error}=await sb.functions.invoke('scan-list',{body:{mode:'prices',image:b64,mime:isPdf?'application/pdf':'image/jpeg'}});
  let code=data?.code;if(error){try{code=(await error.context.json()).code}catch(x){code='upstream'}}
  if(code)throw new Error({no_key:'القراءة تحتاج تفعيل مفتاح الذكاء الاصطناعي. راجع مطوّر النظام.',rate_limited:'طلبات كثيرة، حاول بعد دقيقة.',bad_image:'الملف كبير أو تالف.',forbidden:'غير متاح لصفتك.'}[code]||'تعذرت قراءة الملف. جرّب صورة أوضح أو ملف Excel.');
  const items=(data.items||[]).map(x=>({name:x.name,price:x.price,qty:x.qty,unit:x.unit||'',sku:x.sku||'',min:null,on:true}));
  if(!items.length)throw new Error('ما لكيت مواد وأسعار بالملف.');
  S.imp={items,fixed,file:f.name+(data.supplier?' — '+data.supplier:''),supplier:data.supplier||''};drawImport()}
async function readImport(f,fixed){const box=$('#impBody');box.innerHTML='<p class="note">جارِ قراءة الملف…</p>';
  try{if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)||f.type.startsWith('image/')||/\.(jpe?g|png|webp|heic)$/i.test(f.name)){await readImportAI(f,fixed);return}
    if(/\.(docx?|pptx?|zip|rar)$/i.test(f.name))throw new Error('هذا ملف Word أو مضغوط. احفظه PDF أو Excel، أو صوّر القائمة، وارفعه.');const X=await loadXLSX();let wb;if(/\.csv$/i.test(f.name)||f.type==='text/csv'){const txt=new TextDecoder('utf-8').decode(await f.arrayBuffer());wb=X.read(txt,{type:'string'})}else wb=X.read(new Uint8Array(await f.arrayBuffer()),{type:'array'});
    const rows=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:true}).filter(r=>r.some(c=>String(c).trim()!==''));
    if(!rows.length)throw new Error('الملف فارغ');
    let hi=rows.findIndex(r=>{const m=mapCols(r);return m.name>=0&&(m.price>=0||m.qty>=0)});let cols;
    if(hi<0||hi>5){hi=-1;cols={name:0,price:1,qty:2,unit:3,sku:-1,min:-1}}else cols=mapCols(rows[hi]);
    const items=rows.slice(hi+1).map(r=>({name:String(r[cols.name]??'').trim(),price:cols.price>=0?toNum(r[cols.price]):null,qty:cols.qty>=0?toNum(r[cols.qty]):null,unit:cols.unit>=0?String(r[cols.unit]||'').trim():'',sku:cols.sku>=0?String(r[cols.sku]||'').trim():'',min:cols.min>=0?toNum(r[cols.min]):null,on:true})).filter(x=>x.name&&!/^(المجموع|total)/i.test(x.name)&&!/[\u0000-\u0008\uFFFD]/.test(x.name)&&!/^%PDF|obj$|stream$/.test(x.name)).slice(0,2000);
    if(!items.length)throw new Error('ما لكيت أسماء مواد بالملف. خلي أول عمود اسم المادة والثاني السعر.');
    S.imp={items,fixed,file:f.name};drawImport()}catch(x){box.innerHTML=`<div class="err">${esc(x.message||String(x))}</div>`}}
function impWh(){return S.imp.fixed||$('#impW')?.value||'main'}
function drawImport(){const P=S.imp,wh=P.fixed||S.impWh||'main';const exist=n=>S.inventory.find(i=>i.kind!=='fuel'&&(i.wh==='mach'?'mach':'main')===wh&&i.name.trim()===n);

   <div class="fr">${P.fixed?`<span class="pill p-info" style="align-self:center">${whName(P.fixed)}</span>`:`<label class="l">المخزن<select id="impW" class="in"><option value="main" ${wh==='main'?'selected':''}>المخزن الرئيسي</option><option value="mach" ${wh==='mach'?'selected':''}>مخزن الآليات</option></select></label>`}
   <label class="l">الكميات اللي بالملف<select id="impQ" class="in"><option value="add">تنضاف على الرصيد</option><option value="set">تصير هي الرصيد</option><option value="skip">تُهمل (بس الأسعار)</option></select></label></div>
   <div class="tbl-wrap" style="max-height:340px;overflow:auto"><table><thead><tr><th><input type="checkbox" id="impAll" checked></th><th>المادة</th><th>السعر</th><th>الكمية</th><th>الحالة</th></tr></thead><tbody>${P.items.map((x,i)=>{const ex=exist(x.name);return`<tr><td><input type="checkbox" class="impOn" data-i="${i}" ${x.on?'checked':''}></td><td>${esc(x.name)}${x.unit?` <span class="muted small">${esc(x.unit)}</span>`:''}</td><td class="num">${x.price!=null?money(x.price):'—'}${ex&&ex.price&&x.price!=null&&+ex.price!==x.price?` <span class="muted small">(كان ${money(+ex.price)})</span>`:''}</td><td class="num">${x.qty!=null?nf.format(x.qty):'—'}</td><td>${ex?'<span class="pill p-info">تحديث</span>':'<span class="pill p-ok">جديدة</span>'}</td></tr>`}).join('')}</tbody></table></div>
   <div class="err" id="impE"></div><div class="acts"><button class="btn pri" id="impGo">حفظ ${nNew+nUpd} مادة بالمخزون</button><button class="btn ghost" data-a="close">إلغاء</button></div>`;
  $('#impW')?.addEventListener('change',e=>{S.impWh=e.target.value;drawImport()});
  $('#impAll').addEventListener('change',e=>{P.items.forEach(x=>x.on=e.target.checked);drawImport()});

  $('#impGo').addEventListener('click',async()=>{const btn=$('#impGo'),mode=$('#impQ').value,list=P.items.filter(x=>x.on);if(!list.length)return;btn.disabled=true;let n=0;
    try{for(const x of list){const ex=exist(x.name);let it;
        if(ex){it=clean(ex);if(x.price!=null)it.price=x.price;if(x.qty!=null&&mode==='add')it.qty=+((+it.qty||0)+x.qty).toFixed(3);if(x.qty!=null&&mode==='set')it.qty=x.qty;if(x.unit)it.unit=x.unit;if(x.sku)it.sku=x.sku;if(x.min!=null)it.min=x.min}
        else it={id:uid(),name:x.name,sku:x.sku||'',qty:mode==='skip'?0:(x.qty||0),unit:x.unit||'قطعة',min:x.min||0,shelf:'',wh,price:x.price,supplier:P.supplier||''};
        await putInv(it);n++;if(n%10===0)btn.textContent=`جارِ الحفظ ${n} من ${list.length}…`}

/* remembered names: tap a field to see every name entered before */
function sugList(kind){const c={};const put=(v,w=1)=>{v=String(v||'').trim();if(v.length>1)c[v]=(c[v]||0)+w};
  const fuel=(fuelItem()?.log||[]);
  if(kind==='drivers'){S.deliveries.forEach(d=>put(d.driver));fuel.forEach(l=>put(l.driver));S.machines.forEach(m=>{put(m.operator);(m.fuel||[]).forEach(f=>put(f.driver))})}
  if(kind==='suppliers'){S.deliveries.forEach(d=>put(d.supplier));(S.invoices||[]).forEach(v=>put(v.supplier));S.requests.forEach(r=>{put(r.purchase?.supplier);(r.quotes||[]).forEach(q=>put(q.supplier))});fuel.forEach(l=>put(l.sup));S.inventory.forEach(i=>put(i.supplier))}
  if(kind==='materials')S.deliveries.forEach(d=>put(d.material));
  if(kind==='trucks')S.deliveries.forEach(d=>put(d.truck));
  if(kind==='dests'){S.deliveries.forEach(d=>put(d.dest));(typeof AREAS!=='undefined'?AREAS:[]).forEach(a=>put(a,0.1))}
  if(kind==='areas'){S.requests.forEach(r=>put(r.area));(typeof AREAS!=='undefined'?AREAS:[]).forEach(a=>put(a,0.1))}
  if(kind==='fueltargets')fuel.forEach(l=>{if(!l.mid)put(l.to)});
  if(kind==='people'){S.machines.forEach(m=>{put(m.operator);(m.issues||[]).forEach(x=>put(x.to))});S.deliveries.forEach(d=>put(d.driver));S.staff.forEach(p=>put(p.full_name,0.5))}
  if(kind==='items'){S.inventory.forEach(i=>{if(i.kind!=='fuel')put(i.name,2)});S.requests.forEach(r=>put(r.item))}
  return Object.entries(c).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ar')).map(x=>x[0])}
function sugShow(inp){sugHide();const all=sugList(inp.dataset.sug);if(!all.length)return;const q=inp.value.trim();
  const L=(q?all.filter(n=>n.includes(q)&&n!==q):all).slice(0,40);if(!L.length)return;
  const box=document.createElement('div');box.className='sugbox';box.id='sugbox';
  box.innerHTML=`<div class="sugh">${q?'أسماء مطابقة':'الأسماء السابقة'} <span class="num">(${L.length})</span></div>`+L.map(n=>`<button type="button" class="sugi">${esc(n)}</button>`).join('');
  box.addEventListener('mousedown',e=>e.preventDefault());
  box.addEventListener('click',e=>{const b=e.target.closest('.sugi');if(!b)return;inp.value=b.textContent;inp.dispatchEvent(new Event('input',{bubbles:true}));inp.dispatchEvent(new Event('change',{bubbles:true}));sugHide();
    if(inp.id==='dDriver'){const d=S.deliveries.find(x=>x.driver===inp.value&&x.driverPhone);const ph=$('#dPhone');if(d&&ph&&!ph.value)ph.value=d.driverPhone}
    const nx=inp.closest('form')?.querySelectorAll('input:not([type=hidden]):not([disabled]),select,textarea');if(nx){const a=[...nx],i=a.indexOf(inp);if(a[i+1])a[i+1].focus()}});
  inp.insertAdjacentElement('afterend',box);inp._sug=box}
function sugHide(){const b=$('#sugbox');if(b)b.remove()}
document.addEventListener('focusin',e=>{if(e.target.matches?.('input[data-sug]'))sugShow(e.target);else if(!e.target.closest?.('#sugbox'))setTimeout(()=>{if(!document.activeElement?.matches?.('input[data-sug]'))sugHide()},250)});

function scrollToList(){setTimeout(()=>{const el=$('#app .filters')||$('#app .list')||$('#app .tbl-wrap');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},60)}
function reqSheet(title,list,empty){overlay('stat',`${title} <span class="num muted">(${list.length})</span>`,listView(list,empty))}
function statGo(k){
  const role=S.role,open=reqsFor(role).filter(r=>!['done','rejected'].includes(r.status)),tabs=role?tabsFor(role).map(t=>t[0]):[];
  const toTab=t=>{if(tabs.includes(t)){closeOv();S.tab=t;render();scrollToList();return true}return false};
  if(k.startsWith('tab:')){toTab(k.slice(4));return}
  if(k.startsWith('m:')){closeOv();S.mFilter=k.slice(2);render();scrollToList();return}
  if(k.startsWith('d:')){closeOv();S.dlvF=k.slice(2);render();scrollToList();return}
  if(k.startsWith('o:')){S.orgF=k.slice(2);render();scrollToList();return}
  switch(k){
    case'mine':{const q=queueFor(role);const tab=tabs[0];if(q.length&&tab&&['approve','buy','check','receive'].includes(tab)){toTab(tab);return}reqSheet('بانتظار إجرائك',q,'ماكو شي بانتظارك هسه. 👍');return}
    case'open':reqSheet('الطلبات المفتوحة',open,'ماكو طلبات مفتوحة.');return;
    case'crit':reqSheet('طارئة — توقف إنتاج',open.filter(r=>r.priority==='critical'),'ماكو طلبات طارئة.');return;
    case'all':reqSheet('كل الطلبات',reqsFor(role),'ماكو طلبات بعد.');return;
    case'recent':if(!toTab('feed'))reqSheet('آخر الحركات',S.requests.filter(r=>Date.now()-(r.updatedAt||r.createdAt)<864e5),'ماكو حركات آخر 24 ساعة.');return;
    case'low':{if(toTab('inv'))return;const items=invOf(role).filter(i=>+i.qty<=+i.min);
      overlay('stat',`مواد تحت الحد الأدنى <span class="num muted">(${items.length})</span>`,items.length?`<div class="tbl-wrap"><table><thead><tr><th>المادة</th><th>الرصيد</th><th>الحد الأدنى</th></tr></thead><tbody>${items.map(i=>`<tr class="low"><td>${esc(i.name)}</td><td class="num">${nf.format(+i.qty)} ${esc(i.unit||'')}</td><td class="num">${nf.format(+i.min)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><b>كل المواد فوق الحد الأدنى</b>ماكو نقص بالمخزون.</div>`);return}
    case'spent':{const b=S.requests.filter(r=>r.purchase?.total).sort((a,c)=>(c.purchase.at||0)-(a.purchase.at||0));const tot=b.reduce((a,r)=>a+r.purchase.total,0);
      const by={};b.forEach(r=>{by[r.dept]=(by[r.dept]||0)+r.purchase.total});
      overlay('stat',`مجموع المشتريات <span class="num muted">(${b.length})</span>`,b.length?`<div class="sec"><div class="kv"><div><span>المجموع الكلي</span><b class="num">${money(tot)}</b></div>${Object.entries(by).sort((a,c)=>c[1]-a[1]).map(([d,v])=>`<div><span>${esc(d)}</span><b class="num">${money(v)}</b></div>`).join('')}</div></div><div class="list">${b.map(r=>card(r).replace('</button>',`<div class="num" style="font-weight:700;white-space:nowrap">${money(r.purchase.total)}</div></button>`)).join('')}</div>`:`<div class="empty"><b>ماكو مشتريات بعد</b>تظهر هنا كل عملية شراء مع فاتورتها.</div>`);return}
  }
}

/* ===== GPS: live location of purchasing reps ===== */
const TRACK_ROLES=['buyer','purchase','purchase2'];
const seesReps=()=>['owner','project','admin1','admin2'].includes(S.me?.role);
const LOC={watch:null,hb:null,state:'off',last:null,sentAt:0,sentPos:null,trailAt:0,trailPos:null};
function meters(a,b){const R=6371000,t=x=>x*Math.PI/180,dl=t(b.lat-a.lat),dg=t(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function tracks(){return S.me?.active&&TRACK_ROLES.includes(S.me.role)}
function setLoc(st){if(LOC.state!==st){LOC.state=st;if(!$('#ovroot')?.dataset.kind)render()}}
function startTracking(force){
  if(!tracks()||LOC.watch!==null)return;
  if(!navigator.geolocation){setLoc('na');return}
  LOC.state='wait';if(force)render();
  LOC.watch=navigator.geolocation.watchPosition(onPos,e=>setLoc(e.code===1?'denied':'err'),{enableHighAccuracy:true,maximumAge:15000,timeout:45000});
  LOC.hb=setInterval(()=>{if(LOC.last&&document.visibilityState==='visible'&&Date.now()-LOC.sentAt>120000)sendLoc(LOC.last)},60000);
}
function stopTracking(){if(LOC.watch!==null)navigator.geolocation.clearWatch(LOC.watch);clearInterval(LOC.hb);LOC.watch=null;LOC.hb=null;LOC.state='off';LOC.last=null;LOC.sentPos=null}
function onPos(p){const c={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy||0),t:Date.now()};LOC.last=c;
  const moved=LOC.sentPos?meters(LOC.sentPos,c):1e9;if(moved>30||Date.now()-LOC.sentAt>60000)sendLoc(c);setLoc('on')}
async function sendLoc(c){if(!tracks())return;LOC.sentAt=Date.now();LOC.sentPos=c;
  try{await sb.from('staff_locations').upsert({id:S.me.id,lat:c.lat,lng:c.lng,acc:c.acc,sharing:true});
    if(!LOC.trailPos||meters(LOC.trailPos,c)>80||Date.now()-LOC.trailAt>300000){LOC.trailAt=Date.now();LOC.trailPos=c;await sb.from('loc_trail').insert({uid:S.me.id,lat:c.lat,lng:c.lng,acc:c.acc})}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&tracks()&&LOC.watch!==null)navigator.geolocation.getCurrentPosition(onPos,()=>{},{enableHighAccuracy:true,maximumAge:10000,timeout:30000})});
function gpsBanner(){if(!tracks())return'';
  if(LOC.state==='on')return`<div class="banner gpsOn"><span class="gdot"></span><span><b>الـGPS شغّال</b> — موقعك يظهر لمدير المشروع والإدارة أثناء فتح التطبيق${LOC.last?` · دقة <span class="num">${LOC.last.acc}</span> م`:''}</span></div>`;
  if(LOC.state==='denied')return`<div class="banner gpsBad"><span><b>الموقع مقفول</b> — لازم تسمح بالموقع حتى تشتغل. اضغط على 🔒 جنب الرابط ← الأذونات ← الموقع ← سماح، وبعدين اضغط «تشغيل».</span><button class="btn sm" data-a="locRetry">تشغيل الـGPS</button></div>`;
  if(LOC.state==='na')return`<div class="banner gpsBad"><span>هذا المتصفح ما يدعم تحديد الموقع. افتح الرابط من Chrome أو Safari.</span></div>`;
  if(LOC.state==='err')return`<div class="banner gpsBad"><span>ما كدرنا نحدد موقعك. شغّل الموقع (GPS) من إعدادات الموبايل.</span><button class="btn sm" data-a="locRetry">إعادة المحاولة</button></div>`;
  return`<div class="banner"><span>📍 جارِ تشغيل الـGPS… إذا طلع لك سؤال «السماح بالموقع» اختار <b>سماح</b>.</span></div>`}
function autoGps(inId,noteId){const i=$('#'+inId),n=$('#'+noteId);if(!i||i.value.trim())return;
  const put=c=>{if(i.value.trim())return;i.value=c.lat+', '+c.lng;n.className='note ok';n.textContent='تم تحديد موقعك تلقائياً (دقة '+c.acc+' م)'};
  if(LOC.last&&Date.now()-LOC.last.t<90000){put(LOC.last);return}
  if(!navigator.geolocation)return;n.className='note';n.textContent='جارِ تحديد موقعك…';
  navigator.geolocation.getCurrentPosition(p=>put({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy||0)}),()=>{if(!i.value.trim()){n.className='note bad';n.textContent='اسمح بالموقع أو اضغط «موقعي الحالي».'}},{enableHighAccuracy:true,maximumAge:30000,timeout:30000})}

function repsView(){setTimeout(initRepMap,0);

function loadLeaflet(){if(REPMAP.lib)return REPMAP.lib;REPMAP.lib=new Promise((ok,no)=>{const c=document.createElement('link');c.rel='stylesheet';c.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';document.head.appendChild(c);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';s.onload=()=>ok(window.L);s.onerror=()=>{REPMAP.lib=null;no()};document.head.appendChild(s)});return REPMAP.lib}
async function initRepMap(){const el=$('#repMap');if(!el)return;let L;try{L=await loadLeaflet()}catch(e){el.outerHTML='<p class="note bad">تعذر تحميل الخريطة. تأكد من الإنترنت.</p>';return}
  if(!document.body.contains(el))return;const prev=REPMAP.map?{c:REPMAP.map.getCenter(),z:REPMAP.map.getZoom()}:null;if(REPMAP.map){try{REPMAP.map.remove()}catch(e){}}
  const m=L.map(el,{zoomControl:true});REPMAP.map=m;L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);
  REPMAP.layer=L.layerGroup().addTo(m);REPMAP.trail=null;drawReps(!prev);if(prev)m.setView(prev.c,prev.z)}
function drawReps(fit){const L=window.L,m=REPMAP.map;if(!L||!m)return;REPMAP.layer.clearLayers();const pts=[];const plant=S.settings.plant;
  if(plant){L.marker([plant.lat,plant.lng],{icon:L.divIcon({className:'',html:'<div class="repPin plant" style="width:34px;height:34px">🏭</div>',iconSize:[34,34],iconAnchor:[17,17]})}).bindTooltip('المعمل').addTo(REPMAP.layer);pts.push([plant.lat,plant.lng])}
  repList().forEach(p=>{const l=locOf(p.id);if(!l)return;const [st,txt]=repState(l);const ini=esc((p.full_name||'؟').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join(''));
    L.marker([l.lat,l.lng],{icon:L.divIcon({className:'',html:`<div class="repPin ${st==='on'?'':'off'}" style="width:34px;height:34px">${ini}</div>`,iconSize:[34,34],iconAnchor:[17,17]})}).bindPopup(`<b>${esc(p.full_name||'')}</b><br>${txt}<br><a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${l.lat},${l.lng}">فتح بخرائط Google</a>`).addTo(REPMAP.layer);
    if(l.acc&&l.acc<2000)L.circle([l.lat,l.lng],{radius:l.acc,weight:1,fillOpacity:.08}).addTo(REPMAP.layer);pts.push([l.lat,l.lng])});

function repsRefresh(){if(S.tab!=='reps'||!$('#repList')){if(S.tab!=='reps'&&!$('#ovroot')?.dataset.kind)render();return}$('#repList').innerHTML=repCards();drawReps(false)}
async function showTrail(id){const L=window.L,m=REPMAP.map;if(!L||!m)return;const d0=new Date();d0.setHours(0,0,0,0);
