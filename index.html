<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نظام شركة المنصور</title>
<meta name="theme-color" content="#1F5468">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="شركة المنصور">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@600;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: one operations column; role bar on top, queue cards below, detail sheet over it. Concrete greys + kiln orange. */
:root{
  --bg:#E9EBE8; --surface:#FFFFFF; --sunk:#F3F4F1; --ink:#1C2225; --muted:#5B6569; --line:#D3D7D3;
  --brand:#1F5468; --accent:#BF4F17; --accent-ink:#FFFFFF; --accent-soft:#F7E3D7;
  --ok:#2C7A4C; --ok-soft:#DDF0E3; --warn:#9A6411; --warn-soft:#F6EBD3; --bad:#B03A2E; --bad-soft:#F6DEDA; --info:#2A6487; --info-soft:#DCEAF2;
  --display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131719; --surface:#1C2226; --sunk:#171C1F; --ink:#E6EAE9; --muted:#97A2A6; --line:#2D363A;
  --brand:#7FB8CC; --accent:#E7793F; --accent-ink:#1A0E07; --accent-soft:#3A2418;
  --ok:#5BC08A; --ok-soft:#183126; --warn:#E0A84A; --warn-soft:#33281A; --bad:#EE7B6C; --bad-soft:#3A1E1B; --info:#6DB2DA; --info-soft:#17293A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131719; --surface:#1C2226; --sunk:#171C1F; --ink:#E6EAE9; --muted:#97A2A6; --line:#2D363A;
  --brand:#7FB8CC; --accent:#E7793F; --accent-ink:#1A0E07; --accent-soft:#3A2418;
  --ok:#5BC08A; --ok-soft:#183126; --warn:#E0A84A; --warn-soft:#33281A; --bad:#EE7B6C; --bad-soft:#3A1E1B; --info:#6DB2DA; --info-soft:#17293A;
  color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:1080px;margin:0 auto}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
.small{font-size:13px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark{width:48px;height:48px;border-radius:10px;background:#FFFFFF;display:grid;place-items:center;flex:none;border:1px solid var(--line);overflow:hidden}
.mark img{width:40px;height:40px;display:block}
.brand .en{font-family:var(--body);font-weight:600;font-size:13px;color:var(--brand);letter-spacing:.02em;direction:ltr;unicode-bidi:isolate}
.brand h1{font-size:17px}
.brand p{margin:0;font-size:12px;color:var(--muted)}
.nav{display:flex;gap:6px;align-items:center}
.ib{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--ink)}
.ib:hover{border-color:var(--muted)}
.ib:disabled{opacity:.35;cursor:default}
.ib svg{width:20px;height:20px}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none;display:inline-block;vertical-align:middle;background:var(--sunk)}
.av0{border:1px solid var(--line)}
.wn{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.wn span{font-size:11.5px;color:var(--muted)}
.gate{display:grid;place-items:center;padding-block:40px}
.gcard{max-width:460px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 22px;display:flex;flex-direction:column;gap:14px;text-align:center;align-items:center}
.glogo{width:84px;height:84px;border-radius:14px;background:#fff;padding:6px;border:1px solid var(--line)}
.gcard h2{font-size:20px}
.gcard p{margin:0;color:var(--muted);font-size:14px;max-width:46ch}
.gme{display:flex;gap:10px;align-items:center;text-align:start;background:var(--sunk);border-radius:10px;padding:10px 14px}
.gme b{display:block}
.acc{display:flex;flex-direction:column;gap:4px}
.arow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow .mono{width:36px;height:36px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-family:var(--display);font-size:13px;color:var(--accent);border:1px solid var(--line)}
.an{display:flex;flex-direction:column;gap:3px;min-width:0}
.ap{display:inline-flex;gap:6px;align-items:center;font-size:13.5px}
.accres{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow-y:auto}
.hit{display:flex;gap:10px;align-items:center;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;width:100%}
.hit:hover{border-color:var(--accent)}
@media (max-width:520px){.arow{grid-template-columns:auto 1fr}.arow .acts{grid-column:1/-1}}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 6px 5px 14px}
.who b{font-weight:600;font-size:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface);font-weight:600}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}

.banner{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner .btn{margin-inline-start:auto}
.banner.gpsOn{background:var(--ok-soft);color:var(--ok)}
.banner.gpsBad{background:var(--bad-soft);color:var(--bad)}
.gdot{width:9px;height:9px;border-radius:50%;background:currentColor;display:inline-block;flex:none;animation:gp 2s infinite}
@keyframes gp{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 50%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
#repMap{height:380px;border-radius:10px;margin-top:12px;border:1px solid var(--line);z-index:0}
.repPin{background:var(--accent);color:#fff;border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 12px system-ui;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.repPin.off{background:#8a8a8a}
.repPin.plant{background:#1f4e79;border-radius:8px}
.reps{display:grid;gap:10px;margin-top:12px}
.rep{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);flex-wrap:wrap}
.rep .mono{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-size:13px;flex:none}
.rep .rwho{flex:1 1 160px;min-width:0}.rep .rwho b{display:block;font-size:14px}.rep .rwho span{font-size:12px;color:var(--muted)}
.rep .acts{flex:1 1 100%}
.rep .st{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.rep .st.on{background:var(--ok-soft);color:var(--ok)}.rep .st.idle{background:var(--warn-soft);color:var(--warn)}.rep .st.off{background:var(--sunk);color:var(--muted)}

/* role picker */
.pick{padding-block:28px 8px}
.pick h2{font-size:22px}
.pick>p{margin:6px 0 20px;color:var(--muted);max-width:60ch}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.rc{text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.rc:hover{border-color:var(--accent)}
.rc .mono{width:40px;height:40px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-family:var(--display);font-size:15px;color:var(--accent);border:1px solid var(--line)}
.rc strong{display:block;font-size:15px}
.rc span{font-size:12px;color:var(--muted)}
.rc .cnt{min-width:28px;height:28px;border-radius:999px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:600;padding:0 8px}
.rc .cnt.watch{background:var(--info-soft);color:var(--info)}
.rc .cnt.zero{background:var(--sunk);color:var(--muted)}
.group-label{font-size:12px;letter-spacing:.04em;color:var(--muted);margin:22px 0 8px;font-weight:600}

/* role home */
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-block:22px 4px}
.head h2{font-size:21px}
.head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.head .btn{margin-inline-start:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:22px;font-family:var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.hot b{color:var(--accent)}
.fab{position:fixed;z-index:15;bottom:max(18px,env(safe-area-inset-bottom,0px));inset-inline-end:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab-btn{display:flex;align-items:center;gap:8px;border:0;cursor:pointer;background:var(--accent);color:#fff;font:600 15px var(--body);height:56px;padding:0 20px 0 22px;border-radius:28px;box-shadow:0 6px 18px rgba(0,0,0,.25);transition:transform .15s}
.fab-btn:active{transform:scale(.96)}.fab-btn .fp{font-size:26px;line-height:1;transition:transform .2s}
.fab.open .fab-btn .fp{transform:rotate(45deg)}
.fab-menu{display:flex;flex-direction:column;gap:8px;align-items:stretch;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .15s,transform .15s}
.fab.open .fab-menu{opacity:1;transform:none;pointer-events:auto}
.fab-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px var(--body);padding:11px 16px;border-radius:14px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.15);white-space:nowrap}
.fab-item .fi{width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:15px}
.fab-item:hover{border-color:var(--accent)}
body.ovopen .fab{display:none}
.sugbox{margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;max-height:150px;overflow:auto;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.sugh{flex:1 1 100%;font-size:11.5px;color:var(--muted);padding:2px 6px}
.sugi{border:1px solid var(--line);background:var(--sunk);color:var(--ink);font:500 14px var(--body);padding:8px 12px;border-radius:20px;cursor:pointer}
.sugi:hover,.sugi:active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.ilist{display:grid;gap:10px;margin-top:12px}
.icard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px;display:grid;gap:10px}
.icard.low{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.icard .ih{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.icard .ih b{font-size:16px;font-weight:600}
.icard .kv{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}.icard .kv small{display:block;font-size:11.5px}
.ivl{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);display:grid;gap:8px;margin-bottom:8px}
.ivh{display:flex;gap:8px;align-items:center}.ivh .ivN{flex:1}
.ivg{display:grid;grid-template-columns:1fr 1.3fr 1.3fr;gap:8px;align-items:end}.ivg .l{margin:0;font-size:12px}.ivg .ivT,.ivg .oT{display:block;padding:10px 0;font-size:15px}
.stat.sel{border-color:var(--accent);background:var(--accent-soft)}
button.stat{font:inherit;color:inherit;text-align:start;cursor:pointer;width:100%;position:relative;transition:border-color .15s,transform .1s,box-shadow .15s}
button.stat::after{content:'‹';position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--muted);opacity:.6}
button.stat:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.06)}button.stat:hover::after{color:var(--accent);opacity:1}
button.stat:active{transform:scale(.98)}button.stat:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:4px;margin-top:20px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .c{font-size:12px;background:var(--sunk);border-radius:999px;padding:1px 7px;margin-inline-start:4px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.filters{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
.filters input{flex:1 1 200px}

.card{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;text-align:start;width:100%}
.card:hover{border-color:var(--muted)}
.card.crit{border-inline-start:4px solid var(--bad)}
.card.urg{border-inline-start:4px solid var(--warn)}
.thumb{width:56px;height:56px;border-radius:8px;background:var(--sunk);object-fit:cover;display:grid;place-items:center;color:var(--muted);font-size:11px;border:1px solid var(--line)}
.card .mid{min-width:0}
.card .t{font-weight:600;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);margin-top:2px}
.card .end{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-info{background:var(--info-soft);color:var(--info)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-ok{background:var(--ok-soft);color:var(--ok)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-accent{background:var(--accent-soft);color:var(--accent)} .p-mute{background:var(--sunk);color:var(--muted)}
.tag-demo{font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:0 5px}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted);margin-top:14px}
.empty b{display:block;color:var(--ink);font-family:var(--display);margin-bottom:4px}
.empty .row{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}

/* track */
.track{display:flex;gap:0;margin:14px 0 4px;overflow-x:auto;padding-bottom:4px}
.step{flex:1 0 70px;text-align:center;font-size:11.5px;color:var(--muted);position:relative;padding-top:20px}
.step::before{content:"";position:absolute;top:6px;inset-inline:0;height:2px;background:var(--line)}
.step::after{content:"";position:absolute;top:1px;inset-inline-start:calc(50% - 6px);width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.step.done::before,.step.done::after{background:var(--ok);border-color:var(--ok)}
.step.now{color:var(--ink);font-weight:600}
.step.now::after{background:var(--accent);border-color:var(--accent)}
.step.skip{opacity:.45}
.step.rej::after{background:var(--bad);border-color:var(--bad)}

/* overlay */
.ov{position:fixed;inset:0;background:rgb(10 12 14 / .5);z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--bg);border-radius:14px;width:100%;max-width:720px;border:1px solid var(--line)}
.sh-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);background:var(--surface);border-radius:14px 14px 0 0}
.sh-h h3{font-size:17px;flex:1;min-width:0}
.x{border:0;background:var(--sunk);width:34px;height:34px;border-radius:8px;font-size:18px;line-height:1}
.sh-b{padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sec h4{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 16px}
.kv div span{display:block;font-size:12px;color:var(--muted)}
.kv div b{font-weight:500;overflow-wrap:anywhere}
.kv div b span{display:inline}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.ph img,.ph .none{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--sunk);max-width:100%}
.ph .none{display:grid;place-items:center}
.ph a{color:var(--info)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.log li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13.5px}
.log li i{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:7px;font-style:normal}
.log li small{grid-column:2;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.acts textarea{flex:1 1 100%}

/* forms */
form.f{display:flex;flex-direction:column;gap:14px}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label.l{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;min-width:0}
label.l em{font-style:normal;color:var(--muted);font-weight:400;font-size:12px}
.in{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea.in{min-height:70px;resize:vertical}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg label{flex:1;text-align:center;padding:8px 6px;font-size:13px;cursor:pointer;border-inline-start:1px solid var(--line)}
.seg label:first-child{border-inline-start:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent-soft);color:var(--accent);font-weight:600}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:12px;display:flex;gap:12px;align-items:center;background:var(--surface);cursor:pointer;min-height:84px}
.drop:hover{border-color:var(--accent)}
.drop img{width:72px;height:60px;object-fit:cover;border-radius:6px;flex:none}

/* EXIF GPS from phone photos */
async function exifGps(file){
  try{
    const buf=await file.slice(0,262144).arrayBuffer();const v=new DataView(buf);
    if(v.getUint16(0)!==0xFFD8)return null;let o=2;
    while(o<v.byteLength-10){const m=v.getUint16(o),len=v.getUint16(o+2);
      if(m===0xFFE1&&v.getUint32(o+4)===0x45786966)return tiffGps(v,o+10);
      if((m&0xFF00)!==0xFF00)break;o+=2+len}
  }catch(e){}return null}
async function exifDate(file){
  try{const buf=await file.slice(0,262144).arrayBuffer();const v=new DataView(buf);if(v.getUint16(0)!==0xFFD8)return null;let o=2;
    while(o<v.byteLength-10){const m=v.getUint16(o),len=v.getUint16(o+2);
      if(m===0xFFE1&&v.getUint32(o+4)===0x45786966){const t=o+10,le=v.getUint16(t)===0x4949,u16=p=>v.getUint16(p,le),u32=p=>v.getUint32(p,le);
        const i0=t+u32(t+4),n=u16(i0);let ex=0,dt0=0;
        for(let i=0;i<n;i++){const e=i0+2+i*12,tg=u16(e);if(tg===0x8769)ex=t+u32(e+8);if(tg===0x0132)dt0=t+u32(e+8)}
        let at=0;if(ex){const n2=u16(ex);for(let i=0;i<n2;i++){const e=ex+2+i*12;if(u16(e)===0x9003)at=t+u32(e+8)}}
        const p=at||dt0;if(!p)return null;let str='';for(let k=0;k<19;k++)str+=String.fromCharCode(v.getUint8(p+k));
        const mm=str.match(/(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);if(!mm)return null;
        return new Date(+mm[1],+mm[2]-1,+mm[3],+mm[4],+mm[5],+mm[6]).getTime()}
      if((m&0xFF00)!==0xFF00)break;o+=2+len}}catch(e){}return null}
function tiffGps(v,t){
  const le=v.getUint16(t)===0x4949,u16=p=>v.getUint16(p,le),u32=p=>v.getUint32(p,le);
  const i0=t+u32(t+4),n=u16(i0);let g=0;
  for(let i=0;i<n;i++){const e=i0+2+i*12;if(u16(e)===0x8825)g=t+u32(e+8)}
  if(!g)return null;const gn=u16(g),T={};
  for(let i=0;i<gn;i++){const e=g+2+i*12,tag=u16(e);
    if(tag===1||tag===3)T[tag]=String.fromCharCode(v.getUint8(e+8));
    if(tag===2||tag===4){const off=t+u32(e+8),r=k=>u32(off+k*8)/(u32(off+k*8+4)||1);T[tag]=r(0)+r(1)/60+r(2)/3600}}
  if(T[2]==null||T[4]==null)return null;let lat=T[2],lng=T[4];if(T[1]==='S')lat=-lat;if(T[3]==='W')lng=-lng;
  if(!isFinite(lat)||!isFinite(lng)||(!lat&&!lng))return null;return{lat:+lat.toFixed(6),lng:+lng.toFixed(6)}}

function compress(file,max=1400,q=.74,stamp){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{let w=im.naturalWidth,h=im.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
    const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.drawImage(im,0,0,w,h);URL.revokeObjectURL(u);
    if(stamp){const fs=Math.max(14,Math.round(w/42)),bh=fs*2.2;g.fillStyle='rgba(0,0,0,.72)';g.fillRect(0,h-bh,w,bh);g.fillStyle='#fff';g.font=`600 ${fs}px 'IBM Plex Sans Arabic',Tahoma,sans-serif`;g.textBaseline='middle';g.direction='rtl';g.textAlign='right';g.fillText(stamp,w-fs*.6,h-bh/2)}
    c.toBlob(b=>b?res(b):rej(),'image/jpeg',q)};
  im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};im.src=u})}

function canAct(r,role){if(role==='project'&&!['done','rejected'].includes(r.status))return true;if(isStoreRole(role)&&whOf(r)!==myWh(role))return false;return(ST[r.status]?.who||[]).includes(role)}
const invOf=role=>S.inventory.filter(i=>i.kind!=='fuel'&&(!isStoreRole(role)||(i.wh==='mach'?'mach':'main')===myWh(role)));

async function act(r,action,extra={}){
  const role=S.role||(isOwner()?'project':null),note=(extra.note||'').trim();const nr=clean(r);nr.log=nr.log||[];
  const push=a=>nr.log.push({t:Date.now(),role,uid:S.me?.id||null,a,note});
  switch(action){
    case'toBuy':nr.status='proj';push('حوّل للشراء - غير متوفر بالمخزن');break;
    case'issue':nr.status='done';nr.fromStock=true;if(extra.issue)nr.issue=extra.issue;push('صرف من المخزن'+(extra.itemName?' ('+extra.itemName+')':''));break;
    case'projOk':nr.status='buy';push('وافق — أُرسل لمندوبي المشتريات');break;
    case'direct':nr.status='buy';push('أرسل الطلب مباشرة للمشتريات (أولوية مدير المشروع)');break;
    case'purOk':nr.status='buy';push('وافق على الشراء');break;
    case'startBuy':nr.status='buying';push('بدأ الشراء');break;
    case'bought':nr.status='receive';nr.purchase=extra.purchase;push('أكد الشراء وأرفق الفاتورة');break;
    case'reject':nr.status='rejected';push('رفض الطلب');break;

}

let scanStop=null;
function openScanner(title,hint,onCode){
  overlay('scan',title,`<p class="muted" style="margin:0">${hint}</p><div class="scanbox"><video id="scVid" playsinline muted></video><div class="scanframe"></div></div><span class="note" id="scMsg">جارِ تشغيل الكاميرا…</span>

  let done=false,stream=null,raf=0;const vid=$('#scVid'),cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  const finish=async txt=>{if(done)return;done=true;stop();await onCode(txt)};
  const stop=()=>{cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null};scanStop=stop;
  $('#scForm').addEventListener('submit',e=>{e.preventDefault();const v=$('#scManual').value.trim();if(v)finish(v)});
  (async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});vid.srcObject=stream;await vid.play();$('#scMsg').textContent='وجّه الكاميرا على الباركود';
    const tick=()=>{if(done||!stream)return;if(vid.readyState>=2){const w=vid.videoWidth,h=vid.videoHeight;const sc=Math.min(1,640/Math.max(w,h));cv.width=w*sc;cv.height=h*sc;cx.drawImage(vid,0,0,cv.width,cv.height);
      const im=cx.getImageData(0,0,cv.width,cv.height);const r=window.jsQR&&jsQR(im.data,im.width,im.height,{inversionAttempts:'dontInvert'});if(r&&r.data){navigator.vibrate?.(80);finish(r.data);return}}raf=requestAnimationFrame(tick)};tick();

const MATS=['إسمنت سائب','إسمنت معبأ','كلنكر','حجر كلس','جبس','رمل','حصو','شيش حديد','طابوق','بلوك','طابوق حراري','فحم / وقود صلب','زيت وقود','قطع غيار'];
const DUNITS=['طن','م³','كيس','قطعة','حمل','لتر'];
const DST={wait:['بانتظار التنزيل','warn'],unload:['قيد التنزيل','info'],done:['تم التنزيل','ok'],rejected:['مرفوضة','bad']};
const canDlv=()=>['supply','machines','project','owner','store','mstore','keeper'].includes(S.me?.role);
const dlvOpen=()=>S.deliveries.filter(d=>d.status==='wait'||d.status==='unload');
const sameDay=t=>new Date(t).toDateString()===new Date().toDateString();
function dlvView(){
  const f=S.dlvF,doneToday=S.deliveries.filter(d=>d.status==='done'&&sameDay(d.doneAt||d.updatedAt||d.createdAt)),today=S.deliveries.filter(d=>sameDay(d.createdAt)||d.status!=='done'||doneToday.includes(d));
  const list=(f==='today'?today:f==='open'?dlvOpen():f==='done'?S.deliveries.filter(d=>d.status==='done'):S.deliveries).slice().sort((a,b)=>({wait:0,unload:1}[a.status]??2)-({wait:0,unload:1}[b.status]??2)||b.createdAt-a.createdAt);
  const byMat={};doneToday.forEach(d=>{const k=d.material+'|'+d.unit;byMat[k]=(byMat[k]||0)+(+d.qty||0)});
  let h=`<div class="stats" style="margin-top:14px"><button type="button" class="stat " data-a="stat" data-v="d:today"><b>${today.length}</b><span>شاحنات اليوم</span></button><button type="button" class="stat ${S.deliveries.filter(d=>d.status==='wait').length?'hot':''}" data-a="stat" data-v="d:open"><b>${S.deliveries.filter(d=>d.status==='wait').length}</b><span>بانتظار التنزيل</span></button><button type="button" class="stat " data-a="stat" data-v="d:open"><b>${S.deliveries.filter(d=>d.status==='unload').length}</b><span>قيد التنزيل</span></button><button type="button" class="stat " data-a="stat" data-v="d:done"><b style="color:var(--ok)">${doneToday.length}</b><span>نُزّلت اليوم</span></button></div>`;
  if(Object.keys(byMat).length)h+=`<div class="sec" style="margin-top:12px"><h4>المنزّل اليوم</h4><div class="kv">${Object.entries(byMat).map(([k,v])=>{const [m,u]=k.split('|');return`<div><span>${esc(m)}</span><b><span class="num">${nf.format(v)}</span> ${esc(u)}</b></div>`}).join('')}</div></div>`;
  h+=`<div class="filters"><div class="seg" style="flex:1 1 220px">${[['today','اليوم'],['open','المفتوحة'],['done','المكتملة'],['all','الكل']].map(([k,t])=>`<label><input type="radio" name="dlvF" value="${k}" ${f===k?'checked':''}>${t}</label>`).join('')}</div>${canDlv()?`<button class="btn pri" data-a="dlvNew">+ تسجيل شاحنة واصلة</button>`:''}</div>`;

const ATT_SITES=[...Array.from({length:22},(_,i)=>'T'+(i+1)),'المعمل','الساحة العامة','المخزن'];
const DOW_AR=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

/* ---- Baghdad time helpers (Iraq is UTC+3 all year) ---- */
const _bgD=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Baghdad',year:'numeric',month:'2-digit',day:'2-digit'});
const _bgT=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Baghdad',hour:'2-digit',minute:'2-digit',hour12:false});
const bgDay=t=>_bgD.format(new Date(t??Date.now()));
const bgHM=t=>t?_bgT.format(new Date(t)).replace(/^24/,'00'):'';
const hm2min=s=>{const m=/^(\d{1,2}):(\d{2})/.exec(s||'');return m?(+m[1])*60+(+m[2]):null};
const bgMin=t=>hm2min(bgHM(t));
const dayAdd=(d,n)=>{const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const dayDow=d=>new Date(d+'T12:00:00Z').getUTCDay();
const dayIso=(d,hm)=>new Date(Date.parse(d+'T'+hm+':00+03:00')).toISOString();
const monthStart=d=>d.slice(0,8)+'01';
const monthEnd=d=>dayAdd(dayAdd(monthStart(d),32).slice(0,8)+'01',-1);
function dayLabel(d){const t=bgDay();if(d===t)return'اليوم';if(d===dayAdd(t,-1))return'أمس';return DOW_AR[dayDow(d)]+' '+(+d.slice(8))+'/'+(+d.slice(5,7))}
const dayLong=d=>DOW_AR[dayDow(d)]+' '+(+d.slice(8))+'/'+(+d.slice(5,7))+'/'+d.slice(0,4);
function attCfg(){const c=S.settings?.att||{};const start=c.start||'07:00',end=c.end||'15:00',sm=hm2min(start),em=hm2min(end);
  return{start,end,grace:Math.max(0,+(c.grace??15)),off:Array.isArray(c.off)?c.off.map(Number):[5],alertDays:Math.max(2,+(c.alertDays||3)),otRate:+(c.otRate??1)||1,hours:em>sm?(em-sm)/60:8}}

  wq:'',wsite:'',woff:false,absFrom:null,absTo:null,absSite:'',absAll:false,month:null,repSite:'',repDay:null,audit:null,geo:null,geoW:null,dirty:false,err:null};

const attWorker=id=>S.att.workers.find(w=>w.id===id);
function attPut(r){const A=S.att;const old=A.byId[r.id];if(old){const k0=AK(old.worker_id,old.day);if(A.rows[k0]&&A.rows[k0].id===r.id)delete A.rows[k0]}A.byId[r.id]=r;A.rows[AK(r.worker_id,r.day)]=r}
function attDrop(id){const A=S.att,r=A.byId[id];if(!r)return;delete A.byId[id];const k=AK(r.worker_id,r.day);if(A.rows[k]&&A.rows[k].id===id)delete A.rows[k]}
const siteSort=(a,b)=>{const na=/^T(\d+)$/.exec(a||''),nb=/^T(\d+)$/.exec(b||'');if(na&&nb)return na[1]-nb[1];if(na)return-1;if(nb)return 1;return String(a||'').localeCompare(String(b||''),'ar')};
const attSites=()=>[...new Set(S.att.workers.map(w=>w.site).filter(Boolean))].sort(siteSort);
/* nationality groups (الأصل) — one shared log, shown in sections */
const ATT_ORIGINS=['الأتراك','الأفغان','الأكراد','البنغلادش','الباكستان','الإيرانيين','السوريين'];

function attGroup(ws,key){key=key||origOf;const g={};ws.forEach(w=>{const k=key(w);(g[k]=g[k]||[]).push(w)});return Object.keys(g).sort(key===origOf?origSort:siteSort).map(k=>[k,g[k]])}
function attDayCount(ws,d){const o={all:ws.length,work:0,present:0,late:0,half:0,absent:0,leave:0,none:0};ws.forEach(w=>{const r=attRec(w.id,d);if(!r)o.none++;else{o[r.status]++;if(ATT_WORK.includes(r.status))o.work++}});return o}
const attGrpFoot=(o,label)=>`<div class="atgf"><b>${esc(label)}:</b><span class="g-ok">مداوم <b class="num">${o.work}</b></span><span class="g-bad">غائب <b class="num">${o.absent}</b></span>${o.leave?`<span>إجازة <b class="num">${o.leave}</b></span>`:''}${o.none?`<span class="g-warn">لم يُسجّل <b class="num">${o.none}</b></span>`:''}<span class="muted">من <b class="num">${o.all}</b></span></div>`;
const origSel=(id,val,all)=>`<select id="${id}" class="in" aria-label="الجنسية"><option value="">${all||'كل الجنسيات'}</option>${attOrigins().map(o=>`<option ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
const initials=n=>esc(String(n||'؟').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join(''));

/* ---- loading ---- */
async function attPaged(build){const out=[];for(let p=0;p<200;p++){const {data,error}=await build().range(p*1000,p*1000+999);if(error)throw error;out.push(...(data||[]));if(!data||data.length<1000)break}return out}
async function attLoad(){
  if(!seesAtt())return;const A=S.att,today=bgDay(),from=monthStart(dayAdd(monthStart(today),-1));
  try{
    const [ws,ds,rs]=await Promise.all([
      attPaged(()=>sb.from('workers').select('*').order('name')),
      attPaged(()=>sb.from('att_days').select('*').gte('day',dayAdd(from,-60))),
      attPaged(()=>sb.from('attendance').select('*').gte('day',from).lte('day',today).order('id'))]);
    A.workers=ws;A.days={};ds.forEach(d=>A.days[d.day]=d);A.rows={};A.byId={};rs.forEach(attPut);A.from=from;A.to=today;A.err=null;
    attSnapSave();attApplyQueue();attSign();
  }catch(e){A.err=e.message||String(e)}
}
async function attEnsure(from,to){const A=S.att;if(!A.from)return;let changed=false;
  try{if(from<A.from){const rs=await attPaged(()=>sb.from('attendance').select('*').gte('day',from).lt('day',A.from).order('id'));rs.forEach(attPut);
      const ds=await attPaged(()=>sb.from('att_days').select('*').gte('day',from).lt('day',A.from));ds.forEach(d=>A.days[d.day]=d);A.from=from;changed=true}
    const today=bgDay();if(to>A.to&&A.to<today){const rs=await attPaged(()=>sb.from('attendance').select('*').gt('day',A.to).lte('day',today).order('id'));rs.forEach(attPut);A.to=today;changed=true}
  }catch(e){toast('تعذر تحميل السجلات: '+(e.message||e))}return changed}
async function attSign(){const refs=new Set();const add=x=>{if(x&&x.startsWith('s:')&&!S.imgCache[x.slice(2)])refs.add(x.slice(2))};
  S.att.workers.forEach(w=>add(w.photo));Object.values(S.att.byId).forEach(r=>add(r.attach));if(!refs.size)return;
  try{const {data}=await sb.storage.from('files').createSignedUrls([...refs],604800);(data||[]).forEach(d=>{if(d.signedUrl)S.imgCache[d.path]=d.signedUrl});attRerender()}catch(e){}}


/* offline start: a timekeeper can open the app without signal from the last snapshot */
function attSnapSave(){if(S.me?.role!=='timekeeper')return;const t=bgDay(),y=dayAdd(t,-1);
  try{localStorage.setItem('att_snap_'+S.me.id,JSON.stringify({at:Date.now(),me:S.me,att:S.settings?.att||null,workers:S.att.workers,
    days:Object.values(S.att.days).filter(d=>d.day>=y),rows:Object.values(S.att.byId).filter(r=>r.day>=y)}))}catch(e){}}
async function attOfflineStart(){try{const {data}=await sb.auth.getSession();const uid=data?.session?.user?.id;if(!uid)return false;
  const s=JSON.parse(localStorage.getItem('att_snap_'+uid)||'null');if(!s||s.me?.role!=='timekeeper')return false;
  S.me=s.me;S.role='timekeeper';S.settings={...S.settings,att:s.att||undefined};const A=S.att;A.workers=s.workers||[];A.days={};(s.days||[]).forEach(d=>A.days[d.day]=d);
  A.rows={};A.byId={};(s.rows||[]).forEach(attPut);A.from=dayAdd(bgDay(),-1);A.to=bgDay();attApplyQueue();S.offlineStart=true;S.mode='db';render();return true}catch(e){return false}}

/* ---- live updates ---- */
function attRT(table,e){const A=S.att;
  if(table==='workers'){if(e.eventType==='DELETE')A.workers=A.workers.filter(w=>w.id!==e.old?.id);else if(e.new?.id){const i=A.workers.findIndex(w=>w.id===e.new.id);if(i<0)A.workers.push(e.new);else A.workers[i]=e.new}}
  if(table==='attendance'){if(e.eventType==='DELETE')attDrop(e.old?.id);else if(e.new?.id){if(!A.from||e.new.day>=A.from)attPut(e.new)}}
  if(table==='att_days'){if(e.eventType==='DELETE')delete A.days[e.old?.day];else if(e.new?.day)A.days[e.new.day]=e.new}
  attRerender()}
let attRT_t=0;
function attRerender(now){clearTimeout(attRT_t);attRT_t=setTimeout(()=>{if(!S.me||S.mode!=='db')return;const ae=document.activeElement;
    if(ae&&$('#app')?.contains(ae)&&['INPUT','SELECT','TEXTAREA'].includes(ae.tagName)&&ae.id!=='atQ'&&ae.id!=='atWQ'){S.att.dirty=true;return}attRenderKeep()},now?0:250)}
function attRenderKeep(){const ae=document.activeElement,id=ae&&$('#app')?.contains(ae)?ae.id:null,s=id&&ae.selectionStart,y=scrollY;render();
  if(id){const n=document.getElementById(id);if(n){n.focus();try{if(s!=null)n.setSelectionRange(s,s)}catch(e){}}}if(Math.abs(scrollY-y)>2)scrollTo(0,y)}
document.addEventListener('focusout',()=>{if(S.att.dirty){S.att.dirty=false;setTimeout(attRenderKeep,50)}});

/* ---- offline queue (kept per user on this device) ---- */
const AQK=()=>'att_q_'+(S.me?.id||'x');
function attQ(){try{return JSON.parse(localStorage.getItem(AQK())||'[]')}catch(e){return[]}}
function attQSet(q){try{localStorage.setItem(AQK(),JSON.stringify(q))}catch(e){}}
function attQueue(p){const q=attQ().filter(x=>!(x.p.worker_id===p.worker_id&&x.p.day===p.day));q.push({p,t:Date.now()});attQSet(q)}
function attApplyQueue(){attQ().forEach(it=>{const k=AK(it.p.worker_id,it.p.day);S.att.rows[k]={...(S.att.rows[k]||{}),...it.p,_pending:true,_err:it.err||null}})}
const attNetErr=e=>{const m=String(e?.message||e||'');return !navigator.onLine||e?.name==='TypeError'||/failed to fetch|networkerror|load failed|network request failed|fetch/i.test(m)};
function attErrMsg(e){const m=String(e?.message||e||'');if(/row-level security|permission denied/i.test(m))return'ما عندك صلاحية لهذا الإجراء';return m||'تعذر الحفظ'}
let attFlushing=false;
async function attFlush(){if(attFlushing||!navigator.onLine||!S.me)return 0;const q=attQ();if(!q.some(x=>!x.err))return 0;attFlushing=true;let ok=0,i=0;const keep=[];
  try{for(;i<q.length;i++){const it=q[i];if(it.err){keep.push(it);continue}
      try{const {data,error}=await sb.from('attendance').upsert(it.p,{onConflict:'worker_id,day'}).select().single();if(error)throw error;attPut(data);ok++}
      catch(e){if(attNetErr(e)){keep.push(...q.slice(i));break}keep.push({...it,err:attErrMsg(e)})}}
  }finally{attQSet(keep);attFlushing=false}
  if(ok)toast('انرفع '+ok+' تسجيل كان محفوظ بدون إنترنت');attApplyQueue();attRerender(true);return ok}
window.addEventListener('online',async()=>{if(S.offlineStart){S.offlineStart=false;await afterLogin();return}if(!seesAtt())return;await attFlush();await attLoad();attRerender(true)});
window.addEventListener('offline',()=>{if(seesAtt())attRerender(true)});
setInterval(()=>{if(S.me&&seesAtt()&&attQ().some(x=>!x.err))attFlush()},30000);

/* ---- GPS while doing the round ---- */
function attGeoStart(){if(S.att.geoW!=null||!navigator.geolocation)return;try{S.att.geoW=navigator.geolocation.watchPosition(p=>{S.att.geo={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy||0),t:Date.now()}},()=>{},{enableHighAccuracy:true,maximumAge:60000,timeout:20000})}catch(e){}}
const attGeoNow=()=>{const g=S.att.geo;return g&&Date.now()-g.t<180000?g:null};

/* ---- saving ---- */
const ATT_COLS=['status','in_at','out_at','in_lat','in_lng','in_acc','out_lat','out_lng','method','reason','excused','attach'];
const isClosed=d=>!!S.att.days[d]?.closed;
const isHoliday=d=>!!S.att.days[d]?.holiday;
function attCanEdit(d){const r=S.me?.role,t=bgDay();if(!d||d>t)return false;if(r==='timekeeper')return d>=dayAdd(t,-1)&&!isClosed(d);return['project','owner'].includes(r)}
async function attSave(wid,day,patch,editReason){
  const A=S.att,k=AK(wid,day),prev=A.rows[k]?{...A.rows[k]}:null;
  const row={...(prev||{}),...patch,worker_id:wid,day};
  if(!ATT_WORK.includes(row.status)){Object.assign(row,{in_at:null,out_at:null,in_lat:null,in_lng:null,in_acc:null,out_lat:null,out_lng:null})}else row.excused=false;
  const p={worker_id:wid,day};ATT_COLS.forEach(c=>{p[c]=row[c]??(c==='excused'?false:c==='method'?'manual':null)});
  if(editReason)p.edit_reason=editReason;
  A.rows[k]={...row,_pending:true,_err:null};attRerender(true);
  if(!navigator.onLine){attQueue(p);toast('محفوظ على الجهاز — ينرفع أول ما يرجع الإنترنت');return true}
  try{const {data,error}=await sb.from('attendance').upsert(p,{onConflict:'worker_id,day'}).select().single();if(error)throw error;attPut(data);attRerender(true);return true}
  catch(e){if(attNetErr(e)){attQueue(p);toast('محفوظ على الجهاز — ينرفع أول ما يرجع الإنترنت');return true}
    if(prev)A.rows[k]=prev;else delete A.rows[k];attRerender(true);toast(attErrMsg(e));return false}}
function attInPatch(wid,day,status,method){
  const c=attCfg(),prev=attRec(wid,day),g=attGeoNow(),isToday=day===bgDay();
  let inAt=prev&&ATT_WORK.includes(prev.status)&&prev.in_at?prev.in_at:null;
  if(!inAt)inAt=isToday?new Date().toISOString():dayIso(day,c.start);
  const st=status||(bgMin(inAt)>hm2min(c.start)+c.grace?'late':'present');
  const p={status:st,in_at:inAt,method:method||'manual',reason:null,excused:false};
  if(g&&!(prev&&prev.in_lat!=null&&ATT_WORK.includes(prev.status))){p.in_lat=g.lat;p.in_lng=g.lng;p.in_acc=g.acc}
  return p}
const attCheckIn=(wid,day,status,method)=>attSave(wid,day,attInPatch(wid,day,status,method));
function attCheckOut(wid,day){const r=attRec(wid,day);if(!r||!ATT_WORK.includes(r.status))return;const g=attGeoNow();
  const p={out_at:new Date().toISOString()};if(r.in_at&&Date.parse(p.out_at)<Date.parse(r.in_at))p.out_at=r.in_at;if(g){p.out_lat=g.lat;p.out_lng=g.lng}return attSave(wid,day,p)}

/* ---- calculations ---- */
function attOT(r,c){if(!r||!ATT_WORK.includes(r.status)||!r.in_at||!r.out_at)return 0;const h=(Date.parse(r.out_at)-Date.parse(r.in_at))/36e5;return Math.max(0,Math.round((h-c.hours)*4)/4)}
const attWorked=r=>r&&r.in_at&&r.out_at?(Date.parse(r.out_at)-Date.parse(r.in_at))/36e5:null;
function attStreak(wid){const c=attCfg(),t=bgDay();let n=0;
  for(let i=0;i<90;i++){const d=dayAdd(t,-i);if(S.att.from&&d<S.att.from)break;const r=attRec(wid,d);
    if(!r){if(i===0||c.off.includes(dayDow(d))||isHoliday(d)||!isClosed(d))continue;break}
    if(r.status==='absent'&&!r.excused)n++;else break}return n}
function attSum(wid,from,to){const c=attCfg(),o={present:0,late:0,half:0,absent:0,absX:0,leave:0,none:0,ot:0,days:0};
  for(let d=from;d<=to;d=dayAdd(d,1)){const r=attRec(wid,d);if(!r){if(!c.off.includes(dayDow(d))&&!isHoliday(d)&&isClosed(d))o.none++;continue}
    o.days++;if(r.status==='absent'){if(r.excused)o.absX++;else o.absent++}else o[r.status]++;o.ot+=attOT(r,c)}return o}
function attPay(w,o){const c=attCfg(),wage=+w.wage||0;if(!wage)return null;
  if(w.pay_type==='monthly'){const day=wage/30;return Math.max(0,wage-o.absent*day-o.half*day/2+o.ot*(day/c.hours)*c.otRate)}
  return(o.present+o.late)*wage+o.half*wage/2+o.ot*(wage/c.hours)*c.otRate}

function attRoundView(){

  h+=`<div class="stats atstats">${[['','الكل',cnt.all],['none','لم يُسجّل',cnt.none],['present','حاضر',cnt.present],['late','متأخر',cnt.late],['half','نص يوم',cnt.half],['absent','غائب',cnt.absent],['leave','إجازة',cnt.leave]]
    .map(([k,l,n])=>`<button type="button" class="stat ${A.f===k?'sel':''} ${k==='none'&&n&&!closed&&!hol?'hot':''}" data-a="atF" data-v="${k}"><b class="num">${n}</b><span>${l}</span></button>`).join('')}</div>`;
  if(quick||boss&&!closed&&d<=t){h+=`<div class="acts atacts">`;
    if(quick)h+=`<button class="btn pri" data-a="atScan">📷 مسح باج العامل</button>${unmarked.length?`<button class="btn" data-a="atBulk">✓ حضور للمتبقين · <span class="num">${unmarked.length}</span></button>`:''}`;
    if(!closed&&attCanMark()&&d<=t)h+=`<button class="btn" data-a="atClose">🔒 إغلاق اليوم</button>`;
    if(boss&&!hol)h+=`<button class="btn ghost" data-a="atHoliday" data-v="1">عطلة رسمية</button>`;
    h+=`</div>`}
  if(!A.workers.length)return h+`<div class="empty"><b>ما مسجّل أي عامل بعد</b>${attCanMark()?'ابدأ بإضافة العمال من تبويب «العمال»، وبعدها اطبع لكل واحد باج QR.':'العمال يضيفهم مراقب الدوام أو مدير المشروع.'}${attCanMark()?`<div class="row"><button class="btn pri" data-a="atWNew">+ إضافة عامل</button></div>`:''}</div>`;
  if(!list.length)return h+`<div class="empty"><b>لا أحد هنا</b>${f?'ما في عمال بهذه الحالة.':'غيّر البحث أو البناية.'}</div>`;
  const groups=attGroup(list);
  h+=groups.map(([o,gw])=>{const all=base.filter(w=>origOf(w)===o),oc=attDayCount(all,d);
    return`<section class="atgrp"><h3 class="atgh"><span>${esc(o)}</span><span class="muted small"><span class="num">${oc.work}</span> مداوم · <span class="num">${oc.absent}</span> غائب · <span class="num">${all.length}</span> عامل</span></h3>
     <div class="atlist">${gw.map(w=>attRow(w,d,quick)).join('')}</div>${attGrpFoot(oc,'مجموع '+o)}</section>`}).join('');
  const og=attGroup(base);
  if(og.length>1){const T=attDayCount(base,d);
    h+=`<div class="sec atsum"><h4 style="margin:0">ملخص ${esc(dayLabel(d))} حسب الجنسية</h4><div class="tbl-wrap"><table class="attbl atsmall"><thead><tr><th>الجنسية</th><th>مداوم</th><th>غائب</th><th>إجازة</th><th>لم يُسجّل</th><th>العدد</th></tr></thead><tbody>
     ${og.map(([o,gw])=>{const c2=attDayCount(gw,d);return`<tr><td><b>${esc(o)}</b></td><td class="q ok">${c2.work}</td><td class="q ${c2.absent?'bad':''}">${c2.absent}</td><td class="q">${c2.leave}</td><td class="q ${c2.none?'warn':''}">${c2.none}</td><td class="q">${c2.all}</td></tr>`}).join('')}
     <tr class="tot"><td>المجموع</td><td class="q">${T.work}</td><td class="q">${T.absent}</td><td class="q">${T.leave}</td><td class="q">${T.none}</td><td class="q">${T.all}</td></tr></tbody></table></div></div>`}
  return h}
function attRow(w,d,quick){const r=attRec(w.id,d),work=r&&ATT_WORK.includes(r.status);
  let tm='';if(work){tm=`<span class="num">${r.in_at?bgHM(r.in_at):'—'}</span>${r.out_at?` ← <span class="num">${bgHM(r.out_at)}</span>`:''}`}
  else if(r&&r.reason)tm=esc(r.reason);
  let q='';if(quick){if(!r||!work)q=`<button class="atb ok" data-a="atIn" data-v="${w.id}" aria-label="حاضر ${esc(w.name)}">✓<span>حاضر</span></button>${!r&&!isHoliday(d)?`<button class="atb bad" data-a="atAbs" data-v="${w.id}" aria-label="غائب ${esc(w.name)}">✗<span>غائب</span></button>`:''}`;
    else if(!r.out_at)q=`<button class="atb" data-a="atOut" data-v="${w.id}" aria-label="تسجيل خروج ${esc(w.name)}">↩<span>خروج</span></button>`}
  return`<div class="atrow ${r?'s-'+r.status:'s-none'}${w.active?'':' inact'}"><button class="atw" data-a="atOpen" data-v="${w.id}">${w.photo&&imgSrc(w.photo)?`<img class="av" src="${esc(imgSrc(w.photo))}" alt="">`:`<span class="av">${initials(w.name)}</span>`}<span class="an"><b>${esc(w.name)}</b><span class="small atsubl">${w.trade?`<b class="attr">${esc(w.trade)}</b>`:''}${w.phone?`<span class="num">${esc(w.phone)}</span>`:''}<span class="muted">${[w.site,w.code].filter(Boolean).map(esc).join(' · ')}${w.active?'':' · موقوف'}</span></span></span></button>
   <div class="atst">${attPill(r)}<span class="muted small attm">${tm}</span></div><div class="atq">${q}<button class="atb more" data-a="atOpen" data-v="${w.id}" aria-label="تفاصيل ${esc(w.name)}">⋯</button></div></div>`}

/* worker day sheet */
function attSheet(wid,day){const w=attWorker(wid);if(!w)return;const A=S.att;day=day||A.day||bgDay();const r=attRec(wid,day),c=attCfg();
  const ed=attCanEdit(day),closed=isClosed(day),needReason=closed&&attBoss(),st=r?.status||'';
  const t=bgDay(),last=[];for(let i=13;i>=0;i--){const d=dayAdd(t,-i);last.push([d,attRec(wid,d)])}
  const ms=attSum(wid,monthStart(t),t),stk=attStreak(wid);
  const pay=attSeesPay()&&+w.wage?`<div><span>الأجر</span><b><span class="num">${nf.format(+w.wage)}</span> د.ع ${w.pay_type==='monthly'?'شهري':'يومي'}</b></div>`:'';
  let b=`<div class="sec"><div class="atsh-h">${w.photo&&imgSrc(w.photo)?`<img class="av lg" src="${esc(imgSrc(w.photo))}" alt="">`:`<span class="av lg">${initials(w.name)}</span>`}<div><b style="font-family:var(--display);font-size:17px">${esc(w.name)}</b><div class="meta"><span class="num">${esc(w.code)}</span><span>${esc(origOf(w))}</span>${w.trade?`<span>${esc(w.trade)}</span>`:''}${w.site?`<span>${esc(w.site)}</span>`:''}${w.team?`<span>${esc(w.team)}</span>`:''}${w.active?'':'<span class="pill p-bad">موقوف</span>'}</div></div></div>
    <div class="kv" style="margin-top:10px">${w.phone?`<div><span>الهاتف</span><b><a class="num" href="tel:${esc(w.phone)}">${esc(w.phone)}</a></b></div>`:''}${pay}<div><span>هذا الشهر</span><b><span class="num">${ms.present+ms.late}</span> حضور · <span class="num">${ms.absent}</span> غياب${ms.late?` · <span class="num">${ms.late}</span> تأخير`:''}</b></div>${stk>=2?`<div><span>غياب متتالي</span><b class="pill p-bad"><span class="num">${stk}</span> أيام</b></div>`:''}</div>
    <div class="athist" aria-label="آخر 14 يوم">${last.map(([d,x])=>`<button class="hd ${x?'s-'+x.status+(x.excused?' ex':''):'s-none'} ${d===day?'cur':''}" data-a="atOpenD" data-v="${wid}|${d}" title="${esc(dayLong(d))}: ${x?ATT_ST[x.status][0]:'لم يُسجّل'}"><span class="num">${+d.slice(8)}</span></button>`).join('')}</div></div>`;
  b+=`<form class="f sec" id="atF"><h4 style="margin:0 0 8px">${esc(dayLong(day))}${closed?' <span class="pill p-mute">🔒 مغلق</span>':''}</h4>
   <div class="seg atseg" role="radiogroup" aria-label="الحالة">${Object.entries(ATT_ST).map(([k,[l]])=>`<label><input type="radio" name="atS" value="${k}" ${st===k?'checked':''} ${ed?'':'disabled'}>${l}</label>`).join('')}</div>
   <div class="fr" id="atTimes" ${ATT_WORK.includes(st)||!st?'':'hidden'} style="margin-top:12px"><label class="l">وقت الدخول<input id="atIn" class="in num" type="time" value="${r?.in_at?bgHM(r.in_at):''}" ${ed?'':'disabled'}></label><label class="l">وقت الخروج<input id="atOutT" class="in num" type="time" value="${r?.out_at?bgHM(r.out_at):''}" ${ed?'':'disabled'}></label></div>
   <div id="atAbsF" ${['absent','leave'].includes(st)?'':'hidden'} style="margin-top:12px"><label class="l">السبب<input id="atReason" class="in" value="${esc(r?.reason||'')}" placeholder="مثال: مريض، ظرف عائلي، بدون عذر" ${ed?'':'disabled'}></label>
     <label class="atchk"><input type="checkbox" id="atEx" ${r?.excused?'checked':''} ${ed?'':'disabled'}> غياب بإذن (ما ينحسب عليه)</label>
     <label class="l" style="margin-top:8px">مرفق (تقرير طبي أو ورقة إجازة) <input id="atFile" class="in" type="file" accept="image/*" ${ed?'':'disabled'}></label>${r?.attach?`<div style="margin-top:8px">${imgTag(r.attach,'atattach','المرفق')}</div>`:''}</div>
   ${needReason?`<label class="l" style="margin-top:12px">سبب التعديل <em>(مطلوب لأن اليوم مغلق)</em><input id="atEdit" class="in" required placeholder="مثال: كان موجود بس ما انسجل"></label>`:''}
   ${r?.in_lat!=null?`<p class="note" style="margin:10px 0 0">📍 موقع تسجيل الدخول: <a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${r.in_lat},${r.in_lng}">على الخريطة</a>${r.in_acc?` · دقة <span class="num">${Math.round(r.in_acc)}</span> م`:''}${r.method==='qr'?' · بالباركود':''}</p>`:''}
   ${r&&r.method==='auto'?`<p class="note" style="margin:6px 0 0">انسجل غائب تلقائياً عند إغلاق اليوم لأنه ما انسجل.</p>`:''}
   ${r?.by_uid&&S.names[r.by_uid]?`<p class="note" style="margin:6px 0 0">آخر تسجيل: ${esc(S.names[r.by_uid].name)}${r.updated_at?' · '+esc(dt(Date.parse(r.updated_at))):''}</p>`:''}
   <p class="note bad" id="atErr" style="margin:8px 0 0"></p>
   <div class="acts" style="margin-top:8px">${ed?`<button class="btn pri" type="submit">حفظ</button>`:`<span class="note">${S.me?.role==='timekeeper'?(closed?'اليوم مغلق — التعديل عن طريق مدير المشروع.':'تسجّل لليوم أو أمس فقط.'):attCanMark()?'':'للعرض فقط.'}</span>`}
   ${attCanMark()?`<button class="btn ghost" type="button" data-a="atWEdit" data-v="${w.id}">تعديل بيانات العامل</button>`:''}<button class="btn ghost" type="button" data-a="atBadge" data-v="${w.id}">باج QR</button></div></form>`;
  overlay('att',esc(w.name),b);$('#ovroot').dataset.wid=wid;$('#ovroot').dataset.day=day;
  const f=$('#atF'),sync=()=>{const v=f.querySelector('input[name=atS]:checked')?.value||'';$('#atTimes').hidden=!(ATT_WORK.includes(v)||!v);$('#atAbsF').hidden=!['absent','leave'].includes(v)};
  f.addEventListener('change',e=>{if(e.target.name==='atS'){sync();const v=e.target.value;if(ATT_WORK.includes(v)&&!$('#atIn').value){$('#atIn').value=day===bgDay()?bgHM(Date.now()):c.start}}});
  f.addEventListener('submit',async e=>{e.preventDefault();const er=$('#atErr');er.textContent='';
    const v=f.querySelector('input[name=atS]:checked')?.value;if(!v){er.textContent='اختر الحالة';return}
    const edit=needReason?$('#atEdit').value.trim():null;if(needReason&&!edit){er.textContent='اكتب سبب التعديل';$('#atEdit').focus();return}
    const p={status:v,method:r?.method==='qr'&&r.status===v?'qr':'manual'};
    if(ATT_WORK.includes(v)){const ti=$('#atIn').value,to=$('#atOutT').value;if(!ti){er.textContent='اكتب وقت الدخول';return}
      p.in_at=dayIso(day,ti);p.out_at=to?dayIso(to<ti?dayAdd(day,1):day,to):null;
      if(p.out_at&&Date.parse(p.out_at)-Date.parse(p.in_at)>20*36e5){er.textContent='وقت الخروج غير منطقي';return}
      if(day===bgDay()&&Date.parse(p.in_at)>Date.now()+5*60e3){er.textContent='وقت الدخول بعده ما صار';return}
      if(!r||!ATT_WORK.includes(r.status)){const g=attGeoNow();if(g&&day===bgDay()){p.in_lat=g.lat;p.in_lng=g.lng;p.in_acc=g.acc}}
      p.reason=null}
    else{p.reason=$('#atReason').value.trim()||null;p.excused=$('#atEx').checked;
      const file=$('#atFile').files[0];if(file){const sb_=f.querySelector('[type=submit]');sb_.disabled=true;sb_.textContent='جارِ رفع المرفق…';
        try{const s=await saveFile(file,w.name+' · '+day);p.attach=s.ref}catch(x){er.textContent=x.message;sb_.disabled=false;sb_.textContent='حفظ';return}}}
    const btn=f.querySelector('[type=submit]');btn.disabled=true;const ok=await attSave(wid,day,p,edit);
    if(ok){closeOv();render();toast('حُفظ: '+w.name+' — '+ATT_ST[v][0])}else{btn.disabled=false;btn.textContent='حفظ'}})}

/* scanning badges */
function attParseCode(txt){const s=String(txt||'').trim().toUpperCase().replace(/^MCW:/,'');return/^W\d{3,}$/.test(s)?s:null}
function attScan(last){const d=S.att.day||bgDay();
  openScanner('مسح باج العامل',(last?`<b class="${last.ok?'atok':'atbad'}">${esc(last.msg)}</b><br>`:'')+'وجّه الكاميرا على باج العامل. أول مسح = دخول، والمسح بعد ساعة أو أكثر = خروج. سكّر النافذة لما تخلص.',async txt=>{
    const code=attParseCode(txt),w=code&&S.att.workers.find(x=>x.code===code);let res;
    if(!w)res={ok:false,msg:'باج غير معروف: '+String(txt).slice(0,24)};
    else if(!w.active)res={ok:false,msg:w.name+' موقوف'};
    else{const r=attRec(w.id,d);
      if(!r||!ATT_WORK.includes(r.status)){const p=attInPatch(w.id,d,null,'qr');const ok=await attSave(w.id,d,p);res={ok,msg:ok?`✓ ${w.name} — ${ATT_ST[p.status][0]} ${bgHM(p.in_at)}`:'تعذر تسجيل '+w.name}}
      else if(!r.out_at&&r.in_at&&Date.now()-Date.parse(r.in_at)>=36e5){const ok=await attCheckOut(w.id,d);res={ok,msg:ok?`↩ ${w.name} — خروج ${bgHM(Date.now())}`:'تعذر تسجيل خروج '+w.name}}
      else res={ok:true,msg:`${w.name} مسجّل مسبقاً (${ATT_ST[r.status][0]}${r.out_at?' وخرج':''})`}}
    navigator.vibrate?.(res.ok?60:[60,60,60]);setTimeout(()=>{if($('#ovroot').dataset.kind==='scan'||!$('#ovroot').innerHTML)attScan(res)},700)})}

/* bulk, close, reopen, holiday */
function attBulk(){const A=S.att,d=A.day||bgDay(),q=A.q.trim();
  const list=A.workers.filter(w=>w.active&&!attRec(w.id,d)&&(!A.site||w.site===A.site)&&(!q||[w.name,w.code,w.trade,w.site].join(' ').includes(q)));if(!list.length)return;
  overlay('atbulk','حضور جماعي',`<p style="margin:0">تسجيل <b class="num">${list.length}</b> عامل حاضرين ${A.site?'في '+esc(A.site):''} ${esc(dayLabel(d))}، بوقت الآن (أو بداية الدوام إذا اليوم مو اليوم). استخدمه بس إذا شفتهم كلهم بعينك.</p>
   <div class="atchips">${list.slice(0,40).map(w=>`<span class="pill p-mute">${esc(w.name)}</span>`).join('')}${list.length>40?`<span class="muted small">و${list.length-40} غيرهم</span>`:''}</div>
   <div class="acts"><button class="btn pri" id="atBulkGo">تأكيد الحضور</button><button class="btn ghost" data-a="close">إلغاء</button></div>`);
  $('#atBulkGo').addEventListener('click',async e=>{e.target.disabled=true;let ok=0;for(let i=0;i<list.length;i+=5){const part=await Promise.all(list.slice(i,i+5).map(w=>attCheckIn(w.id,d)));ok+=part.filter(Boolean).length;e.target.textContent=`جارِ التسجيل… ${ok}/${list.length}`}
    closeOv();render();toast('انسجل '+ok+' عامل حاضر')})}
function attCloseDlg(){const A=S.att,d=A.day||bgDay(),c=attCfg(),off=c.off.includes(dayDow(d))||isHoliday(d);
  const un=A.workers.filter(w=>w.active&&!attRec(w.id,d)),pend=attQ().filter(x=>x.p.day===d).length;
  overlay('atclose','إغلاق '+esc(dayLabel(d)),`<div class="rcbox"><b style="font-family:var(--display);font-size:18px">${esc(dayLong(d))}</b>
   ${off?`<p style="margin:0">هذا يوم عطلة، فالإغلاق ما يسجّل غياب على أحد.</p>`:un.length?`<p style="margin:0"><b class="num">${un.length}</b> عامل ما انسجلوا، راح يتسجّلون <b style="color:var(--bad)">غائبين</b> تلقائياً.</p><div class="atchips">${un.slice(0,30).map(w=>`<span class="pill p-bad">${esc(w.name)}</span>`).join('')}${un.length>30?`<span class="muted small">و${un.length-30} غيرهم</span>`:''}</div>`:`<p style="margin:0">كل العمال مسجّلين ✓</p>`}
   <p class="note" style="margin:0">بعد الإغلاق ما يگدر مراقب الدوام يعدّل هذا اليوم. التعديل بعدها عن طريق مدير المشروع مع ذكر السبب. النظام يغلق كل يوم تلقائياً الساعة 11 بالليل إذا ما انغلق.</p>
   ${pend?`<p class="note bad" style="margin:0">عندك ${pend} تسجيل بهذا اليوم ما انرفع بعد. ارفعهم أولاً.</p>`:''}</div>
   <div class="acts"><button class="btn pri" id="atCloseGo" ${pend||!navigator.onLine?'disabled':''}>إغلاق اليوم</button><button class="btn ghost" data-a="close">رجوع</button></div>${!navigator.onLine?'<p class="note bad">الإغلاق يحتاج إنترنت.</p>':''}`);
  $('#atCloseGo').addEventListener('click',async e=>{e.target.disabled=true;const {data,error}=await sb.rpc('att_close_day',{p_day:d});
    if(error){toast(attErrMsg(error));e.target.disabled=false;return}
    await attLoad();closeOv();render();toast(data?.off?'انغلق اليوم (عطلة)':`انغلق اليوم — ${data?.absent||0} غائب${data?.alerts?' · '+data.alerts+' تنبيه غياب متكرر':''}`)})}
function attReopenDlg(){const d=S.att.day;overlay('atreopen','إعادة فتح '+esc(dayLabel(d)),`<form class="f" id="atRo"><label class="l">سبب إعادة الفتح<input id="atRoR" class="in" required placeholder="مثال: نسينا نسجّل عمال البناية T4"></label><p class="note" style="margin:0">بعد الفتح يگدر مراقب الدوام يعدّل (إذا اليوم أو أمس). سجلات الغياب التلقائي تبقى لحد ما تتعدّل.</p><div class="acts"><button class="btn pri" type="submit">إعادة الفتح</button><button class="btn ghost" type="button" data-a="close">رجوع</button></div></form>`);
  $('#atRo').addEventListener('submit',async e=>{e.preventDefault();const {error}=await sb.rpc('att_reopen_day',{p_day:d,p_reason:$('#atRoR').value.trim()});if(error){toast(attErrMsg(error));return}await attLoad();closeOv();render();toast('انفتح اليوم')})}

   <div class="filters"><input id="atWQ" class="in" placeholder="بحث بالاسم أو الرمز أو المهنة أو الهاتف…" value="${esc(A.wq)}" autocomplete="off">${origSel('atWOrig',A.worig)}<select id="atWSite" class="in" aria-label="البناية"><option value="">كل المواقع</option>${attSites().map(s=>`<option ${A.wsite===s?'selected':''}>${esc(s)}</option>`).join('')}</select><label class="atchk"><input type="checkbox" id="atWOff" ${A.woff?'checked':''}> إظهار الموقوفين</label></div>
   <p class="note"><span class="num">${act}</span> عامل فعّال${A.workers.length>act?` · <span class="num">${A.workers.length-act}</span> موقوف`:''}${S.me?.role==='timekeeper'?' · الأجور يحددها مدير المشروع':''}</p>`;
  if(!list.length)return h+`<div class="empty"><b>${A.workers.length?'لا نتائج':'ما مسجّل أي عامل بعد'}</b>${A.workers.length?'غيّر البحث.':'اضغط «+ إضافة عامل».'}</div>`;

    <div class="acts"><button class="btn sm" data-a="atBadge" data-v="${w.id}">باج</button>${attCanMark()?`<button class="btn sm" data-a="atWEdit" data-v="${w.id}">تعديل</button>`:''}<button class="btn sm ghost" data-a="atOpen" data-v="${w.id}">الدوام</button></div></div>`).join('')}</div></section>`).join('')}

  const del=$('#awDel');if(del)del.addEventListener('click',()=>{$('#awDelC').innerHTML='<button class="btn bad sm" type="button" id="awDel2">تأكيد الحذف</button>';$('#awDel2').addEventListener('click',async()=>{
    const {error}=await sb.from('workers').delete().eq('id',w.id);if(error){$('#awErr').textContent=/foreign key|violates/i.test(error.message)?'العامل عنده سجل حضور، ما ينحذف. شيل علامة «فعّال» حتى توقفه.':attErrMsg(error);return}
    S.att.workers=S.att.workers.filter(x=>x.id!==w.id);closeOv();render();toast('انحذف العامل')})});
  $('#atWF').addEventListener('submit',async e=>{e.preventDefault();const er=$('#awErr'),btn=e.target.querySelector('[type=submit]');er.textContent='';
    const name=$('#awN').value.trim().replace(/\s+/g,' ');if(name.length<2){er.textContent='اكتب اسم العامل';return}
    const phone=digitsOnly($('#awP').value);if(phone&&(phone.length<10||phone.length>15)){er.textContent='رقم الهاتف غير صحيح';return}
    const dup=S.att.workers.find(x=>x.id!==w.id&&x.name===name&&(x.site||'')===($('#awS').value.trim()));if(dup&&!e.target.dataset.dupOk){er.textContent='يوجد عامل بنفس الاسم بنفس الموقع ('+dup.code+'). اضغط مرة ثانية إذا هو شخص آخر.';e.target.dataset.dupOk='1';return}
    const ov=$('#awO').value==='__o'?$('#awOO').value.trim().replace(/\s+/g,' '):$('#awO').value;if(!ov||ov.length<2){er.textContent='اختر جنسية العامل';return}
    if(!$('#awT').value.trim()){er.textContent='اكتب مهنة العامل (مثال: طباخ، حداد)';$('#awT').focus();return}
    const o={name,origin:ov,phone:phone||null,trade:$('#awT').value.trim()||null,site:$('#awS').value.trim()||null,team:$('#awG').value.trim()||null,notes:$('#awNo').value.trim()||null};

    btn.disabled=true;
    try{const f=$('#awF').files[0];if(f){btn.textContent='جارِ رفع الصورة…';o.photo=(await saveFile(f)).ref}

      if(res.error)throw res.error;const i=S.att.workers.findIndex(x=>x.id===res.data.id);if(i<0)S.att.workers.push(res.data);else S.att.workers[i]=res.data;
      await invLog((n?'أضاف عامل: ':'عدّل بيانات العامل: ')+name+' ('+res.data.code+')','').catch(()=>{});

    catch(x){er.textContent=attNetErr(x)?'إضافة العمال تحتاج إنترنت':attErrMsg(x);btn.disabled=false;btn.textContent=n?'إضافة':'حفظ'}})}

function printHTML(html){const f=document.createElement('iframe');f.setAttribute('aria-hidden','true');f.style.cssText='position:fixed;left:0;bottom:0;width:1px;height:1px;border:0;opacity:0';document.body.appendChild(f);
  const d=f.contentDocument;d.open();d.write(html);d.close();setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){toast('تعذر فتح الطباعة')}setTimeout(()=>f.remove(),60000)},450)}
function csvDownload(name,rows){const s='﻿'+rows.map(r=>r.map(c=>{c=String(c??'');return/[",\n\r]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}

/* absences */
function attAbsView(){const A=S.att,t=bgDay();A.absFrom=A.absFrom||monthStart(t);A.absTo=A.absTo&&A.absTo<=t?A.absTo:t;if(A.absFrom>A.absTo)A.absFrom=A.absTo;
  if(A.from&&A.absFrom<A.from){attEnsure(A.absFrom,A.absTo).then(c=>{if(c)attRerender(true)});}
  const c=attCfg(),site=A.absSite,org=A.absOrig,okW=w=>w&&(!site||w.site===site)&&(!org||origOf(w)===org);
  const rows=Object.values(A.rows).filter(r=>r.day>=A.absFrom&&r.day<=A.absTo&&(r.status==='absent'||(A.absAll&&r.status==='leave'))&&(A.absAll||!r.excused));
  const by={};rows.forEach(r=>{const w=attWorker(r.worker_id);if(!okW(w))return;(by[w.id]=by[w.id]||{w,list:[]}).list.push(r)});
  const groups=Object.values(by);
  const streaks=A.workers.filter(w=>w.active&&okW(w)).map(w=>[w,attStreak(w.id)]).filter(([,n])=>n>=c.alertDays).sort((a,b)=>b[1]-a[1]);
  let h=`<div class="filters"><label class="atday"><span class="muted small">من</span><input id="atAF" class="in num" type="date" value="${A.absFrom}" max="${t}"></label><label class="atday"><span class="muted small">إلى</span><input id="atAT" class="in num" type="date" value="${A.absTo}" max="${t}"></label>
   ${origSel('atAOrig',org)}<select id="atASite" class="in" aria-label="الموقع"><option value="">كل المواقع</option>${attSites().map(s=>`<option ${site===s?'selected':''}>${esc(s)}</option>`).join('')}</select><label class="atchk"><input type="checkbox" id="atAAll" ${A.absAll?'checked':''}> إظهار الغياب بإذن والإجازات</label></div>`;
  if(streaks.length)h+=`<div class="sec atwarn" style="margin-top:12px"><h4 style="margin:0 0 6px">⚠ غياب متكرر الآن (${c.alertDays} أيام أو أكثر بدون إذن)</h4>${streaks.map(([w,n])=>`<button class="orow" data-a="atOpen" data-v="${w.id}"><span class="mono">${initials(w.name)}</span><span class="an"><b>${esc(w.name)}</b><span class="muted small">${[origOf(w),w.trade,w.site,w.phone].filter(Boolean).map(esc).join(' · ')}</span></span><span class="pill p-bad"><span class="num">${n}</span> أيام متتالية</span></button>`).join('')}</div>`;
  const total=groups.reduce((s,g)=>s+g.list.length,0);
  h+=`<p class="note"><span class="num">${total}</span> يوم غياب ${A.absAll?'(كل الأنواع)':'بدون إذن'} · <span class="num">${groups.length}</span> عامل · من ${esc(dayLabel(A.absFrom))} إلى ${esc(dayLabel(A.absTo))}</p>`;
  if(!groups.length)return h+`<div class="empty"><b>ماكو غيابات بهذه الفترة</b>${A.absAll?'':'جرّب إظهار الغياب بإذن.'}</div>`;
  const byO={};groups.forEach(g=>{const o=origOf(g.w);(byO[o]=byO[o]||[]).push(g)});
  return h+Object.keys(byO).sort(origSort).map(o=>{const gs=byO[o].sort((a,b)=>b.list.length-a.list.length||a.w.name.localeCompare(b.w.name,'ar')),n=gs.reduce((s,g)=>s+g.list.length,0);
    return`<section class="atgrp"><h3 class="atgh"><span>${esc(o)}</span><span class="muted small"><span class="num">${n}</span> يوم غياب · <span class="num">${gs.length}</span> عامل</span></h3><div class="list" style="margin-top:6px">${gs.map(g=>`<div class="sec atabs"><div class="atabs-h"><button class="atw" data-a="atOpen" data-v="${g.w.id}"><span class="av">${initials(g.w.name)}</span><span class="an"><b>${esc(g.w.name)}</b><span class="small atsubl">${g.w.trade?`<b class="attr">${esc(g.w.trade)}</b>`:''}${g.w.phone?`<span class="num">${esc(g.w.phone)}</span>`:''}<span class="muted">${[g.w.site,g.w.code].filter(Boolean).map(esc).join(' · ')}</span></span></span></button><span class="pill p-bad"><span class="num">${g.list.length}</span> يوم</span></div>
   <div class="atchips">${g.list.sort((a,b)=>a.day<b.day?1:-1).map(r=>`<button class="atday-c ${r.excused||r.status==='leave'?'ex':''}" data-a="atOpenD" data-v="${g.w.id}|${r.day}" title="${esc(r.reason||'')}">${esc(dayLabel(r.day))}${r.status==='leave'?' · إجازة':r.excused?' · بإذن':''}${r.reason?' · '+esc(r.reason.slice(0,24)):''}${r.attach?' 📎':''}</button>`).join('')}</div></div>`).join('')}</div>
   <div class="atgf"><b>مجموع ${esc(o)}:</b><span class="g-bad">غياب <b class="num">${n}</b> يوم</span><span class="muted"><b class="num">${gs.length}</b> عامل</span></div></section>`}).join('')}
/* reports */
function attRepView(){const A=S.att,t=bgDay(),c=attCfg();A.repDay=A.repDay&&A.repDay<=t?A.repDay:(A.day||t);A.month=A.month||t.slice(0,7);
  const mFrom=A.month+'-01',mTo=monthEnd(mFrom)>t?t:monthEnd(mFrom);
  if(A.from&&(mFrom<A.from||A.repDay<A.from))attEnsure(mFrom<A.repDay?mFrom:A.repDay,t).then(ch=>{if(ch)attRerender(true)});
  /* daily by nationality or by site */
  const d=A.repDay,bySite=A.repBy==='site',key=bySite?(w=>w.site||'بدون موقع'):origOf;
  const dw=A.workers.filter(w=>w.active||attRec(w.id,d)),gs=attGroup(dw,key),tot=attDayCount(dw,d);
  const pct=o=>o.all?Math.round(o.work/o.all*100)+'%':'—';
  const drow=(lab,o,cls)=>`<tr class="${cls||''}"><td><b>${esc(lab)}</b></td><td class="q">${o.all}</td><td class="q ok">${o.work}</td><td class="q">${o.late}</td><td class="q">${o.half}</td><td class="q ${o.absent?'bad':''}">${o.absent}</td><td class="q">${o.leave}</td><td class="q ${o.none?'warn':''}">${o.none}</td><td class="q">${pct(o)}</td></tr>`;

function attMonthRows(){const A=S.att,t=bgDay(),mFrom=A.month+'-01',mTo=monthEnd(mFrom)>t?t:monthEnd(mFrom),pay=attSeesPay();

  return{mFrom,mTo,pay,rows:ws.map(w=>{const o=attSum(w.id,mFrom,mTo);return{w,o,p:pay?attPay(w,o):null}})}}
function attCsv(){const {mFrom,mTo,pay,rows}=attMonthRows();const days=[];for(let d=mFrom;d<=mTo;d=dayAdd(d,1))days.push(d);const ab={present:'ح',late:'ت',half:'ن',absent:'غ',leave:'إ'};
  const head=['الجنسية','الرمز','الاسم','المهنة','الهاتف','الموقع','الفريق','مداوم','تأخير','نص يوم','غياب','غياب بإذن','إجازة','إضافي (ساعة)',...(pay?['نوع الأجر','الأجر','المستحق']:[]),...days.map(d=>+d.slice(8))];
  const out=[head];let cur=null,acc=null;
  const flush=()=>{if(cur!==null)out.push(['مجموع '+cur,'','','','','','',acc.w,acc.l,acc.h,acc.a,acc.x,acc.v,acc.ot,...(pay?['','',Math.round(acc.p)]:[])])};
  rows.forEach(({w,o,p})=>{const g=origOf(w);if(g!==cur){flush();cur=g;acc={w:0,l:0,h:0,a:0,x:0,v:0,ot:0,p:0}}
    acc.w+=o.present+o.late;acc.l+=o.late;acc.h+=o.half;acc.a+=o.absent;acc.x+=o.absX;acc.v+=o.leave;acc.ot+=o.ot;acc.p+=p||0;
    out.push([g,w.code,w.name,w.trade||'',w.phone||'',w.site||'',w.team||'',o.present+o.late,o.late,o.half,o.absent,o.absX,o.leave,o.ot,...(pay?[w.pay_type==='monthly'?'شهري':'يومي',+w.wage||0,p==null?'':Math.round(p)]:[]),...days.map(d=>{const r=attRec(w.id,d);return r?ab[r.status]+(r.status==='absent'&&r.excused?'*':''):''})])});
  flush();out.push([]);out.push(['ح = حاضر، ت = متأخر، ن = نص يوم، غ = غائب، غ* = غائب بإذن، إ = إجازة']);
  csvDownload('دوام-العمال-'+S.att.month+(S.att.repOrig?'-'+S.att.repOrig:'')+(S.att.repSite?'-'+S.att.repSite:'')+'.csv',out);toast('نزل الملف — يفتح بالـ Excel')}

   ${Object.keys(byO).length>1?sub('المجموع الكلي ('+rows.length+')',rows):''}</tbody></table>

function attAuditView(){const A=S.att;if(!A.audit){(async()=>{const {data,error}=await sb.from('att_audit').select('*').order('id',{ascending:false}).limit(300);A.audit=error?{err:error.message}:data||[];attRerender(true)})();return`<div class="empty"><b>جارِ التحميل…</b></div>`}
  if(A.audit.err)return`<div class="empty"><b>تعذر التحميل</b>${esc(A.audit.err)}</div>`;
  const OP={update:'عدّل',delete:'حذف',insert:'سجّل بيوم مغلق',close:'أغلق اليوم',reopen:'أعاد فتح اليوم',holiday:'حدّد عطلة رسمية',unholiday:'ألغى العطلة'};
  const st=x=>x?(ATT_ST[x.status]?.[0]||'')+(x.status==='absent'&&x.excused?' بإذن':'')+(x.in_at?' '+bgHM(x.in_at):'')+(x.out_at?'←'+bgHM(x.out_at):''):'';
  let h=`<div class="filters"><button class="btn sm" data-a="atAuditRe">تحديث</button><span class="note" style="align-self:center">كل تعديل بعد التسجيل، ومين سوّاه ومتى وليش. ما ينمسح.</span></div>`;
  if(!A.audit.length)return h+`<div class="empty"><b>ماكو تعديلات بعد</b></div>`;
  return h+`<div class="sec" style="margin-top:10px"><ul class="log">${A.audit.map(a=>{const w=a.worker_id&&attWorker(a.worker_id),who=a.by_uid?(S.names[a.by_uid]?.name||'مستخدم'):'النظام (تلقائي)';
    let det='';if(a.op==='update')det=`${esc(st(a.old))} ← <b>${esc(st(a.new))}</b>`;else if(a.op==='delete')det=esc(st(a.old));else if(a.op==='insert')det=esc(st(a.new));
    else if(a.op==='close'&&a.new)det=a.new.off?'عطلة':`<span class="num">${a.new.absent||0}</span> غائب تلقائي${a.new.auto?' · إغلاق تلقائي':''}`;
    return`<li><i></i><span><b>${esc(who)}</b> ${OP[a.op]||esc(a.op)}${w?' — '+esc(w.name):''} · ${esc(dayLabel(a.day||bgDay()))}${det?'<br><span class="small">'+det+'</span>':''}${a.reason?'<br><span class="small muted">السبب: '+esc(a.reason)+'</span>':''}</span><small class="num">${esc(dt(Date.parse(a.at)))}</small></li>`}).join('')}</ul></div>`}

function render(){
  const app=$('#app');
  const canBack=!!$('#ovroot').innerHTML||S.hist.length>0;
  const dark=isDark();
  let h=`<header class="top"><div class="nav"><button class="ib" data-a="goback" aria-label="رجوع خطوة" title="رجوع" ${canBack?'':'disabled'}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button><button class="ib" data-a="theme" aria-label="${dark?'الإضاءة الصباحية':'الإضاءة الليلية'}" title="${dark?'الإضاءة الصباحية':'الإضاءة الليلية'}">${dark?SUN:MOON}</button></div><div class="brand"><div class="mark"><img src="${LOGO}" alt="شعار شركة المنصور"></div><div style="min-width:0"><h1>${ATT_ONLY?'حضور العمال':'نظام شركة المنصور'}</h1><p>${ATT_ONLY?'شركة المنصور — الدوام والغيابات':'نظام مخازن ومشتريات معمل الإسمنت'}</p></div></div>`;
  if(S.me){
    if(ATT_ONLY){h+=`<div class="who"><span class="wn"><b>${esc(S.me.full_name||S.me.username)}</b><span>${esc(ROLES[S.me.role]?.name||(isOwner()?OWNER_NAME:''))}</span></span>`;if(S.me.role!=='timekeeper')h+=`<a class="btn sm" href="../">النظام الرئيسي</a>`;h+=`<button class="btn sm ghost" data-a="logout">خروج</button></div>`}
    else{
    h+=`<div class="who"><span class="wn"><b>${esc(S.me.full_name||S.me.username)}</b><span>${S.role&&!S.view?esc(ROLES[S.role].name):(isDev()?'مطوّر النظام':isOwner()?OWNER_NAME:'')}</span></span>`;
    if(isDev()&&S.view!=='dev')h+=`<button class="btn sm pri" data-a="devPanel">لوحة المطوّر</button>`;
    if(isOwner()&&S.view!=='org')h+=`<button class="btn sm" data-a="orgView">الموظفين</button>`;
    if(isOwner())h+=`${S.view!=='accounts'?`<button class="btn sm" data-a="accounts">الحسابات</button>`:''}${S.role||S.view?`<button class="btn sm" data-a="switch">الواجهات</button>`:''}`;
    if(seesNotifs()&&S.me.active){const u=unread();h+=`<button class="ib bell" data-a="bell" aria-label="الإشعارات" title="الإشعارات"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>${u?`<span class="bdg num">${u>99?'99+':u}</span>`:''}</button>`}
    h+=`<button class="btn sm ghost" data-a="logout">خروج</button></div>`;
  }}
  h+=`</header>`;
  if(S.mode==='loading')h+=`<div class="empty"><b>جارِ التحميل…</b>${ATT_ONLY?'تحميل العمال والدوام':'تحميل الطلبات والمخزون'}</div>`;
  else if(S.mode==='login')h+=loginView();
  else if(S.me&&S.me.status==='pending')h+=pendingView();
  else if(!S.me||!S.me.active||(!isOwner()&&!ROLES[S.me.role]))h+=noRoleView();
  else if(ATT_ONLY)h+=attOnlyHome();
  else if(isOwner()&&S.view==='accounts')h+=accountsView();
  else if(isDev()&&S.view==='dev')h+=devView();
  else if(seesOrg()&&S.view==='org')h+=orgView();
  else h+=S.role?roleHome():rolePicker();
  app.innerHTML=h;bindLogin();
  if(S.open&&$('#ovroot').dataset.kind==='req'){const r=S.requests.find(x=>x.id===S.open);if(r&&r.updatedAt!==S.openSig)openReq(r,true)}
}
function rolePicker(){
  const card=k=>{const ad=ROLES[k].kind==='admin',n=ad?recent24():queueFor(k).length;return`<button class="rc" data-a="role" data-v="${k}"><div class="mono">${ROLES[k].mono}</div><div><strong>${ROLES[k].name}</strong><span>${roleDesc(k)}</span></div><div class="cnt ${n?'':'zero'} ${ad?'watch':''} num" title="${ad?'حركات آخر 24 ساعة':'بانتظار إجرائك'}">${n}</div></button>`};
  return`<section class="pick"><h2>اختر واجهتك</h2>${isOwner()?`<div class="banner" style="background:var(--info-soft);color:var(--info);margin:0 0 14px">أنت مسؤول النظام: تستطيع فتح أي واجهة للمعاينة. الموظفون يدخلون بحساباتهم مباشرة لواجهاتهم.<button class="btn sm" data-a="accounts">إدارة الحسابات</button></div>`:''}<p>كل شخص يدخل بصفته. الرقم على كل بطاقة هو عدد الطلبات التي تنتظر إجراءه الآن، وعند الإدارة هو عدد الحركات خلال آخر 24 ساعة.</p>
  <div class="group-label">رؤساء الأقسام</div><div class="roles">${['machines','elec','mech'].map(card).join('')}</div>
  <div class="group-label">المخزن والمشروع</div><div class="roles">${['store','mstore','project'].map(card).join('')}</div>
  <div class="group-label">الإدارة (مراقبة)</div><div class="roles">${['admin1','admin2'].map(card).join('')}</div>
  <div class="group-label">المشتريات</div><div class="roles">${['buyer'].map(card).join('')}</div>
  <div class="group-label">كادر الآليات</div><div class="roles">${['keeper','operator','mechanic','fueler','supply'].map(card).join('')}</div>
  <div class="group-label">عمال الأقسام</div><div class="roles">${['receiver','elec_tech','mech_tech','clerk'].map(card).join('')}</div>
  <div class="group-label">حضور العمال</div><div class="roles">${['timekeeper'].map(card).join('')}</div></section>`;
}
function roleDesc(k){const CD={timekeeper:'جولة الحضور اليومية للعمال، الغيابات، باجات QR، والتقارير',elec_tech:'طلب مواد قسم الكهرباء ومتابعتها',mech_tech:'طلب مواد قسم الميكانيك ومتابعتها',buyer:'عروض الأسعار والشراء والفواتير والتسليم بالباركود',clerk:'متابعة الإشعارات وسجل الحركات والطلبات',receiver:'استلام المواد المشتراة بالباركود نيابة عن مدير المخزن',supply:'استقبال شاحنات المواد ومتابعة تنزيلها بالمعمل',keeper:'صرف قطع الغيار والزيوت للآليات، الاستلام، والرصيد',operator:'الوردية، العدّاد، الوقود، والإبلاغ عن الأعطال',mechanic:'إصلاح الأعطال والصيانة الدورية وطلب القطع',fueler:'تسجيل تعبئة الوقود لكل آلية'};if(CD[k])return CD[k];if(k==='mstore')return'قطع غيار وزيوت الآليات: الفحص، الصرف، الاستلام بالباركود، الرصيد';return{dept:'رفع طلبات المواد ومتابعتها',store:'فحص الطلبات، الصرف، الاستلام، الرصيد',project:'أولوية كاملة: كل الموافقات والمراحل، الطلبات، وتسجيل الموظفين',admin:'مراقبة كل الطلبات والحركات والمصروف',purchase:'الموافقة على الشراء، التنفيذ، الفواتير، GPS'}[ROLES[k].kind]}

function tabsFor(role){if(role==='timekeeper')return attTabsTK();const T=tabsFor0(role);if(seesAtt()&&['project','admin1','admin2','clerk'].includes(role)){const i=T.findIndex(t=>t[0]==='approve');T.splice(i<0?0:i+1,0,['att','حضور العمال',attAlertN()])}const add=[];if(EXP_ROLES.includes(role))add.push(['exp','الصرفيات',0]);if(['store','mstore','keeper'].includes(role))add.unshift(['ins','المدخلات',(S.invoices||[]).filter(v=>v.kind==='in'&&v.wh===myWh(role)&&sameDayT(v.createdAt||v.at)).length],['outs','المخرجات',S.invlog.filter(e=>e.kind==='out'&&e.wh===myWh(role)&&sameDayT(e.at||e.t)).length]);if(!T.some(t=>t[0]==='feed'))add.push(['feed','السجل',0]);if(INVC_ROLES.includes(role))add.push(['invc','الفواتير',(S.invoices||[]).filter(v=>(!scopeWh(role)||v.wh===scopeWh(role))&&sameDayT(v.createdAt||v.at)).length]);const i=T.findIndex(t=>t[0]==='all');if(i<0)T.push(...add);else T.splice(i,0,...add);return T}
function tabsFor0(role){
  const k=ROLES[role].kind,q=queueFor(role);
  if(role==='operator')return[['work','آليتي',0],['mine','طلباتي',mine(role).filter(r=>!['done','rejected'].includes(r.status)).length]];
  if(role==='mechanic')return[['work','أعمال الصيانة',S.machines.filter(m=>m.status==='down').length],['mine','طلباتي',mine(role).filter(r=>!['done','rejected'].includes(r.status)).length]];
