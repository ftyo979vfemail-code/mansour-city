<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#014e55">
<title>المنصور تاكسي</title>
<meta name="description" content="المنصور تاكسي: تكاسي مجمّع المنصور، سواق مسجّلين وكل سيارة متتبَّعة مباشرة.">
<meta property="og:title" content="المنصور تاكسي">
<meta property="og:description" content="تكاسي مجمّع المنصور، سواق مسجّلين وكل سيارة متتبَّعة مباشرة.">
<meta property="og:image" content="https://ftyo979vfemail-code.github.io/mansour-city/taxi/img/og.png">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="المنصور تاكسي">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Al-Mansour Taxi: the logo's deep teal towers + taxi-yellow road; landing page rides a dashed road line */
:root{
  --bg:#f2f5f4; --panel:#ffffff; --line:#d9e2e0; --fg:#0f2326; --muted:#5d6f71;
  --teal:#014e55; --teal-deep:#00383d; --on-teal:#eaf2f1;
  --amber:#febd02; --amber-ink:#2a1f00; --ok:#16935a; --warn:#d97706; --bad:#d6332b; --idle:#8a9294;
  --plate:#ffffff; --plate-band:#1f4fa3;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1d20; --panel:#12292d; --line:#21403f; --fg:#e8efee; --muted:#93a8a8;
  --teal:#01474e; --teal-deep:#003237; --on-teal:#eaf2f1;
  --amber:#febd02; --amber-ink:#2a1f00; --ok:#2fbf7a; --warn:#f0a030; --bad:#ff5a4f; --idle:#7f8c8e;
  --plate:#f4f4f0; --plate-band:#2a5cb8; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--body)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;font-weight:600}
a.btn{color:var(--fg);text-decoration:none;display:inline-block}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.field input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%}
.err{color:var(--bad);font-size:14px;min-height:1.4em}

/* Plate */
.plate{display:inline-flex;align-items:stretch;border:2px solid #1b1d22;border-radius:6px;overflow:hidden;background:var(--plate);color:#111;font-family:var(--mono);font-weight:600;direction:ltr;line-height:1}
.plate b{background:var(--plate-band);color:#fff;font:600 10px/1 var(--body);padding:4px 5px;display:flex;align-items:center;writing-mode:vertical-rl}
.plate span{padding:5px 9px;font-size:15px;letter-spacing:.06em;display:flex;align-items:center}
.plate.lg span{font-size:28px;padding:10px 16px}
.plate.lg b{font-size:13px;padding:6px 8px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.s-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.s-bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.s-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.s-idle{color:var(--idle);background:color-mix(in srgb,var(--idle) 14%,transparent)}
.s-ok.live::before{animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* Gate */
.gate{min-height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
.gate-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:44px;height:44px;display:grid;place-items:center}
.brand-mark img{width:100%;height:100%;object-fit:contain}
.logo-dark{display:none}
@media (prefers-color-scheme:dark){.logo-light{display:none}.logo-dark{display:inline}}
.brand small{display:block;color:var(--muted);font-size:13px}
.code-input{font:600 30px var(--mono)!important;text-align:center;letter-spacing:.35em;direction:ltr}
.switch{font-size:14px;color:var(--muted);text-align:center}
.switch a{color:var(--fg);font-weight:600}

/* Admin shell */
.shell{height:100vh;height:100dvh;display:grid;grid-template-rows:auto auto 1fr;grid-template-columns:minmax(0,1fr)}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));background:var(--panel);border-bottom:1px solid var(--line)}
.top .brand{margin-inline-end:auto}
.counts{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;padding:8px max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--fg);border-color:var(--amber)}
.view{min-height:0;overflow:auto}
.alert{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--bad) 14%,var(--panel));color:var(--bad);font-weight:600;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));border-bottom:1px solid color-mix(in srgb,var(--bad) 30%,var(--line))}

.live{display:grid;grid-template-columns:340px 1fr;height:100%}
.list{border-inline-end:1px solid var(--line);overflow:auto;background:var(--panel)}
.car{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;text-align:start;width:100%;background:none;border-inline:0;border-top:0}
.car:hover,.car.sel{background:color-mix(in srgb,var(--amber) 9%,transparent)}
.car .who{font-weight:600}
.car .meta{grid-column:1/-1;color:var(--muted);font-size:13px;display:flex;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
#map{height:100%;min-height:360px;background:var(--line)}
.empty{padding:28px 20px;color:var(--muted);text-align:center}

.wrap{padding:18px max(16px,env(safe-area-inset-right)) 28px max(16px,env(safe-area-inset-left));max-width:1100px;margin:0 auto}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar h2{margin-inline-end:auto;font-size:20px}
.tbl-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:11px 14px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
tr:last-child td{border-bottom:0}
td .acts{display:flex;gap:6px;flex-wrap:wrap}
.code{font:600 15px var(--mono);letter-spacing:.15em;direction:ltr;display:inline-block}
.log li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.log{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.log time{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.share{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.share code{font-family:var(--mono);direction:ltr;word-break:break-all;flex:1;min-width:0}

/* Modal */
.modal{position:fixed;inset:0;background:rgb(0 0 0/.45);display:grid;place-items:center;padding:16px;z-index:2000}
.sheet{background:var(--panel);border-radius:16px;width:min(520px,100%);max-height:90vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sheet .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:3000}

/* Driver */
.drv{min-height:100%;display:flex;flex-direction:column;gap:18px;padding:22px max(16px,env(safe-area-inset-right)) 22px max(16px,env(safe-area-inset-left));max-width:520px;margin:0 auto}
.ring{align-self:center;width:210px;height:210px;border-radius:50%;display:grid;place-items:center;text-align:center;border:10px solid var(--ok);position:relative}
.ring{background:var(--ok);color:#fff;cursor:pointer;box-shadow:0 8px 24px rgb(0 0 0/.18);font:inherit;-webkit-tap-highlight-color:transparent;transition:transform .12s}
.ring:active{transform:scale(.96)}
.ring{border-color:color-mix(in srgb,var(--ok) 70%,#000)}
.ring.off{background:var(--bad);border-color:color-mix(in srgb,var(--bad) 70%,#000)}
.ring strong{font-size:26px} .ring small{color:rgb(255 255 255/.9)!important}
.ring::after{content:"";position:absolute;inset:-22px;border-radius:50%;border:2px solid currentColor;color:var(--ok);opacity:.4;animation:ripple 2s infinite}
.ring.bad::after,.ring.wait::after,.ring.off::after{display:none}
@keyframes ripple{from{transform:scale(.85);opacity:.5}to{transform:scale(1.1);opacity:0}}
.ring strong{font:700 22px var(--display)}
.ring small{color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat small{color:var(--muted);font-size:12.5px;display:block}
.stat b{font:600 17px var(--mono);font-variant-numeric:tabular-nums}
.note{font-size:13.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.block{position:fixed;inset:0;background:var(--bad);color:#fff;z-index:5000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
.block h2{font-size:30px}
.block p{max-width:340px;font-size:17px}
.block .btn{background:#fff;color:var(--bad);border:0;font-size:18px;padding:14px 26px}

@media (max-width:820px){
  .live{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto}
  .list{border-inline-end:0;order:2}
  #map{order:1}
  .grid2{grid-template-columns:1fr}
}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi small{color:var(--muted);font-size:13px}
.kpi b{font:700 22px var(--display);font-variant-numeric:tabular-nums}
.kpi-bad{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 7%,var(--panel))}
.kpi-bad b{color:var(--bad)}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.h4{font:600 15px var(--display);margin:6px 0 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap .note{margin:0 0 14px}
select.btn{font-weight:500}
.trip{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.trip h3{font-size:19px}.trip p{margin:0;color:var(--muted);line-height:1.8}.trip p b{color:var(--fg)}
.trip.offer{border:2px solid var(--amber);background:color-mix(in srgb,var(--amber) 10%,var(--panel))}
.trip.on{border:2px solid var(--ok)}
.btn.big{font-size:18px;padding:14px;width:100%}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.wk{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wk b{font:600 15px var(--display);font-variant-numeric:tabular-nums}
.kpi-warn{border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.kpi-warn b{color:var(--warn)}
.calc{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.calc div{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.calc div:last-child{border-bottom:0}
.calc b{font-variant-numeric:tabular-nums}
.calc .tot{background:color-mix(in srgb,var(--amber) 14%,var(--panel));font-size:17px}
.rcpt{display:flex;flex-direction:column;gap:12px}
.rcpt p{margin:0}
.rc-head{display:flex;align-items:center;gap:14px;border-bottom:2px solid var(--amber);padding-bottom:10px}
.rc-head img{height:64px;width:auto}
.rc-head small{color:var(--muted)}
.rc-trips{min-width:0;font-size:13px}
.rc-trips th,.rc-trips td{padding:6px 8px}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:22px}
.sig div{border-top:1px solid var(--fg);padding-top:6px;text-align:center;color:var(--muted);font-size:13px}
@media print{
  body *{visibility:hidden}
  .rc-modal,.rc-modal *{visibility:visible}
  .rc-modal{position:absolute;inset:0;background:#fff;display:block;padding:0}
  .rc-modal .sheet{width:100%!important;max-height:none;box-shadow:none;color:#000;background:#fff}
  .no-print{display:none!important}
}
.steps-sm{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted);line-height:1.7}
.steps-sm b{color:var(--fg)} .steps-sm code{font-family:var(--mono);background:var(--bg);padding:1px 6px;border-radius:6px;color:var(--fg)}
.chk{display:flex;gap:10px;align-items:center;font-weight:600}
.chk input{width:20px;height:20px;accent-color:var(--ok)}
.trip details{color:var(--muted);font-size:14px}.trip summary{cursor:pointer;font-weight:600;margin-bottom:6px}
.ord-hero .hero-top{padding-block:14px}.ord-h1{font-size:clamp(28px,5vw,40px);padding-block:4px 70px}
.ord{max-width:560px;margin-top:-56px;position:relative;padding-bottom:40px}
.ocard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgb(0 0 0/.08)}
.zones{display:flex;flex-wrap:wrap;gap:8px;max-height:300px;overflow:auto;padding:2px}
.pts{border-radius:18px;padding:16px;background:linear-gradient(135deg,var(--teal-deep,#0b4f4a),#127066);color:#fff;display:flex;flex-direction:column;gap:10px}
.pts .pts-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.pts .pts-top b{font:700 30px var(--mono,monospace);color:var(--amber,#f5b400)}
.pts small{opacity:.85}
.pbar{height:12px;border-radius:999px;background:rgb(255 255 255/.18);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--amber,#f5b400);border-radius:inherit;transition:width .6s}
.pts.ready{box-shadow:0 0 0 3px var(--amber,#f5b400)}
.freeopt{display:flex;gap:10px;align-items:center;border:2px dashed var(--amber,#f5b400);border-radius:14px;padding:12px;font-weight:700;cursor:pointer}
.freeopt input{width:22px;height:22px;accent-color:var(--amber,#f5b400)}
.zchip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 14px;font-weight:600}
.zchip.on{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.ost{text-align:center;align-items:stretch}.ost h2{font-size:24px}.ost p{margin:0;color:var(--muted)}
.ost-ico{font-size:46px;line-height:1}
.drvcard{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;text-align:start;border:2px solid var(--ok);border-radius:14px;padding:12px 14px}
.drvcard small{display:block;color:var(--muted)}.drvcard b{font:700 18px var(--display)}
.back img{height:42px}
.reqbar{background:color-mix(in srgb,var(--amber) 22%,var(--panel));color:var(--fg);border-color:var(--amber)}
.reqbar .btn{margin-inline-start:auto}
.dpick{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto}
.dpick button{display:flex;align-items:center;gap:10px;text-align:start;border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 12px;color:var(--fg);font:inherit;cursor:pointer}
.dpick button:hover:not(:disabled){border-color:var(--amber)}
.dpick button[aria-pressed=true]{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,var(--panel))}
.dpick button:disabled{opacity:.5;cursor:not-allowed}
.dpick .dn{flex:1;min-width:0}.dpick .dn b{display:block}.dpick .dn small{color:var(--muted)}
.dpick .dk{font:600 14px var(--mono);white-space:nowrap}
.reqcard{border:2px solid var(--amber);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}
tr.row-new td{background:color-mix(in srgb,var(--amber) 12%,transparent)}
.addr{border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;margin:0;display:flex;flex-direction:column;gap:10px}
.addr legend{font:600 14px var(--display);padding:0 6px;color:var(--fg)}
.addr-row{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px}
.addr-row select,.addr-row input{width:100%;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.fcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.fcard header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fcard header div{display:flex;flex-direction:column;margin-inline-end:auto}
.fcard header small{color:var(--muted)}
.fbig small{display:block;color:var(--muted);font-size:13px}
.fbig b{font:700 28px var(--display);font-variant-numeric:tabular-nums}
.nav{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.nav-top{position:absolute;z-index:1000;top:calc(10px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:flex-start}
.nav-top .btn{background:var(--panel);box-shadow:0 3px 10px rgb(0 0 0/.2)}
.nav-search{flex:1;position:relative}
.nav-search input{width:100%;border:0;border-radius:12px;padding:12px 14px;background:var(--panel);box-shadow:0 3px 10px rgb(0 0 0/.2);font-size:16px}
.nsug{position:absolute;top:calc(100% + 6px);inset-inline:0;background:var(--panel);border-radius:12px;box-shadow:0 6px 20px rgb(0 0 0/.25);overflow:hidden;max-height:50vh;overflow-y:auto}
.nsug button{display:block;width:100%;text-align:start;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 14px;font-weight:600}
.nsug small{color:var(--muted);font-weight:400}
#nmap{flex:1}
.nbanner{position:absolute;z-index:1000;top:calc(66px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));background:#0b4f55;color:#fff;border-radius:14px;padding:12px 16px;box-shadow:0 6px 18px rgb(0 0 0/.3)}
.nbanner small{display:block;opacity:.8}.nbanner b{font:700 20px var(--display)}

const floorOpts=(b,sel)=>`<option value="">اختار</option><option value="أرضي" ${sel==="أرضي"?"selected":""}>أرضي</option>${Array.from({length:floorsOf(b)},(_,i)=>`<option ${sel===String(i+1)?"selected":""}>${i+1}</option>`).join("")}`;
function addrFields(saved,legend){
  saved=saved||{}; const isOther=saved.b&&!TOWERS.includes(saved.b);
  return `<fieldset class="addr"><legend>${legend}</legend>
      <div class="addr-row">
        <div class="field"><label for="o-bld">العمارة</label><select id="o-bld" class="btn" required><option value="">اختار</option>${TOWERS.map(t=>`<option ${saved.b===t?"selected":""}>${t}</option>`).join("")}<option value="other" ${isOther?"selected":""}>غيرها</option></select></div>
        <div class="field"><label for="o-flr">الطابق</label><select id="o-flr" class="btn" required>${floorOpts(saved.b||"",saved.f)}</select></div>
        <div class="field"><label for="o-apt">الشقة</label><input id="o-apt" inputmode="numeric" required value="${esc(saved.a||"")}" placeholder="رقم"></div>
      </div>
      <div class="field" id="o-bld-o-f" ${isOther?"":"hidden"}><label for="o-bld-o">اسم العمارة أو المكان</label><input id="o-bld-o" value="${isOther?esc(saved.b):""}" placeholder="مثال: البوابة الرئيسية"></div>
    </fieldset>`;
}
function wireAddr(){ $("#o-bld").onchange=e=>{const v=e.target.value;$("#o-bld-o-f").hidden=v!=="other";const f=$("#o-flr").value;$("#o-flr").innerHTML=floorOpts(v==="other"?"":v,f)} }
function readAddr(){
  const b=$("#o-bld").value==="other"?$("#o-bld-o").value.trim():$("#o-bld").value, f=$("#o-flr").value, a=$("#o-apt").value.trim();
  if(!b) throw new Error("اختار العمارة"); if(!f) throw new Error("اختار الطابق"); if(!a) throw new Error("اكتب رقم الشقة");
  return {b,f,a};
}

function ptsCard(p,compact){

  const th=p.redeem||5000, bal=p.balance||0, pct=Math.min(100,Math.round(bal*100/th)), ready=bal>=th, per=p.per_trip||0;
  const left=Math.max(0,th-bal), rides=per?Math.ceil(left/per):0;
  return `<div class="pts${ready?" ready":""}"><div class="pts-top"><span>⭐ نقاطك</span><b>${fmt(bal)}</b></div>
    <div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="${th}" aria-valuenow="${Math.min(bal,th)}"><i style="width:${pct}%"></i></div>
    <small>${ready?`🎉 عندك كروة مجانية! فعّلها وقت تطلب.`:`باقيلك ${fmt(left)} نقطة${rides?` (تقريبًا ${rides} سفرة)`:""} وتصير الكروة مجانية.`}</small>
    ${compact?"":`<small>كل ${fmt(1000)} نقطة = ${fmt(1000)} دينار · كل سفرة تكملها تاخذ ${fmt(per)} نقطة · ${fmt(th)} نقطة = كروة مجانية لحد ${fmt(th)} دينار.</small>`}</div>`;
}

/* ---------------- DRIVER NAVIGATION ----------------
   Area search -> fastest route that avoids congestion learned from our own taxis' GPS,
   turn-by-turn in Arabic, and the chosen route saved on the driver's trip. */
const OSRM="https://router.project-osrm.org/route/v1/driving/";
const NV={map:null,me:null,meMk:null,dest:null,routes:[],best:null,layers:[],watch:null,follow:false,zones:[],off:0,lastCalc:0};
function navApp(){
  if(!CODE){location.replace("#driver");return}
  document.title="الطريق · المنصور تاكسي";
  $("#app").innerHTML=`<div class="nav">
    <div class="nav-top">
      <a class="btn sm" href="#driver" aria-label="رجوع">‹ رجوع</a>
      <div class="nav-search"><input id="nq" type="search" placeholder="وين رايح؟ اكتب اسم المنطقة…" autocomplete="off"><div id="nsug" class="nsug" hidden></div></div>
    </div>
    <div id="nbanner" class="nbanner" hidden></div>
    <div id="nmap"></div>
    <div class="nsheet" id="nsheet"><p class="note" style="margin:0">اكتب اسم المنطقة فوق، أو اختار من القائمة. النظام يحسب أسرع طريق ويبعدك عن الزحمة اللي سجّلتها سياراتنا.</p></div>
  </div>`;
  if(typeof L==="undefined"){$("#nmap").innerHTML=`<div class="empty">تعذّر تحميل الخريطة، تأكد من الإنترنت.</div>`;return}
  NV.map=L.map("nmap",{zoomControl:false}).setView([33.315,44.366],12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(NV.map);
  L.control.zoom({position:"bottomleft"}).addTo(NV.map);
  setTimeout(()=>NV.map.invalidateSize(),150);
  if(NV.watch!==null) navigator.geolocation.clearWatch(NV.watch);
  NV.watch=navigator.geolocation.watchPosition(p=>navPos(p.coords),()=>{if(!NV.me)toast("شغّل الموقع حتى نحسب الطريق من مكانك")},{enableHighAccuracy:true,maximumAge:3000,timeout:20000});
  rpc("taxi_nav_zones",{p_key:CODE}).then(z=>{NV.zones=z;
    rpc("taxi_driver_state",{p_code:CODE}).then(st=>{const t=st.trip;if(t&&t.zone_id){const z2=NV.zones.find(x=>x.id===t.zone_id);if(z2&&z2.lat)navSetDest({name:z2.name,lat:z2.lat,lng:z2.lng})}}).catch(()=>{});
  }).catch(e=>toast(e.message));
  const q=$("#nq"), sug=$("#nsug"); let gT;
  q.oninput=()=>{const v=q.value.trim(); if(!v){sug.hidden=true;return}
    const hits=NV.zones.filter(z=>z.name.includes(v)).slice(0,8);
    sug.innerHTML=hits.map(z=>`<button data-zid="${z.id}">📍 ${esc(z.name)}${z.lat?"":" <small>(بدون موقع)</small>"}</button>`).join("")+`<button data-geo="1">🔎 ابحث بالخريطة عن «${esc(v)}»</button>`;
    sug.hidden=false;
    sug.querySelectorAll("[data-zid]").forEach(b=>b.onclick=()=>{const z=NV.zones.find(x=>x.id==b.dataset.zid);sug.hidden=true;q.value=z.name;
      if(z.lat) navSetDest({name:z.name,lat:z.lat,lng:z.lng}); else navGeocode(z.name)});
    sug.querySelector("[data-geo]").onclick=()=>{sug.hidden=true;navGeocode(v)};
  };
  NV.map.on("click",e=>{ if(!NV.follow) navSetDest({name:"نقطة على الخريطة",lat:e.latlng.lat,lng:e.latlng.lng}) });
}
function cleanPlace(n){return n.replace(/\(.*?\)/g,"").replace(/^من\s+/,"").replace(/وما حولها/,"").trim()}
async function navGeocode(name){
  try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&accept-language=ar&limit=1&viewbox=44.0,33.65,44.75,32.95&bounded=1&q=${encodeURIComponent(cleanPlace(name)+"، بغداد")}`).then(r=>r.json());
    if(!r.length) return toast("ما لگيت المكان، جرّب اسم ثاني أو اضغط على الخريطة");
    navSetDest({name,lat:+r[0].lat,lng:+r[0].lon});
  }catch{toast("تعذّر البحث، تأكد من الإنترنت")}
}
function navPos(c){
  NV.me={lat:c.latitude,lng:c.longitude,hd:c.heading,spd:c.speed};

const kmOf=m=>(m/1000).toFixed(1), minOf=s=>Math.max(1,Math.round(s/60));
function segLen(a,b){const R=6371000,toR=Math.PI/180,dl=(b[1]-a[1])*toR,dp=(b[0]-a[0])*toR,x=Math.sin(dp/2)**2+Math.cos(a[0]*toR)*Math.cos(b[0]*toR)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
async function navCalc(){
  if(!NV.me||!NV.dest) return; NV.lastCalc=Date.now();
  $("#nsheet").innerHTML=`<div class="empty">نحسب أسرع طريق…</div>`;
  let data; try{data=await fetch(`${OSRM}${NV.me.lng},${NV.me.lat};${NV.dest.lng},${NV.dest.lat}?alternatives=3&overview=full&geometries=geojson&steps=true`).then(r=>r.json())}
  catch{ $("#nsheet").innerHTML=`<p class="err">تعذّر حساب الطريق. <a href="${gmaps()}" target="_blank" rel="noopener">افتح بخرائط Google</a></p>`;return }
  if(!data.routes||!data.routes.length){$("#nsheet").innerHTML=`<p class="err">ما لگيت طريق لهذا المكان.</p>`;return}
  const routes=data.routes.map(r=>({...r,coords:r.geometry.coordinates.map(c=>[c[1],c[0]])}));
  // traffic cells from our fleet
  let lats=[],lngs=[]; routes.forEach(r=>r.coords.forEach(c=>{lats.push(c[0]);lngs.push(c[1])}));
  const pad=.01, bb=[Math.min(...lats)-pad,Math.min(...lngs)-pad,Math.max(...lats)+pad,Math.max(...lngs)+pad];
  let cells={}; try{const t=await rpc("taxi_traffic",{p_key:CODE,minlat:bb[0],minlng:bb[1],maxlat:bb[2],maxlng:bb[3]});t.forEach(c=>cells[(+c[0]).toFixed(3)+","+(+c[1]).toFixed(3)]={v:+c[2],n:c[3],live:c[4]})}catch{}
  const cellOf=(la,lo)=>cells[(Math.round(la/.002)*.002).toFixed(3)+","+(Math.round(lo/.002)*.002).toFixed(3)];
  routes.forEach(r=>{
    const free=r.distance/Math.max(r.duration,1); let extra=0; r.jam=[];
    for(let i=1;i<r.coords.length;i++){const a=r.coords[i-1],b=r.coords[i],len=segLen(a,b),k=Math.max(1,Math.ceil(len/100));
      for(let j=0;j<k;j++){const p0=[a[0]+(b[0]-a[0])*j/k,a[1]+(b[1]-a[1])*j/k],p1=[a[0]+(b[0]-a[0])*(j+1)/k,a[1]+(b[1]-a[1])*(j+1)/k],sl=len/k,c=cellOf((p0[0]+p1[0])/2,(p0[1]+p1[1])/2);
        if(c&&c.v<15){const v=Math.max(c.v,4)/3.6; extra+=Math.max(0,sl/v-sl/free); r.jam.push([p0,p1])}}}
    r.adj=r.duration+extra;

  navSave();
}
function navDraw(){
  NV.layers.forEach(l=>NV.map.removeLayer(l)); NV.layers=[];
  NV.routes.slice(1).forEach(r=>NV.layers.push(L.polyline(r.coords,{color:"#8a9294",weight:5,opacity:.6}).addTo(NV.map)));
  const b=NV.best;
  NV.layers.push(L.polyline(b.coords,{color:"#0b4f55",weight:9,opacity:.35}).addTo(NV.map));
  NV.layers.push(L.polyline(b.coords,{color:"#1f6feb",weight:6}).addTo(NV.map));
  NV.routes.forEach(r=>r.jam.forEach(s=>NV.layers.push(L.polyline(s,{color:"#d6332b",weight:r===b?7:4,opacity:.9}).addTo(NV.map))));
  if(!NV.follow) NV.map.fitBounds(L.polyline(b.coords).getBounds(),{padding:[40,40]});
}
function navSheet(){
  const b=NV.best, osrmFirst=NV.routes.reduce((m,r)=>r.duration<m.duration?r:m,NV.routes[0]);

   ${NV.routes.length>1?`<div class="nalts">${NV.routes.map((r,i)=>`<button class="btn sm ${r===b?"primary":""}" data-ri="${i}">${i===0?"الأسرع":"بديل "+i} · ${minOf(r.adj)} د</button>`).join("")}</div>`:""}

}
const gmaps=()=>NV.dest?`https://www.google.com/maps/dir/?api=1&destination=${NV.dest.lat},${NV.dest.lng}&travelmode=driving`:"#";
function stepText(st){
  const m=st.maneuver||{},mod=m.modifier||"",road=st.name?` على ${st.name}`:"";
  const dir={left:"يسار","slight left":"يسار خفيف","sharp left":"يسار حاد",right:"يمين","slight right":"يمين خفيف","sharp right":"يمين حاد",straight:"دغري",uturn:"ارجع"}[mod]||"";
  switch(m.type){
    case "depart": return `انطلق${road}`;
    case "arrive": return "وصلت للمكان";
    case "roundabout": case "rotary": return `بالفلكة اطلع المخرج ${m.exit||""}${road}`;
    case "exit roundabout": case "exit rotary": return `اطلع من الفلكة${road}`;
    case "merge": return `اندمج ${dir}${road}`;
    case "on ramp": return `اطلع على المدخل ${dir}${road}`;
    case "off ramp": return `انزل من المخرج ${dir}${road}`;
    case "fork": return `بالتفرّع خذ ${dir}${road}`;
    case "continue": case "new name": return `استمر ${dir}${road}`;
    case "end of road": return `بنهاية الشارع لف ${dir}${road}`;
    default: return mod==="uturn"?`ارجع${road}`:mod==="straight"?`استمر دغري${road}`:`لف ${dir}${road}`;
  }
}
function navSteps(){
  const out=[]; (NV.best.legs||[]).forEach(l=>l.steps.forEach(st=>out.push({txt:stepText(st),dist:st.distance>=1000?kmOf(st.distance)+" كم":Math.round(st.distance)+" م",loc:[st.maneuver.location[1],st.maneuver.location[0]]})));
  return out;
}
function navGuide(){
  if(!NV.me||!NV.best) return;
  const me=[NV.me.lat,NV.me.lng];
  // distance to the route: re-route when clearly off it
  let dmin=1e9; for(let i=0;i<NV.best.coords.length;i+=2) dmin=Math.min(dmin,segLen(me,NV.best.coords[i]));
  if(dmin>80){ if(++NV.off>=3&&Date.now()-NV.lastCalc>15000){NV.off=0;toast("طلعت عن الطريق، نحسب طريق جديد");NV.best=null;navCalc();return} } else NV.off=0;
  const steps=navSteps(); let next=null,dn=1e9;
  for(const s of steps){const d=segLen(me,s.loc); if(d>25&&d<dn&&!s.done){dn=d;next=s}}
  const toDest=segLen(me,[NV.dest.lat,NV.dest.lng]);
  const bn=$("#nbanner");
  if(toDest<40){bn.innerHTML=`<b>🏁 وصلت إلى ${esc(NV.dest.name)}</b>`;return}
  if(next) bn.innerHTML=`<small>بعد ${dn>=1000?kmOf(dn)+" كم":Math.round(dn/10)*10+" م"}</small><b>${esc(next.txt)}</b>`;
}

   <td>${z.lat?`<a href="https://maps.google.com/?q=${z.lat},${z.lng}" target="_blank" rel="noopener">📍 محدد</a>`:`<span style="color:var(--warn)">غير محدد</span>`}</td>
   <td><div class="acts"><button class="btn sm" data-ze="${z.id}">تعديل</button><button class="btn sm danger" data-zd="${z.id}">حذف</button></div></td></tr>`).join("")}
  </tbody></table></div><div class="row" style="justify-content:flex-start;margin-top:12px"><button class="btn primary" id="zadd">+ إضافة منطقة</button><button class="btn" id="zgeo">📍 تحديد مواقع المناطق تلقائيًا</button></div><div id="zgeo-st" class="note" hidden></div>`;
  $("#zgeo").onclick=async()=>{const todo=zs.filter(z=>!z.lat);const st=$("#zgeo-st");st.hidden=false;

    loadZones(true).then(()=>{const keep=st.innerHTML;renderZones().then(()=>{const s2=$("#zgeo-st");if(s2){s2.hidden=false;s2.innerHTML=keep}})});

function zoneForm(z){

    <div class="field"><label for="z-r">سعر الازدحام (اختياري)</label><input id="z-r" inputmode="numeric" value="${z.rush_price||""}"></div></div>
    <div class="field"><label for="z-ll">الموقع على الخريطة (اختياري)</label><input id="z-ll" dir="ltr" value="${z.lat?z.lat+", "+z.lng:""}" placeholder="33.3152, 44.3661"><small style="color:var(--muted)">من خرائط Google: اضغط مطوّل على المكان وانسخ الأرقام.</small></div>
    <div class="err" id="ze"></div><div class="row"><button type="button" class="btn" id="zc">إلغاء</button><button class="btn primary">حفظ</button></div></form>`);

}

let tripsDay=null, tripsCache=[];
function todayStr(){const d=new Date(Date.now()+3*3600e3);return d.toISOString().slice(0,10)}
function hm(ts){return ts?new Date(ts).toLocaleTimeString("ar-IQ",{hour:"2-digit",minute:"2-digit"}):"—"}

async function loadTrips(quiet){
  const box=$("#tlist"); if(!box) return;
  if(document.querySelector(".modal")&&quiet) return;
  try{tripsCache=await rpc("taxi_admin_trips",{p_pin:PIN,p_day:tripsDay})}catch(e){box.innerHTML=`<div class="empty">${esc(e.message)}</div>`;return}
  tripsCache.sort((a,b)=>(b.status==="requested")-(a.status==="requested"));
  const done=tripsCache.filter(t=>t.status==="done"), open=tripsCache.filter(t=>["requested","assigned","accepted","started"].includes(t.status));
  $("#tsum").innerHTML=`<div class="kpi"><small>سفرات مكتملة</small><b>${done.length}</b></div><div class="kpi"><small>مجموع الأجرة</small><b>${dinar(done.reduce((a,t)=>a+(t.fare||0),0))}</b></div><div class="kpi"><small>مفتوحة هسه</small><b>${open.length}</b></div><div class="kpi"><small>مرفوضة</small><b>${tripsCache.filter(t=>t.status==="rejected").length}</b></div>`;
  if(!tripsCache.length){box.innerHTML=`<div class="empty card">ماكو سفرات بهذا اليوم. اضغط «حجز سفرة» لما يخابرك زبون، واختار السائق، فتوصله السفرة على تطبيقه.</div>`;return}
  box.innerHTML=`<div class="tbl-wrap"><table><thead><tr><th>الوقت</th><th>السائق</th><th>من ← إلى</th><th>الزبون</th><th>المصدر</th><th>الحالة</th><th>الأجرة</th><th>كم</th><th></th></tr></thead><tbody>
  ${tripsCache.map(t=>{const st=TS[t.status]||["s-idle",t.status];const openT=["requested","assigned","accepted","started"].includes(t.status)||(t.status==="rejected"&&t.source==="customer");return `<tr${t.status==="requested"?' class="row-new"':""}>
    <td style="font-variant-numeric:tabular-nums">${hm(t.created_at)}${t.ended_at?`<br><small style="color:var(--muted)">${hm(t.started_at)}–${hm(t.ended_at)}</small>`:""}</td>
    <td>${t.plate?plateHTML(t.plate):""} ${esc(t.driver_name||"—")}</td>
    <td>${esc(t.pickup||"—")} ← ${esc(t.dropoff||"—")}${t.note?`<br><small style="color:var(--muted)">${esc(t.note)}</small>`:""}</td>
    <td>${t.customer_name?esc(t.customer_name)+"<br>":""}<span dir="ltr">${esc(t.customer_phone||"—")}</span>${t.pickup_lat?`<br><a href="https://maps.google.com/?q=${t.pickup_lat},${t.pickup_lng}" target="_blank" rel="noopener">📍 موقعه</a>`:""}</td>
    <td>${t.source==="office"?"المكتب":t.source==="customer"?"الزبون (أونلاين)":"السائق"}</td>
    <td><span class="pill ${st[0]}">${st[1]}</span>${t.dispatched_by?`<br><small style="color:var(--muted)">أرسلها: ${esc(t.dispatched_by)}</small>`:""}${t.cancel_reason?`<br><small style="color:var(--muted)">${esc(t.cancel_reason)}</small>`:""}</td>
    <td style="font-variant-numeric:tabular-nums">${t.fare?fmt(t.fare):"—"}</td><td>${t.km!=null?t.km:"—"}</td>
    <td><div class="acts">${t.car_id&&["accepted","started","done"].includes(t.status)?`<button class="btn sm" data-tp="${t.id}">🗺 المسار</button>`:""}${t.status==="requested"?`<button class="btn sm primary" data-ta="re" data-id="${t.id}">إرسال لسائق</button>`:["assigned","rejected"].includes(t.status)?`<button class="btn sm" data-ta="re" data-id="${t.id}">تحويل لسائق</button>`:""}${openT?`<button class="btn sm danger" data-ta="cancel" data-id="${t.id}">إلغاء</button>`:""}</div></td></tr>`}).join("")}
  </tbody></table></div>`;
  box.querySelectorAll("[data-tp]").forEach(b=>b.onclick=()=>showTripPath(+b.dataset.tp));

    if(b.dataset.ta==="cancel") confirmBox("إلغاء هذي السفرة؟","إلغاء السفرة",async()=>{await rpc("taxi_admin_trip_action",{p_pin:PIN,p_id:id,p_action:"cancel"});toast("انلغت");loadTrips()});

function driverOptions(){
  const rank=c=>{const s=status(c);return c.trip?3:s.k==="ok"?0:s.k==="warn"?1:2};
  return [...cars].filter(c=>c.active).sort((a,b)=>rank(a)-rank(b)).map(c=>{const s=status(c);return `<option value="${c.id}" ${c.trip?"disabled":""}>${esc(c.driver_name)} · ${esc(c.plate)} — ${c.trip?"عنده سفرة":s.t}</option>`}).join("");
}
function kmBetween(a,b,c,d){const R=6371,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b);const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function pickDriver(title,fn,t){
  // free + connected drivers first, nearest to the customer first
  const ref=t&&t.pickup_lat?[t.pickup_lat,t.pickup_lng]:null;
  const list=[...cars].filter(c=>c.active).map(c=>{const s=status(c);const d=ref&&c.last_lat!=null?kmBetween(ref[0],ref[1],c.last_lat,c.last_lng):null;
    return {c,s,d,busy:!!c.trip&&(!t||c.id!==t.car_id),rank:(c.trip?3:s.k==="ok"?0:s.k==="warn"?1:2)}}).sort((a,b)=>a.rank-b.rank||(a.d??1e9)-(b.d??1e9));
  const first=list.find(x=>!x.busy&&x.rank<2);
  const m=modal(`<h3>${esc(title)}</h3>
    ${t?`<div class="reqcard"><b>${esc(t.customer_name||"زبون")}${t.points_used?` <span class="pill s-ok">⭐ مجانية بالنقاط</span>`:""}</b><span>من: ${esc(t.pickup||"—")}${t.pickup_lat?` <a href="https://maps.google.com/?q=${t.pickup_lat},${t.pickup_lng}" target="_blank" rel="noopener">📍</a>`:""}</span><span>إلى: <b>${esc(t.dropoff||"—")}</b>${t.fare?` · ${dinar(t.fare)}`:""}</span>${t.note?`<small style="color:var(--muted)">${esc(t.note)}</small>`:""}</div>`:""}
    <div class="dpick" role="radiogroup" aria-label="السائق">${list.length?list.map(x=>`<button type="button" role="radio" data-c="${x.c.id}" aria-pressed="${first&&first.c.id===x.c.id}" ${x.busy?"disabled":""}>
      ${plateHTML(x.c.plate)}<span class="dn"><b>${esc(x.c.driver_name)}</b><small>${x.busy?"عنده سفرة هسه":x.s.t}</small></span>
      <span class="dk">${x.d!=null?(x.d<1?Math.round(x.d*1000)+" م":x.d.toFixed(1)+" كم"):""}</span></button>`).join(""):`<div class="empty">ماكو سواق مفعّلين.</div>`}</div>
    <div class="err" id="pe"></div><div class="row"><button class="btn" id="pc">رجوع</button><button class="btn primary" id="po">إرسال للسائق</button></div>`);
  let sel=first?first.c.id:null;

}
function dispatchTrip(t){
  pickDriver(t.status==="requested"?"🔔 طلب زبون: اختار السائق":t.status==="rejected"?"رفضه السائق: أرسله لسائق ثاني":"تحويل السفرة لسائق ثاني",async car=>{await rpc("taxi_admin_trip_action",{p_pin:PIN,p_id:t.id,p_action:"reassign",p_car:car});toast("انرسل الطلب للسائق");if(tab==="trips")loadTrips()},t);

    <td class="num">${r.online_hours}</td><td class="num">${r.rejected?`<b style="color:var(--bad)">${r.rejected}</b>`:0}</td><td class="num">${r.cutoffs?`<b style="color:var(--bad)">${r.cutoffs}</b>`:0}</td>

let weekDay=null, weekData=null;
const dmy=d=>{const [y,m,dd]=String(d).split("-");return `${+dd}/${+m}`};
function shiftWeek(n){const d=new Date((weekDay||todayStr())+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+7*n);weekDay=d.toISOString().slice(0,10);loadWeek()}

async function loadWeek(){

  if(!rows.length){box.innerHTML=`<div class="empty card">ماكو سيارات.</div>`;return}
  box.innerHTML=`<div class="tbl-wrap"><table><thead><tr><th>السائق</th><th>سفرات</th><th>الأجرة اللي بيده</th><th>حصّته</th><th>يسلّم للشركة (صافي)</th><th>بدون سفرة</th><th>الحالة</th><th></th></tr></thead><tbody>
  ${rows.map(r=>{const pend=Number(r.trips)>0;const settled=r.settlement_ids.length>0;return `<tr>

      <div><span>مجموع الأجرة</span><b>${dinar(st.fares)}</b></div>
      ${st.points?`<div><span>منها مدفوعة بالنقاط</span><b>${dinar(st.points)}</b></div><div><span>الكاش اللي استلمه السائق</span><b>${dinar(cash)}</b></div>`:""}

    </div>
    ${st.note?`<p><b>ملاحظة:</b> ${esc(st.note)}</p>`:""}
    ${st.trip_list.length?`<table class="rc-trips"><thead><tr><th>الوقت</th><th>من ← إلى</th><th>الأجرة</th></tr></thead><tbody>${st.trip_list.map(t=>`<tr><td>${new Date(t.ended_at).toLocaleString("ar-IQ",{weekday:"short",hour:"2-digit",minute:"2-digit"})}</td><td>${esc(t.pickup||"—")} ← ${esc(t.dropoff||"—")}</td><td class="num">${fmt(t.fare)}${t.points_used?` <small>(⭐${fmt(t.points_used)})</small>`:""}</td></tr>`).join("")}</tbody></table>`:""}

async function carAction(a,id){

  if(a==="code") return confirmBox(`إصدار رمز جديد للسائق ${c.driver_name}؟ الرمز القديم سيتوقف فورًا.`,"إصدار رمز",async()=>{const k=await rpc("taxi_admin_newcode",{p_pin:PIN,p_id:id});toast("الرمز الجديد: "+k);poll()});

  document.addEventListener("visibilitychange",()=>{
    if(!ON) return;

  });
  window.addEventListener("pagehide",()=>{if(ON)beacon("closed")});
  if(navigator.permissions&&navigator.permissions.query){try{const p=await navigator.permissions.query({name:"geolocation"});p.onchange=()=>{if(!ON)return;if(p.state==="denied")gpsError({code:1});else startWatch()}}catch{}}
}

let extT;
function setExt(on){
  EXT=on;store.set("taxi_ext",on?"1":"0");

    let st=$("#extStatus"); if(!st){st=document.createElement("div");st.id="extStatus";st.className="stat";$(".drv").insertBefore(st,$("#tripBox"))}
    const upd=async()=>{try{const s=await rpc("taxi_driver_state",{p_code:CODE});const fresh=s.last_seen&&(Date.now()-new Date(s.last_seen))<180000&&["ok","background"].includes(s.gps_state);
      st.innerHTML=`<small>التتبع عن طريق Traccar</small><b style="color:${fresh?"var(--ok)":"var(--bad)"}">${fresh?"✔ موقعك يوصل للإدارة":"⚠ ما دا يوصل موقع"}</b><small>آخر إشارة: ${ago(s.last_seen)}</small>`;
      today={trips:s.today_trips,fares:s.today_fares,base:s.fare_base,share:s.week_share||0,zones:s.zones||[]};showTrip(s.trip,true)}catch{}};

}

/* ---------- Driver trips ---------- */
let curTrip, tripPoll, lastOffer=null, today={trips:0,fares:0,base:null};
async function refreshTrip(){
  if(!CODE) return;
  try{const st=await rpc("taxi_driver_state",{p_code:CODE});today={trips:st.today_trips,fares:st.today_fares,base:st.fare_base,share:st.week_share||0,zones:st.zones||[]};showTrip(st.trip,true)}catch{}
}
function showTrip(t,force){
  const box=$("#tripBox"); if(!box) return;
  const key=JSON.stringify(t&&[t.id,t.status]);
  if(!force&&key===JSON.stringify(curTrip&&[curTrip.id,curTrip.status])) return;
  curTrip=t;
  if(!ON&&!EXT){box.innerHTML="";return}
  const sum=`<div class="stats" style="margin-top:10px"><div class="stat"><small>سفرات اليوم</small><b>${today.trips} · ${fmt(today.fares)}</b></div><div class="stat"><small>حصتك هذا الأسبوع</small><b style="color:var(--ok)">${fmt(today.share)} د.ع</b></div></div><p class="note" style="margin:8px 0 0">حصتك تنحسب من السفرات المسجّلة بس.</p>`;
  if(!t){box.innerHTML=`<div class="trip"><h3>ماكو سفرة</h3><p>إذا ركب زبون، سجّل السفرة قبل لا تتحرك. الحركة بدون سفرة تنسجل وتوصل للإدارة.</p>
      <div class="field"><label for="tr-zone">إلى وين؟</label><select id="tr-zone" class="btn" style="width:100%">${(today.zones||[]).map(z=>`<option value="${z.id}">${esc(z.name)} — ${fmt(z.price)}</option>`).join("")}<option value="">منطقة أخرى</option></select></div>
      <div class="field" id="tr-to-f" hidden><label for="tr-to">اسم المكان</label><input id="tr-to"></div>
      <button class="btn primary big" id="tr-start">بدء سفرة</button></div>${sum}`;
    $("#tr-zone").onchange=e=>{$("#tr-to-f").hidden=!!e.target.value};$("#tr-to-f").hidden=!!$("#tr-zone").value;
    $("#tr-start").onclick=()=>tripAct("start",{zone_id:$("#tr-zone").value,dropoff:$("#tr-to").value});return}
  const where=`<p><b>من:</b> ${esc(t.pickup||"—")}${t.pickup_lat?` <a href="https://maps.google.com/?q=${t.pickup_lat},${t.pickup_lng}" target="_blank" rel="noopener">📍 الخريطة</a>`:""}<br><b>إلى:</b> ${esc(t.dropoff||"—")}${t.customer_name?`<br><b>الزبون:</b> ${esc(t.customer_name)}`:""}${t.note?`<br><b>ملاحظة:</b> ${esc(t.note)}`:""}${t.zone_id&&t.fare?`<br><b>الأجرة:</b> ${fmt(t.fare)} د.ع (ثابتة)`:""}${t.points_used?`<br><b style="color:var(--ok)">⭐ الزبون دافع ${fmt(t.points_used)} بالنقاط، استلم منه ${fmt(t.collect)} بس</b>`:""}</p>`;
  if(t.status==="assigned"){
    if(lastOffer!==t.id){lastOffer=t.id;try{navigator.vibrate&&navigator.vibrate([400,150,400])}catch{};siren(true);setTimeout(()=>siren(false),3000)}
    box.innerHTML=`<div class="trip offer"><h3>📣 سفرة جديدة من المكتب</h3>${where}<div class="row2"><button class="btn primary big" id="tr-acc">قبول</button><button class="btn big" id="tr-rej">رفض</button></div></div>`;
    $("#tr-acc").onclick=()=>{siren(false);tripAct("accept")};
    $("#tr-rej").onclick=()=>{siren(false);const m=modal(`<h3>رفض السفرة؟</h3><p style="margin:0">الرفض ينسجل عليك ويوصل للإدارة.</p><div class="field"><label for="rr">السبب</label><input id="rr" placeholder="مثال: بعيد، عندي عطل"></div><div class="row"><button class="btn" id="rn">رجوع</button><button class="btn primary" id="ry">رفض</button></div>`);$("#rn",m).onclick=()=>m.remove();$("#ry",m).onclick=()=>{m.remove();tripAct("reject",{reason:$("#rr",m).value})}};
    return}
  if(t.status==="accepted"){box.innerHTML=`<div class="trip"><h3>رايح للزبون</h3>${where}<button class="btn primary big" id="tr-go">وصلت، ابدأ السفرة</button></div>`;$("#tr-go").onclick=()=>tripAct("start");return}
  const navBtn=`<a class="btn big" href="#nav" style="text-align:center">🧭 الطريق على الخريطة</a>`;
  box.innerHTML=`<div class="trip on"><h3>بسفرة من ${hm(t.started_at)}</h3>${where}${navBtn}
    ${t.zone_id&&t.fare?`<div class="calc">${t.points_used?`<div><span>دفعها بالنقاط (حصتك محفوظة)</span><b>${dinar(t.points_used)}</b></div>`:""}<div class="tot"><span>استلم من الزبون</span><b>${t.collect===0&&t.points_used?"ولا شي، الكروة مجانية":dinar(t.collect??t.fare)}</b></div></div>`:`<div class="field"><label for="tr-fare">الأجرة المستلمة (دينار)</label><input id="tr-fare" inputmode="numeric" value="${today.base||""}" style="font:600 22px var(--mono);text-align:center"></div>`}
    <button class="btn primary big" id="tr-end">إنهاء السفرة</button></div>`;
  $("#tr-end").onclick=()=>tripAct("end",{fare:$("#tr-fare")?$("#tr-fare").value:""});
}
async function tripAct(a,p){
  try{await rpc("taxi_driver_trip",{p_code:CODE,p_action:a,p:p||{}});toast(a==="end"?"انسجلت السفرة":a==="reject"?"انرفضت":"تم");if(EXT)setExt(true);else await refreshTrip()}catch(e){toast(e.message)}
}
function goOn(){
  ON=true;store.set("taxi_on","1");
  const r=$("#ring");r.className="ring wait";$("#rs").textContent="إطفاء التتبع";$("#rsub").textContent="جارٍ تحديد الموقع…";
  keepAwake();startWatch();clearInterval(hb);hb=setInterval(heartbeat,15000);
  clearInterval(tripPoll);refreshTrip();tripPoll=setInterval(refreshTrip,8000);
}
function goOff(){
  ON=false;store.set("taxi_on","0");clearInterval(tripPoll);showTrip(null,true);
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}
  clearInterval(hb);siren(false);gpsBad=false;$("#block").hidden=true;
  try{wake&&wake.release()}catch{}wake=null;
  report("stopped");
  const r=$("#ring");r.className="ring off";$("#rs").textContent="تشغيل التتبع";$("#rsub").textContent="التتبع مطفأ";
}
function confirmStop(){
  const m=modal(`<h3>إطفاء التتبع؟</h3><p style="margin:0">راح يتوقف إرسال موقعك للإدارة.</p><div class="row"><button class="btn" id="cn">لا، استمر</button><button class="btn primary" id="cy">إطفاء التتبع</button></div>`);
  $("#cn",m).onclick=()=>m.remove();$("#cy",m).onclick=()=>{m.remove();goOff()};
}
function unlockAudio(){try{actx=actx||new AudioContext();actx.resume()}catch{}}
function siren(on){
  clearInterval(sirenT);
  if(on&&actx){const tone=()=>{try{const o=actx.createOscillator(),g=actx.createGain();o.type="square";o.frequency.setValueAtTime(950,actx.currentTime);o.frequency.setValueAtTime(650,actx.currentTime+.25);o.connect(g);g.connect(actx.destination);g.gain.value=.15;o.start();o.stop(actx.currentTime+.5)}catch{}};tone();sirenT=setInterval(tone,1500)}
  if(on&&navigator.vibrate) try{navigator.vibrate([500,200,500,200,500])}catch{}
}
async function keepAwake(){try{if("wakeLock" in navigator&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>wake=null)}}catch{}}
function startWatch(){
  if(!("geolocation" in navigator)) return gpsError({code:2});
  if(watchId!==null) navigator.geolocation.clearWatch(watchId);
  watchId=navigator.geolocation.watchPosition(onFix,gpsError,{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}
function onFix(pos){
  if(!ON) return;
  lastFix=pos;
  if(gpsBad){gpsBad=false;$("#block").hidden=true;siren(false)}
  const c=pos.coords, r=$("#ring");
  r.className="ring"; $("#rs").textContent="إطفاء التتبع"; $("#rsub").textContent="التتبع شغّال";
  $("#st-acc").textContent=Math.round(c.accuracy)+" م";
  $("#st-spd").textContent=c.speed!=null?Math.round(c.speed*3.6)+" كم/س":"0 كم/س";
  if(Date.now()-lastSent>4000) send(c);
}
async function send(c){
  try{const r=await rpc("taxi_ping_v2",{p_code:CODE,p_lat:c.latitude,p_lng:c.longitude,p_speed:c.speed,p_acc:c.accuracy,p_heading:c.heading,p_battery:battery});
    lastSent=Date.now();sentCount++;$("#st-n").textContent=sentCount;
    if(r) showTrip(r.trip);
  }catch(e){
    if(/رمز/.test(e.message)){store.del("taxi_driver_code");if(store.get("taxi_role")==="driver")store.del("taxi_role");CODE=null;location.reload()}
    $("#rsub").textContent="لا يوجد إنترنت، سيُعاد الإرسال تلقائيًا";
  }
}
function heartbeat(){
  if(gpsBad||!ON) return;
  navigator.geolocation.getCurrentPosition(p=>{lastFix=p;send(p.coords)},gpsError,{enableHighAccuracy:true,maximumAge:10000,timeout:15000});
}
function gpsError(err){
  if(err.code===3||!ON) return; // timeout only: keep waiting
  gpsBad=true;
  const denied=err.code===1;
  $("#ring").className="ring bad"; $("#rs").textContent="إطفاء التتبع"; $("#rsub").textContent=denied?"⚠ إذن الموقع مرفوض":"⚠ الـ GPS مطفأ";
  $("#bt").textContent=denied?"إذن الموقع مرفوض":"الـ GPS مطفأ";
  $("#bp").textContent=denied?"افتح إعدادات المتصفح ← أذونات الموقع ← اسمح لهذا الموقع. الإدارة تم إبلاغها.":"شغّل الموقع (GPS) من إعدادات الهاتف حالًا. الإدارة تم إبلاغها.";
  $("#block").hidden=false; siren(true);
  report(denied?"denied":"off");
}
function report(state){rpc("taxi_gps_state",{p_code:CODE,p_state:state}).catch(()=>{})}
function beacon(state){
  try{const body=new Blob([JSON.stringify({p_code:CODE,p_state:state})],{type:"application/json"});
    navigator.sendBeacon(`${SB_URL}/rest/v1/rpc/taxi_gps_state?apikey=${encodeURIComponent(SB_KEY)}`,body)}catch{}
}

route();
</script>
</body>
