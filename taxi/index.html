<head>
<meta charset="utf-8">

<meta property="og:title" content="المنصور تاكسي">
<meta property="og:description" content="تكاسي مجمّع المنصور، سواق مسجّلين وكل سيارة متتبَّعة مباشرة.">

<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Al-Mansour Taxi: the logo's deep teal towers + taxi-yellow road; landing page rides a dashed road line */
:root{
  --bg:#f2f5f4; --panel:#ffffff; --line:#d9e2e0; --fg:#0f2326; --muted:#5d6f71;
  --teal:#014e55; --teal-deep:#00383d; --on-teal:#eaf2f1;
  --amber:#febd02; --amber-ink:#2a1f00; --ok:#16935a; --warn:#d97706; --bad:#d6332b; --idle:#8a9294;
  --plate:#ffffff; --plate-band:#1f4fa3;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1d20; --panel:#12292d; --line:#21403f; --fg:#e8efee; --muted:#93a8a8;
  --teal:#01474e; --teal-deep:#003237; --on-teal:#eaf2f1;
  --amber:#febd02; --amber-ink:#2a1f00; --ok:#2fbf7a; --warn:#f0a030; --bad:#ff5a4f; --idle:#7f8c8e;
  --plate:#f4f4f0; --plate-band:#2a5cb8; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--body)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}
/* ---- customer pages: "bold" look — Mansour yellow top, cream ground, deep teal ink (one deliberate light look) ---- */
.cx{--bg:#fffbea;--panel:#ffffff;--line:#ece4c6;--fg:#00383d;--muted:#5e6650;--ok:#16935a;--bad:#c62d25;--body:Cairo,"IBM Plex Sans Arabic",system-ui,sans-serif;--display:Cairo,system-ui,sans-serif;
  color-scheme:light;background:#fffbea;color:#00383d;font-family:var(--body);min-height:100vh;min-height:100dvh}
.cx-top{background:#febd02;border-radius:0 0 36px 36px;padding:16px max(20px,env(safe-area-inset-right)) 74px max(20px,env(safe-area-inset-left))}
.cx-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.cx-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.cx-brand{display:flex;align-items:baseline;gap:6px;line-height:1;color:#00383d;text-decoration:none}
.cx-brand b{font:900 24px var(--body)}
.cx-brand i{font:900 17px var(--body);font-style:normal;letter-spacing:.06em;background:#00383d;color:#febd02;padding:3px 8px;border-radius:6px}
.cx-av{width:46px;height:46px;border-radius:50%;background:#00383d;color:#febd02;display:grid;place-items:center;font:900 18px var(--body);text-decoration:none;flex:none}
.cx-h1{margin:4px 0 0;font:900 clamp(34px,10vw,42px)/1.12 var(--body);color:#00383d}
.cx-sub{margin:0;font-weight:700;color:#3a4a2c;font-size:16px}
.cx-pick{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:#00383d;color:#fff;border:0;border-radius:999px;padding:8px 14px;font:700 14px var(--body);max-width:100%}
.cx-pick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cx-pick u{color:#febd02;text-decoration:none;font-weight:700}
.cx-main{max-width:560px;margin:-54px auto 0;padding:0 max(16px,env(safe-area-inset-right)) 130px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px;position:relative}
.cx .ocard{border-radius:26px;border:0;box-shadow:0 14px 30px rgb(0 56 61/.14);padding:18px}
.cx .btn{border-color:var(--line)}
.cx .btn.primary{background:#00383d;border-color:#00383d;color:#febd02;font-weight:900}
.cx h2.cx-h2{margin:0;font:900 20px var(--body)}
.cx-search{display:flex;align-items:center;gap:12px;background:#f3f1e6;border-radius:16px;padding:0 16px;height:56px}
.cx-search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font:600 17px var(--body);color:#00383d;padding:0}
.cx-search:focus-within{outline:2px solid #00383d}
.cx-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:360px;overflow:auto}
.cx-list button{width:100%;display:flex;align-items:center;gap:14px;padding:11px 8px;border:0;border-bottom:1px solid #f1ecd6;background:transparent;text-align:start;border-radius:14px;color:#00383d}
.cx-list li:last-child button{border-bottom:0}
.cx-list button:hover{background:#fffbea}
.cx-list button[aria-checked=true]{background:#00383d;color:#fff}
.cx-list button[aria-checked=true] small{color:#febd02}
.cx-ico{width:42px;height:42px;border-radius:12px;background:#fff1c2;color:#8a6500;display:grid;place-items:center;flex:none}
.cx-list button[aria-checked=true] .cx-ico{background:#febd02;color:#00383d}
.cx-list b{display:block;font:800 16px var(--body)}
.cx-list small{color:#6a6247;font-size:13px}
.cx-list .tick{margin-inline-start:auto;opacity:0}.cx-list button[aria-checked=true] .tick{opacity:1}
.cx-more{align-self:center;background:none;border:0;color:#00383d;font:700 14px var(--body);text-decoration:underline;padding:8px}
.cx-pts{background:#00383d;color:#fff;border-radius:22px;padding:14px 16px;display:flex;align-items:center;gap:14px;text-decoration:none}
.cx-ring{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;flex:none}
.cx-ring span{width:44px;height:44px;border-radius:50%;background:#00383d;display:grid;place-items:center;font:900 13px var(--body);color:#febd02}
.cx-pts b{display:block;font:900 18px var(--body)} .cx-pts small{color:#c8dcda;font-size:13px}
.cx-pts.ready{box-shadow:0 0 0 3px #febd02}
.cx-cta{position:fixed;left:0;right:0;bottom:0;padding:14px max(16px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:linear-gradient(to top,#fffbea 72%,rgb(255 251 234/0));z-index:5}
.cx-cta .btn{max-width:560px;margin:0 auto;display:flex;width:100%;height:62px;border-radius:20px;font-size:21px;align-items:center;justify-content:center;gap:10px}
.cx-note-t{background:none;border:0;color:#00383d;font:700 14px var(--body);padding:0;text-align:start;text-decoration:underline}
.cx .waitbox{border-color:#febd02}
.stars{display:flex;gap:4px;justify-content:center}
.stars button{font-size:38px;line-height:1;background:none;border:0;cursor:pointer;color:#d9d3bb;padding:2px 4px;min-width:44px;min-height:44px}
.stars button.on{color:#febd02;text-shadow:0 1px 0 #b88600}
.stars button:focus-visible{outline:2px solid #00383d;border-radius:8px}
.rate-mini{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;border:2px solid #febd02;border-radius:16px;padding:12px}
.rate-done{margin:0;text-align:center;font-weight:700}
.rate-lbl{margin:0;text-align:center;font-weight:700;min-height:1.4em}
.cx-inst{display:flex;align-items:center;gap:10px;background:#00383d;color:#fff;border-radius:18px;padding:10px 12px}
.cx-inst-ico img{border-radius:12px;display:block}
.cx-inst-t{flex:1;min-width:0;display:flex;flex-direction:column}
.cx-inst-t small{color:#c8dcda}
.cx-inst .btn.primary{background:#febd02;color:#00383d;border-color:#febd02}
.cx-inst-x{background:none;border:0;color:#c8dcda;font-size:18px;cursor:pointer;min-width:36px;min-height:36px}
.cx-confirm{border:2px solid #d97706;background:#fff4e0;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.cx-confirm small{color:#6a5320}
.cx-seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;background:#f3f1e6;border-radius:16px;padding:5px}
.cx-seg button{border:0;background:transparent;border-radius:12px;padding:11px 8px;font:800 15px var(--body);color:#00383d;min-height:44px}
.cx-seg button[aria-checked=true]{background:#00383d;color:#febd02}
.cx-sum{display:flex;align-items:center;gap:12px}.cx-sum b{flex:1;font:800 16px var(--body)}
.cx-mapwrap{position:relative;isolation:isolate;z-index:0;border-radius:16px;overflow:hidden}
.cx-mapmsg{position:absolute;inset:0;display:grid;place-items:center;color:#5e6650;font-weight:700}
.cx-psearch{position:relative}
.cx-dsthead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}.cx-dsthead small{color:#16935a;font-weight:700}
.cx-psug{position:absolute;top:60px;left:0;right:0;z-index:20;background:#fff;border-radius:16px;box-shadow:0 12px 28px rgb(0 56 61/.18);padding:6px;max-height:300px}
.cx-map .leaflet-control-zoom a{width:40px;height:40px;line-height:40px;font-size:20px}
.cx-locbtn{position:absolute;bottom:12px;left:12px;z-index:500;width:48px;height:48px;border-radius:50%;border:0;background:#00383d;color:#febd02;display:grid;place-items:center;box-shadow:0 6px 16px rgb(0 0 0/.25)}
.cx-locbtn.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cx-map{height:300px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#e9efed}
.cx-same{margin:0;background:#fff8e1;border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;font-weight:600}
a.btn{color:var(--fg);text-decoration:none;display:inline-block}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.cancel-btn{background:var(--bad);color:#fff;border-color:var(--bad);font-weight:700}
.cancel-btn:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.field input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%}
.err{color:var(--bad);font-size:14px;min-height:1.4em}

/* Plate */
.plate{display:inline-flex;align-items:stretch;border:2px solid #1b1d22;border-radius:6px;overflow:hidden;background:var(--plate);color:#111;font-family:var(--mono);font-weight:600;direction:ltr;line-height:1}
.plate b{background:var(--plate-band);color:#fff;font:600 10px/1 var(--body);padding:4px 5px;display:flex;align-items:center;writing-mode:vertical-rl}
.plate span{padding:5px 9px;font-size:15px;letter-spacing:.06em;display:flex;align-items:center}
.plate.lg span{font-size:28px;padding:10px 16px}
.plate.lg b{font-size:13px;padding:6px 8px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.s-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.s-bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.s-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.s-idle{color:var(--idle);background:color-mix(in srgb,var(--idle) 14%,transparent)}
.s-ok.blink::before{animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* Gate */
.gate{min-height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
.gate-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:44px;height:44px;display:grid;place-items:center}
.brand-mark img{width:100%;height:100%;object-fit:contain}
.logo-dark{display:none}
@media (prefers-color-scheme:dark){.logo-light{display:none}.logo-dark{display:inline}}
.brand small{display:block;color:var(--muted);font-size:13px}
.code-input{font:600 30px var(--mono)!important;text-align:center;letter-spacing:.35em;direction:ltr}
.switch{font-size:14px;color:var(--muted);text-align:center}
.switch a{color:var(--fg);font-weight:600}

/* Admin shell */
.shell{height:100vh;height:100dvh;display:grid;grid-template-rows:auto auto 1fr;grid-template-columns:minmax(0,1fr)}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));background:var(--panel);border-bottom:1px solid var(--line)}
.top .brand{margin-inline-end:auto}
.counts{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;padding:8px max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--fg);border-color:var(--amber)}
.view{min-height:0;overflow:auto}
.alert{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--bad) 14%,var(--panel));color:var(--bad);font-weight:600;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));border-bottom:1px solid color-mix(in srgb,var(--bad) 30%,var(--line))}

.live{display:grid;grid-template-columns:340px 1fr;height:100%}
.list{border-inline-end:1px solid var(--line);overflow:auto;background:var(--panel)}
.car{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;text-align:start;width:100%;background:none;border-inline:0;border-top:0}
.car:hover,.car.sel{background:color-mix(in srgb,var(--amber) 9%,transparent)}
.car .who{font-weight:600}
.car .meta{grid-column:1/-1;color:var(--muted);font-size:13px;display:flex;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
#map{height:100%;min-height:360px;background:var(--line)}
.empty{padding:28px 20px;color:var(--muted);text-align:center}

.wrap{padding:18px max(16px,env(safe-area-inset-right)) 28px max(16px,env(safe-area-inset-left));max-width:1100px;margin:0 auto}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar h2{margin-inline-end:auto;font-size:20px}
.tbl-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:11px 14px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
tr:last-child td{border-bottom:0}
td .acts{display:flex;gap:6px;flex-wrap:wrap}
.code{font:600 15px var(--mono);letter-spacing:.15em;direction:ltr;display:inline-block}
.log li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.log{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.log time{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.share{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.share code{font-family:var(--mono);direction:ltr;word-break:break-all;flex:1;min-width:0}

/* Modal */
.modal{position:fixed;inset:0;background:rgb(0 0 0/.45);display:grid;place-items:center;padding:16px;z-index:2000}
.sheet{background:var(--panel);border-radius:16px;width:min(520px,100%);max-height:90vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sheet .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:3000}

/* Driver */
.drv{min-height:100%;display:flex;flex-direction:column;gap:18px;padding:22px max(16px,env(safe-area-inset-right)) 22px max(16px,env(safe-area-inset-left));max-width:520px;margin:0 auto}
.ring{align-self:center;width:210px;height:210px;border-radius:50%;display:grid;place-items:center;text-align:center;border:10px solid var(--ok);position:relative}
.ring{background:var(--ok);color:#fff;cursor:pointer;box-shadow:0 8px 24px rgb(0 0 0/.18);font:inherit;-webkit-tap-highlight-color:transparent;transition:transform .12s}
.ring:active{transform:scale(.96)}
.ring{border-color:color-mix(in srgb,var(--ok) 70%,#000)}
.ring.off{background:var(--bad);border-color:color-mix(in srgb,var(--bad) 70%,#000)}
.ring strong{font-size:26px} .ring small{color:rgb(255 255 255/.9)!important}
.ring::after{content:"";position:absolute;inset:-22px;border-radius:50%;border:2px solid currentColor;color:var(--ok);opacity:.4;animation:ripple 2s infinite}
.ring.bad::after,.ring.wait::after,.ring.off::after{display:none}
@keyframes ripple{from{transform:scale(.85);opacity:.5}to{transform:scale(1.1);opacity:0}}
.ring strong{font:700 22px var(--display)}
.ring small{color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat small{color:var(--muted);font-size:12.5px;display:block}
.stat b{font:600 17px var(--mono);font-variant-numeric:tabular-nums}
.note{font-size:13.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.block{position:fixed;inset:0;background:var(--bad);color:#fff;z-index:5000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
.block h2{font-size:30px}
.block p{max-width:340px;font-size:17px}
.block .btn{background:#fff;color:var(--bad);border:0;font-size:18px;padding:14px 26px}

@media (max-width:820px){
  .live{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto}
  .list{border-inline-end:0;order:2}
  #map{order:1}
  .grid2{grid-template-columns:1fr}
}

.tbadge{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;line-height:20px;text-align:center}
.cps{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:10px}
.cp{border:1px solid var(--line);border-inline-start:4px solid var(--bad);border-radius:12px;padding:12px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.cp.closed{border-inline-start-color:var(--ok);opacity:.85}
.cp-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.cp-h time{margin-inline-start:auto;color:var(--muted);font-size:12px}
.cp p{margin:0;white-space:pre-wrap}
.st5{color:#e0a800;letter-spacing:1px}.st5 i{font-style:normal;color:var(--line)}
.hbars{display:flex;flex-direction:column;gap:4px}
.hb{display:grid;grid-template-columns:52px 1fr 32px;gap:8px;align-items:center;font-size:13px}
.hb i{display:block;height:12px;border-radius:6px;background:var(--amber);min-width:4px}

.cta.call{background:var(--amber);color:var(--amber-ink)}
.cta.wa{background:rgb(255 255 255/.1);color:var(--on-teal);border:1px solid rgb(255 255 255/.25)}
.cta small{display:block;font:500 13px var(--mono);direction:ltr;opacity:.8}
.hours{margin-top:14px;font-size:14px;color:rgb(234 242 241/.75)}
.no-contact{margin-top:22px;font-size:14px;color:rgb(234 242 241/.7);border:1px dashed rgb(255 255 255/.25);border-radius:12px;padding:10px 14px;display:inline-block}
.hero-art{justify-self:center;max-width:100%}
.hero-art img{width:min(340px,70vw);height:auto;filter:drop-shadow(0 24px 40px rgb(0 0 0/.35))}
.road{position:absolute;inset:auto 0 0 0;height:110px;pointer-events:none}
.road svg{width:100%;height:100%;display:block}
.road .cab{offset-path:path("M-40 70 C 300 20, 700 110, 1640 40");offset-rotate:auto;animation:drive 9s linear infinite}
@keyframes drive{from{offset-distance:0%}to{offset-distance:100%}}
@media (prefers-reduced-motion:reduce){.road .cab{animation:none;offset-distance:62%}.lp-live i{animation:none}}

.sec{padding-block:64px}
.sec h2{font-size:clamp(26px,3.6vw,38px);font-weight:700;color:var(--fg)}
.sec .kicker{font:600 13px var(--display);letter-spacing:.06em;color:var(--teal);margin-bottom:8px;display:block}
@media (prefers-color-scheme:dark){.sec .kicker{color:var(--amber)}}
.why{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:28px}
.why article{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:10px}
.why h3{font-size:19px}
.why p{margin:0;color:var(--muted);line-height:1.8}
.why .ico{width:46px;height:46px;border-radius:12px;background:color-mix(in srgb,var(--teal) 12%,transparent);color:var(--teal);display:grid;place-items:center}
@media (prefers-color-scheme:dark){.why .ico{background:color-mix(in srgb,var(--amber) 14%,transparent);color:var(--amber)}}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:30px;counter-reset:st;position:relative}
.steps li{list-style:none;padding:0 0 0 18px;position:relative;counter-increment:st}
.steps li::before{content:counter(st,arabic-indic);font:700 40px var(--display);color:var(--amber);display:block;line-height:1}
.steps li h3{font-size:18px;margin-top:10px}
.steps li p{color:var(--muted);margin:6px 0 0;line-height:1.8}
.steps{padding:0;border-top:3px dashed color-mix(in srgb,var(--amber) 70%,transparent);padding-top:24px}
.band{background:var(--panel);border-block:1px solid var(--line)}
.drv-band{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-block:34px}
.drv-band p{margin:6px 0 0;color:var(--muted);max-width:40em}
.lp-foot{margin-top:auto;background:var(--teal-deep);color:rgb(234 242 241/.8);font-size:14px}
.lp-foot .lp-in{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:22px}
.lp-foot img{height:40px}
.lp-foot nav{display:flex;gap:18px;flex-wrap:wrap}
.lp-foot a{color:var(--on-teal);text-decoration:none;font-weight:600}
.lp-foot a:hover{text-decoration:underline}
@media (max-width:820px){
  .hero-grid{grid-template-columns:1fr;padding-block:8px 110px;text-align:start}
  .hero-art{order:-1}
  .hero-art img{width:min(220px,55vw)}
  .why,.steps{grid-template-columns:1fr}
  .steps{gap:22px}
}
.leaflet-container{font-family:var(--body)}
.dot{width:16px;height:16px;border-radius:50%;background:var(--ok);border:3px solid #fff;box-shadow:0 0 0 1.5px rgb(0 0 0/.45),0 2px 5px rgb(0 0 0/.35);position:relative;box-sizing:border-box}
.dot::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--ok);opacity:0;animation:dotp 2s ease-out infinite}

.leaflet-tooltip.dotlbl::before{display:none}
@media (prefers-reduced-motion:reduce){.dot::after{animation:none}}

function pushSupport(){
  if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window)) return isIOS()&&!isStandalone()?"ios-install":"no";

async function pushSubscribe(ask){

  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();

// the driver's unpaid trips with full date/time; the office ticks the ones it received, the rest stay owed by the driver

  const day=ts=>new Date(ts).toLocaleDateString("ar-IQ",{weekday:"long",day:"numeric",month:"numeric",year:"numeric"});
  const tm=ts=>ts?new Date(ts).toLocaleTimeString("ar-IQ",{hour:"numeric",minute:"2-digit"}):"—";
  const dur=t=>t.started_at&&t.ended_at?Math.max(1,Math.round((new Date(t.ended_at)-new Date(t.started_at))/60000)):null;

      <span class="tp-amt">${dinar(t.cash)}</span></label></li>`).join("")}</ul>`
    :`<p class="note" style="margin:0">ماكو رحلات غير مسدّدة مسجّلة على هذا السائق.</p>`;

    upd();
    return ()=>boxes.filter(b=>b.checked).map(b=>+b.dataset.tp);
  };
  return {html,wire};
}

  if(tab==="fb") renderFeedback();
}
function initMap(){
  if(typeof L==="undefined"){$("#map").innerHTML=`<div class="empty">تعذّر تحميل الخريطة. تأكد من الإنترنت.</div>`;return}
  map=L.map("map",{zoomControl:true}).setView([33.315,44.366],12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
  setTimeout(()=>map&&map.invalidateSize(),100);
}
let fitted=false;
function renderLive(){
  const list=$("#list"); if(!list) return;
  if(!cars.length){list.innerHTML=`<div class="empty">لا توجد سيارات بعد.<br>اضغط «إضافة سيارة» لتسجيل أول تكسي وسائقه.</div>`;return}
  list.innerHTML=cars.map(c=>{const s=status(c);return `<button class="car${c.id===selId?" sel":""}" data-id="${c.id}">
    <div>${plateHTML(c.plate)} <span class="who">${esc(c.driver_name)}</span></div>
    <span class="pill s-${s.k}${s.k==="ok"?" blink":""}">${s.t}</span>
    ${c.trip?`<div class="meta" style="color:var(--fg)">🚕 ${esc(c.trip.pickup||"—")} ← ${esc(c.trip.dropoff||"—")}${c.trip.customer_phone?` · <span dir="ltr">${esc(c.trip.customer_phone)}</span>`:""}</div>`:""}
    <div class="meta"><span>${esc([c.model,c.year].filter(Boolean).join(" "))||"—"}</span><span>آخر إشارة: ${ago(c.last_seen)}</span>${c.last_speed!=null?`<span>${Math.round((c.last_speed||0)*3.6)} كم/س</span>`:""}${c.battery!=null?`<span>بطارية ${c.battery}%</span>`:""}</div></button>`}).join("");
  list.querySelectorAll(".car").forEach(b=>b.onclick=()=>selectCar(b.dataset.id));
  if(!map) return;
  const pts=[];
  cars.forEach(c=>{
    if(c.last_lat==null) return; const s=status(c);
    // a dot centred exactly on the car's position, so the street it's standing on stays visible
    const cls=s.k==="ok"?(c.trip?"dtrip":""):s.k==="bad"&&c.gps_state!=="ok"?"off":"stale";
    const icon=L.divIcon({html:`<div class="dot ${cls}${c.id===selId?" sel":""}"></div>`,className:"",iconSize:[16,16],iconAnchor:[8,8],popupAnchor:[0,-10]});
    const pos=[c.last_lat,c.last_lng]; pts.push(pos);
    const pop=`<b>${esc(c.driver_name)}</b><br>${esc(c.plate)} · ${esc(c.model)}<br>${s.t} · ${ago(c.last_seen)}${c.driver_phone?`<br><span dir="ltr">${esc(c.driver_phone)}</span>`:""}`;
    if(markers[c.id]){markers[c.id].setLatLng(pos).setIcon(icon).setPopupContent(pop).setTooltipContent(esc(c.plate))}
    else markers[c.id]=L.marker(pos,{icon}).addTo(map).bindPopup(pop).bindTooltip(esc(c.plate),{permanent:true,direction:"top",offset:[0,-9],className:"dotlbl"});
  });
  Object.keys(markers).forEach(id=>{if(!cars.find(c=>c.id===id&&c.last_lat!=null)){map.removeLayer(markers[id]);delete markers[id]}});
  if(!fitted&&pts.length){map.fitBounds(pts,{padding:[50,50],maxZoom:15});fitted=true}
}
async function selectCar(id){
  selId=id; renderLive(); const c=cars.find(x=>x.id===id); if(!c||!map) return;
  if(c.last_lat!=null){map.setView([c.last_lat,c.last_lng],16);markers[id]&&markers[id].openPopup()}
  try{const t=await rpc("taxi_admin_trail",{p_pin:PIN,p_id:id,p_hours:12});
    if(trailLine) map.removeLayer(trailLine);
    if(t.length>1) trailLine=L.polyline(t.map(p=>[p[0],p[1]]),{color:getComputedStyle(document.documentElement).getPropertyValue("--amber").trim()||"#f2a400",weight:4,opacity:.85}).addTo(map);
  }catch{}
}

async function loadZones(force){if(!zonesCache||force){try{zonesCache=await rpc("taxi_admin_zones",{p_pin:PIN})}catch{zonesCache=zonesCache||[]}}return zonesCache}
async function renderZones(){
  const box=$("#zbox"); if(!box) return;
  const zs=await loadZones(true);
  box.innerHTML=`<div class="tbl-wrap"><table style="min-width:520px"><thead><tr><th>المنطقة</th><th>السعر</th><th>سعر الازدحام</th><th>الازدحام</th><th>على الخريطة</th><th></th></tr></thead><tbody>
   ${zs.map(z=>`<tr><td><b>${esc(z.name)}</b></td><td class="num">${fmt(z.price)}</td><td class="num">${z.rush_price?fmt(z.rush_price):"—"}</td>
   <td>${z.rush_price?`<label class="chk"><input type="checkbox" data-rush="${z.id}" ${z.rush_on?"checked":""}> ${z.rush_on?"<b style='color:var(--warn)'>مفعّل</b>":"لا"}</label>`:""}</td>
   <td>${z.lat?`<a href="https://maps.google.com/?q=${z.lat},${z.lng}" target="_blank" rel="noopener">📍 محدد</a>`:`<span style="color:var(--warn)">غير محدد</span>`}</td>
   <td><div class="acts"><button class="btn sm" data-ze="${z.id}">تعديل</button><button class="btn sm danger" data-zd="${z.id}">حذف</button></div></td></tr>`).join("")}
  </tbody></table></div><div class="row" style="justify-content:flex-start;margin-top:12px"><button class="btn primary" id="zadd">+ إضافة منطقة</button><button class="btn" id="zgeo">📍 تحديد مواقع المناطق تلقائيًا</button></div><div id="zgeo-st" class="note" hidden></div>`;
  $("#zgeo").onclick=async()=>{const todo=zs.filter(z=>!z.lat);const st=$("#zgeo-st");st.hidden=false;
    if(!todo.length){st.textContent="كل المناطق محددة على الخريطة.";return}
    let ok=0,miss=[];
    for(const [i,z] of todo.entries()){st.textContent=`نحدد ${i+1} من ${todo.length}: ${z.name}…`;
      try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&accept-language=ar&limit=1&viewbox=44.0,33.65,44.75,32.95&bounded=1&q=${encodeURIComponent(cleanPlace(z.name)+"، بغداد")}`).then(r=>r.json());
        if(r.length){await rpc("taxi_admin_zone_geo",{p_pin:PIN,p_id:z.id,p_lat:+r[0].lat,p_lng:+r[0].lon});ok++}else miss.push(z.name)}catch{miss.push(z.name)}
      await new Promise(r=>setTimeout(r,1200))}
    st.innerHTML=`تحدد ${ok} منطقة.${miss.length?` ما لگينا: <b>${miss.map(esc).join("، ")}</b>. حددها يدويًا من «تعديل».`:""}`;
    loadZones(true).then(()=>{const keep=st.innerHTML;renderZones().then(()=>{const s2=$("#zgeo-st");if(s2){s2.hidden=false;s2.innerHTML=keep}})});
  };
  box.querySelectorAll("[data-rush]").forEach(c=>c.onchange=async()=>{try{await rpc("taxi_admin_zone_save",{p_pin:PIN,p:{action:"rush",id:+c.dataset.rush,on:c.checked}});toast(c.checked?"تفعّل سعر الازدحام":"رجع السعر العادي");renderZones()}catch(e){toast(e.message)}});
  box.querySelectorAll("[data-zd]").forEach(b=>b.onclick=()=>{const z=zs.find(x=>x.id==b.dataset.zd);confirmBox(`حذف منطقة ${z.name}؟`,"حذف",async()=>{await rpc("taxi_admin_zone_save",{p_pin:PIN,p:{action:"delete",id:z.id}});renderZones()})});
  box.querySelectorAll("[data-ze]").forEach(b=>b.onclick=()=>zoneForm(zs.find(x=>x.id==b.dataset.ze)));
  $("#zadd").onclick=()=>zoneForm();
}
function zoneForm(z){
  z=z||{};
  const m=modal(`<h3>${z.id?"تعديل المنطقة":"منطقة جديدة"}</h3><form id="zf" style="display:flex;flex-direction:column;gap:12px">

    <div class="field"><label for="z-r">سعر الازدحام (اختياري)</label><input id="z-r" inputmode="numeric" value="${z.rush_price||""}"></div></div>
    <div class="field"><label for="z-ll">الموقع على الخريطة (اختياري)</label><input id="z-ll" dir="ltr" value="${z.lat?z.lat+", "+z.lng:""}" placeholder="33.3152, 44.3661"><small style="color:var(--muted)">من خرائط Google: اضغط مطوّل على المكان وانسخ الأرقام.</small></div>
    <div class="err" id="ze"></div><div class="row"><button type="button" class="btn" id="zc">إلغاء</button><button class="btn primary">حفظ</button></div></form>`);
  $("#zc",m).onclick=()=>m.remove();
  $("#zf",m).onsubmit=async e=>{e.preventDefault();try{
    const ll=$("#z-ll",m).value.match(/(-?\d+(?:\.\d+)?)\s*[,،]\s*(-?\d+(?:\.\d+)?)/);
    await rpc("taxi_admin_zone_save",{p_pin:PIN,p:{id:z.id,name:$("#z-n",m).value,price:$("#z-p",m).value,rush_price:$("#z-r",m).value}});
    if(z.id&&ll) await rpc("taxi_admin_zone_geo",{p_pin:PIN,p_id:z.id,p_lat:+ll[1],p_lng:+ll[2]});
    m.remove();toast("انحفظت");renderZones()}catch(err){$("#ze",m).textContent=err.message}};
}

function todayStr(){const d=new Date(Date.now()+3*3600e3);return d.toISOString().slice(0,10)}
function hm(ts){return ts?new Date(ts).toLocaleTimeString("ar-IQ",{hour:"2-digit",minute:"2-digit"}):"—"}
// owner only: fix a fare or delete a trip; every change is logged

  const m=modal(`<h3>✏️ تعديل كروة السفرة</h3><div class="calc"><div><span>السائق</span><b>${esc(t.driver_name||"—")}</b></div><div><span>إلى</span><b>${esc(t.dropoff||"—")}</b></div><div><span>الوقت</span><b>${hm(t.created_at)}</b></div><div><span>الكروة هسه</span><b>${dinar(t.fare)}</b></div></div>
    <div class="field"><label for="fe-a">الكروة الصحيحة (دينار)</label><input id="fe-a" inputmode="numeric" value="${t.fare||""}" style="font:600 22px var(--mono);text-align:center"></div>
    <div class="field"><label for="fe-n">السبب (اختياري)</label><input id="fe-n" maxlength="200" placeholder="مثال: السائق كتب 5 بدال 5000"></div>

  $("#fe-ok",m).onclick=async()=>{const a=parseInt(($("#fe-a",m).value||"").replace(/\D/g,""),10);if(isNaN(a)){$("#fe-e",m).textContent="اكتب المبلغ";return}
    try{const r=await rpc("taxi_admin_trip_edit",{p_pin:PIN,p_id:t.id,p_fare:a,p_note:$("#fe-n",m).value});m.remove();toast("انعدلت الكروة: "+dinar(r.fare));loadTrips()}catch(e){$("#fe-e",m).textContent=e.message}};

function tripDelete(t){
  const m=modal(`<h3>🗑 حذف السفرة</h3><p style="margin:0">${esc(t.driver_name||"")} ← ${esc(t.dropoff||"—")} · ${hm(t.created_at)}${t.fare?` · <b>${dinar(t.fare)}</b>`:""}</p><p class="note" style="margin:0">تنحذف من الحسابات كلها. الحذف ينسجل بسجل التعديلات.</p>
    <div class="field"><label for="td-n">السبب</label><input id="td-n" maxlength="200" placeholder="مثال: سفرة تجربة"></div>
    <div class="err" id="td-e"></div><div class="row"><button class="btn" id="td-x">رجوع</button><button class="btn danger" id="td-ok">حذف</button></div>`);
  $("#td-x",m).onclick=()=>m.remove();
  $("#td-ok",m).onclick=async()=>{try{await rpc("taxi_admin_trip_delete",{p_pin:PIN,p_id:t.id,p_note:$("#td-n",m).value});m.remove();toast("انحذفت السفرة");loadTrips()}catch(e){$("#td-e",m).textContent=e.message}};
}
async function tripAudit(){
  const m=modal(`<h3>🧾 سجل تعديل الكراوي</h3><div id="au"><div class="empty">جارٍ التحميل…</div></div><div class="row"><button class="btn primary" id="au-x">تمام</button></div>`);
  m.classList.add("wide"); $("#au-x",m).onclick=()=>m.remove();
  try{const L=await rpc("taxi_admin_trip_audit",{p_pin:PIN});
    $("#au",m).innerHTML=L.length?`<ul class="log">${L.map(a=>`<li><span class="pill ${a.action==="delete"?"s-bad":"s-warn"}">${a.action==="delete"?"حذف":"تعديل"}</span><span>${esc(a.driver||"")} ← ${esc(a.dropoff||"—")}: ${a.action==="delete"?dinar(a.old_fare):`${fmt(a.old_fare)} ← <b>${fmt(a.new_fare)}</b>`}${a.note?`<br><small>${esc(a.note)}</small>`:""}</span><time>${new Date(a.at).toLocaleString("ar-IQ",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"})}</time></li>`).join("")}</ul>`:`<p class="note">ماكو تعديلات.</p>`}
  catch(e){$("#au",m).innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}
function renderTrips(){
  tripsDay=tripsDay||todayStr();
  $("#view").innerHTML=`<div class="wrap">
    <div class="bar"><h2>السفرات</h2><label class="sr" for="tday">اليوم</label><input id="tday" type="date" value="${tripsDay}" class="btn"><button class="btn" id="taud">🧾 سجل تعديل الكراوي</button><button class="btn primary" id="nt">+ حجز سفرة</button></div>
    <div id="tsum" class="kpis"></div>
    <div id="tlist"><div class="empty">جارٍ التحميل…</div></div></div>`;
  $("#tday").onchange=e=>{tripsDay=e.target.value;loadTrips()};
  $("#taud").onclick=tripAudit;
  $("#nt").onclick=()=>tripForm();
  loadTrips();
}
async function loadTrips(quiet){
  const box=$("#tlist"); if(!box) return;
  if(document.querySelector(".modal")&&quiet) return;
  try{tripsCache=await rpc("taxi_admin_trips",{p_pin:PIN,p_day:tripsDay})}catch(e){box.innerHTML=`<div class="empty">${esc(e.message)}</div>`;return}
  tripsCache.sort((a,b)=>(b.status==="requested")-(a.status==="requested"));
  const done=tripsCache.filter(t=>t.status==="done"), open=tripsCache.filter(t=>["requested","assigned","accepted","started"].includes(t.status));
  $("#tsum").innerHTML=`<div class="kpi"><small>سفرات مكتملة</small><b>${done.length}</b></div><div class="kpi"><small>مجموع الأجرة</small><b>${dinar(done.reduce((a,t)=>a+(t.fare||0),0))}</b></div><div class="kpi"><small>مفتوحة هسه</small><b>${open.length}</b></div><div class="kpi"><small>مرفوضة</small><b>${tripsCache.filter(t=>t.status==="rejected").length}</b></div>`;
  if(!tripsCache.length){box.innerHTML=`<div class="empty card">ماكو سفرات بهذا اليوم. اضغط «حجز سفرة» لما يخابرك زبون، واختار السائق، فتوصله السفرة على تطبيقه.</div>`;return}
  box.innerHTML=`<div class="tbl-wrap"><table><thead><tr><th>الوقت</th><th>السائق</th><th>من ← إلى</th><th>الزبون</th><th>المصدر</th><th>الحالة</th><th>الأجرة</th><th>كم</th><th></th></tr></thead><tbody>
  ${tripsCache.map(t=>{const st=TS[t.status]||["s-idle",t.status];const openT=["requested","assigned","accepted","started"].includes(t.status)||(t.status==="rejected"&&t.source==="customer");return `<tr${t.status==="requested"?' class="row-new"':""}>
    <td style="font-variant-numeric:tabular-nums">${hm(t.created_at)}${t.ended_at?`<br><small style="color:var(--muted)">${hm(t.started_at)}–${hm(t.ended_at)}</small>`:""}</td>
    <td>${t.plate?plateHTML(t.plate):""} ${esc(t.driver_name||"—")}</td>
    <td>${esc(t.pickup||"—")} ← ${esc(t.dropoff||"—")}${t.note?`<br><small style="color:var(--muted)">${esc(t.note)}</small>`:""}</td>
    <td>${t.customer_name?esc(t.customer_name)+"<br>":""}<span dir="ltr">${esc(t.customer_phone||"—")}</span>${t.pickup_lat?`<br><a href="https://maps.google.com/?q=${t.pickup_lat},${t.pickup_lng}" target="_blank" rel="noopener">📍 موقعه</a>`:""}</td>
    <td>${t.source==="office"?"المكتب":t.source==="customer"?"الزبون (أونلاين)":"السائق"}</td>
    <td><span class="pill ${st[0]}">${st[1]}</span>${t.round_trip?` <span class="pill s-warn">↩ مرجع${t.round_fee?" +"+fmt(t.round_fee):""}</span>`:""}${t.pickup_wait_sec>0?` <span class="pill ${t.pickup_waiting?"s-warn":"s-idle"}">🕓 ${t.pickup_waiting?"وصل وينتظر ":"انتظر بالاستلام "}${Math.ceil(t.pickup_wait_sec/60)} د</span>`:""}${t.wait_sec>0?` <span class="pill ${t.waiting?"s-warn":"s-idle"}">⏱ عدّاد ${t.waiting?"شغّال ":""}${Math.ceil(t.wait_sec/60)} د${t.wait_fee?" +"+fmt(t.wait_fee):""}</span>`:""}${t.stars?` <span class="pill ${t.stars<=2?"s-bad":"s-ok"}">${"★".repeat(t.stars)}</span>`:""}${t.trip_kind==="line"?` <span class="pill s-ok">🛣 خط</span>`:""}${t.hurry_answer?` <span class="pill ${t.hurry_answer==="wait"?"s-ok":"s-idle"}">⏳ ${t.hurry_answer==="wait"?"ينتظر":"مستعجل، ألغى"}</span>`:t.hurry_asked_at&&["requested","rejected","assigned"].includes(t.status)?` <span class="pill s-warn">⏳ سألناه</span>`:""}${t.scheduled_at?`<br><span class="pill s-idle">🗓 ${whenTxt(t.scheduled_at)}</span>`:""}${t.noshow_status?`<br><span class="pill ${t.noshow_status==="approved"?"s-idle":t.noshow_status==="pending"?"s-warn":"s-bad"}">✖ تسكير${t.noshow_status==="approved"?": الزبون ما نزل":t.noshow_status==="pending"?": ينتظر موافقة":": انرفض"}</span> <small style="color:var(--muted)">${esc(t.noshow_note||"")}${t.noshow_reason?` · ${esc(t.noshow_reason)}`:""}</small>`:""}${t.special_status?`<br><span class="pill ${t.special_status==="approved"?"s-ok":t.special_status==="pending"?"s-warn":"s-idle"}">⭐ زبون خاص${t.special_status==="approved"?" بدون كروة":t.special_status==="pending"?": ينتظر موافقة":": انرفض"}</span> <small style="color:var(--muted)">${esc(t.special_note||"")}${t.special_by?` · ${esc(t.special_by)}`:""}</small>`:""}${t.dispatched_by?`<br><small style="color:var(--muted)">أرسلها: ${esc(t.dispatched_by)}</small>`:""}${t.cancel_reason?`<br><small style="color:var(--muted)">${esc(t.cancel_reason)}</small>`:""}</td>
    <td style="font-variant-numeric:tabular-nums">${t.fare?fmt(t.fare):"—"}</td><td>${t.km!=null?t.km:"—"}</td>
    <td><div class="acts">${OWNER()&&t.status==="done"?`<button class="btn sm" data-te="${t.id}">✏️ الكروة</button>`:""}${OWNER()&&["done","cancelled","rejected","requested","scheduled"].includes(t.status)?`<button class="btn sm danger" data-tdel="${t.id}">🗑</button>`:""}${t.car_id&&["accepted","started","done"].includes(t.status)?`<button class="btn sm" data-tp="${t.id}">🗺 المسار</button>`:""}${t.status==="requested"?`<button class="btn sm primary" data-ta="re" data-id="${t.id}">إرسال لسائق</button>`:["assigned","rejected"].includes(t.status)?`<button class="btn sm" data-ta="re" data-id="${t.id}">تحويل لسائق</button>`:""}${openT?`<button class="btn sm danger" data-ta="cancel" data-id="${t.id}">إلغاء</button>`:""}</div></td></tr>`}).join("")}
  </tbody></table></div>`;
  box.querySelectorAll("[data-tp]").forEach(b=>b.onclick=()=>showTripPath(+b.dataset.tp));
  box.querySelectorAll("[data-te]").forEach(b=>b.onclick=()=>tripFareEdit(tripsCache.find(x=>x.id===+b.dataset.te)));
  box.querySelectorAll("[data-tdel]").forEach(b=>b.onclick=()=>tripDelete(tripsCache.find(x=>x.id===+b.dataset.tdel)));
  box.querySelectorAll("[data-ta]").forEach(b=>b.onclick=()=>{
    const id=+b.dataset.id;
    if(b.dataset.ta==="cancel") confirmBox("إلغاء هذي السفرة؟","إلغاء السفرة",async()=>{await rpc("taxi_admin_trip_action",{p_pin:PIN,p_id:id,p_action:"cancel"});toast("انلغت");loadTrips()});
    else dispatchTrip(tripsCache.find(x=>x.id===id));
  });
}
function driverOptions(){
  const rank=c=>{const s=status(c);return c.trip?3:s.k==="ok"?0:s.k==="warn"?1:2};
  return [...cars].filter(c=>c.active).sort((a,b)=>rank(a)-rank(b)).map(c=>{const s=status(c);return `<option value="${c.id}" ${c.trip?"disabled":""}>${esc(c.driver_name)} · ${esc(c.plate)} — ${c.trip?"عنده سفرة":s.t}</option>`}).join("");
}
function kmBetween(a,b,c,d){const R=6371,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b);const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function pickDriver(title,fn,t){
  // free + connected drivers first, nearest to the customer first
  const ref=t&&t.pickup_lat?[t.pickup_lat,t.pickup_lng]:null;
  const list=[...cars].filter(c=>c.active).map(c=>{const s=status(c);const d=ref&&c.last_lat!=null?kmBetween(ref[0],ref[1],c.last_lat,c.last_lng):null;
    return {c,s,d,busy:!!c.trip&&(!t||c.id!==t.car_id),rank:(c.trip?3:s.k==="ok"?0:s.k==="warn"?1:2)}}).sort((a,b)=>a.rank-b.rank||(a.d??1e9)-(b.d??1e9));
  const first=list.find(x=>!x.busy&&x.rank<2);
  const m=modal(`<h3>${esc(title)}</h3>
    ${t?`<div class="reqcard"><b>${esc(t.customer_name||"زبون")}${t.points_used?` <span class="pill s-ok">⭐ مجانية بالنقاط</span>`:""}</b><span>من: ${esc(t.pickup||"—")}${t.pickup_lat?` <a href="https://maps.google.com/?q=${t.pickup_lat},${t.pickup_lng}" target="_blank" rel="noopener">📍</a>`:""}</span><span>إلى: <b>${esc(t.dropoff||"—")}</b>${t.dropoff_note?` (${esc(t.dropoff_note)})`:""}${t.fare?` · ${dinar(t.fare)}`:""}</span>${t.note?`<small style="color:var(--muted)">${esc(t.note)}</small>`:""}</div>`:""}
    <div class="dpick" role="radiogroup" aria-label="السائق">${list.length?list.map(x=>`<button type="button" role="radio" data-c="${x.c.id}" aria-pressed="${first&&first.c.id===x.c.id}" ${x.busy?"disabled":""}>
      ${plateHTML(x.c.plate)}<span class="dn"><b>${esc(x.c.driver_name)}</b><small>${x.busy?"عنده سفرة هسه":x.s.t}</small></span>
      <span class="dk">${x.d!=null?(x.d<1?Math.round(x.d*1000)+" م":x.d.toFixed(1)+" كم"):""}</span></button>`).join(""):`<div class="empty">ماكو سواق مفعّلين.</div>`}</div>
    <div class="err" id="pe"></div><div class="row"><button class="btn" id="pc">رجوع</button><button class="btn primary" id="po">إرسال للسائق</button></div>`);
  let sel=first?first.c.id:null;
  m.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{sel=b.dataset.c;m.querySelectorAll("[data-c]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  $("#pc",m).onclick=()=>m.remove();
  $("#po",m).onclick=async()=>{if(!sel){$("#pe",m).textContent="اختار السائق";return}const btn=$("#po",m);btn.disabled=true;try{await fn(sel);m.remove()}catch(e){$("#pe",m).textContent=e.message;btn.disabled=false}};
}
function dispatchTrip(t){
  pickDriver(t.status==="requested"?"🔔 طلب زبون: اختار السائق":t.status==="rejected"?"رفضه السائق: أرسله لسائق ثاني":"تحويل السفرة لسائق ثاني",async car=>{await rpc("taxi_admin_trip_action",{p_pin:PIN,p_id:t.id,p_action:"reassign",p_car:car});toast("انرسل الطلب للسائق");if(tab==="trips")loadTrips()},t);
}

  const m=modal(`<h3>حجز سفرة جديدة</h3>
   <form id="tf" style="display:flex;flex-direction:column;gap:12px">
    <div class="grid2">
      <div class="field"><label for="t-ph">رقم الزبون</label><input id="t-ph" inputmode="tel" dir="ltr" placeholder="07xx xxx xxxx"></div>
      <div class="field"><label for="t-drv">السائق</label><select id="t-drv" class="btn" style="width:100%">${driverOptions()}</select></div>
      <div class="field"><label for="t-from">من (مكان الزبون)</label><input id="t-from" required placeholder="مثال: عمارة T5، البوابة 2"></div>
      <div class="field"><label for="t-zone">إلى (المنطقة)</label><select id="t-zone" class="btn" style="width:100%"><option value="">جارٍ التحميل…</option></select></div>
      <div class="field" id="t-to-f" hidden><label for="t-to">اسم المكان</label><input id="t-to" placeholder="مثال: الكاظمية"></div>
    </div>

    <div class="field"><label for="t-note">ملاحظة</label><input id="t-note" placeholder="اختياري"></div>
    <div class="calc"><div class="tot"><span>الأجرة الثابتة</span><b id="t-price">—</b></div></div>
    <p class="note" style="margin:0">السفرة توصل للسائق على تطبيقه، ولازم يقبلها. إذا رفضها تنسجل عليه وتگدر تحوّلها لسائق ثاني.</p>
    <div class="err" id="tfe"></div>
    <div class="row"><button type="button" class="btn" id="tfc">إلغاء</button><button class="btn primary">إرسال للسائق</button></div>
   </form>`);
  $("#tfc",m).onclick=()=>m.remove();
  loadZones().then(zs=>{const sel=$("#t-zone",m);sel.innerHTML=zs.map(z=>`<option value="${z.id}">${esc(z.name)} — ${fmt(z.current)}${z.rush_on?" (ازدحام)":""}</option>`).join("")+`<option value="">منطقة أخرى (الأجرة يكتبها السائق)</option>`;
    const upd=()=>{const z=zs.find(x=>String(x.id)===sel.value);$("#t-price",m).textContent=z?dinar(z.current):"يكتبها السائق";$("#t-to-f",m).hidden=!!z};sel.onchange=upd;upd()});
  $("#tf",m).onsubmit=async e=>{e.preventDefault();
    try{await rpc("taxi_admin_trip_create",{p_pin:PIN,p:{car_id:$("#t-drv",m).value,customer_phone:$("#t-ph",m).value,customer_name:$("#t-name",m).value,pickup:$("#t-from",m).value,zone_id:$("#t-zone",m).value,dropoff:$("#t-to",m).value,note:$("#t-note",m).value}});
      const c=cars.find(x=>x.id===$("#t-drv",m).value);m.remove();toast("انرسلت السفرة لـ "+(c?c.driver_name:"السائق"));poll();if(tab==="trips")loadTrips();
    }catch(err){$("#tfe",m).textContent=err.message}};

/* ---------- Accounts: who drove how much, and what came in ---------- */
let accMonth=null, accRows=[];
function renderAccounts(){
  accMonth=accMonth||todayStr().slice(0,7);
  $("#view").innerHTML=`<div class="wrap">
    <div class="bar"><h2>الحسابات الشهرية</h2><label class="sr" for="mon">الشهر</label><input id="mon" type="month" value="${accMonth}" class="btn"></div>
    <div id="akpi" class="kpis"></div>
    <p class="note">«تحرّك بدون سفرة» يعني الـ GPS سجّل السيارة تمشي مسافة أكثر من 300 متر بدون ما يكون عند السائق سفرة مفتوحة. هاي أول علامة إنه دا يشتغل لحسابه.</p>
    <div id="alist"><div class="empty">جارٍ الحساب…</div></div></div>`;
  $("#mon").onchange=e=>{accMonth=e.target.value;loadAccounts()};
  loadAccounts();
}
async function loadAccounts(){
  const box=$("#alist"); if(!box) return;
  try{accRows=await rpc("taxi_admin_statement",{p_pin:PIN,p_month:accMonth+"-01"})}catch(e){box.innerHTML=`<div class="empty">${esc(e.message)}</div>`;return}
  const base=accRows[0]?.fare_base, perkm=accRows[0]?.fare_per_km;
  const est=r=>base?(r.unlogged*base+(perkm?Math.round(r.unlogged_km*perkm):0)):null;
  const sum=k=>accRows.reduce((a,r)=>a+Number(r[k]||0),0);
  const lost=base?accRows.reduce((a,r)=>a+est(r),0):null;
  $("#akpi").innerHTML=`<div class="kpi"><small>الأجرة المسجّلة</small><b>${dinar(sum("fares"))}</b></div>
    <div class="kpi"><small>المستلَم من السواق</small><b>${dinar(sum("paid"))}</b></div>
    <div class="kpi"><small>باقي بذمّة السواق</small><b>${dinar(sum("fares")-sum("paid"))}</b></div>
    <div class="kpi ${sum("unlogged")?"kpi-bad":""}"><small>تحرّكات بدون سفرة</small><b>${fmt(sum("unlogged"))} <span style="font-size:14px">(${sum("unlogged_km").toFixed(1)} كم)</span></b>${lost!=null?`<small>تقدير الضايع ≈ ${dinar(lost)}</small>`:`<small><a href="#" id="setf">حدّد الأجرة</a> حتى نقدّر الضايع</small>`}</div>`;
  const sf=$("#setf"); if(sf) sf.onclick=e=>{e.preventDefault();tab="set";renderTab()};
  if(!accRows.length){box.innerHTML=`<div class="empty card">ماكو سيارات.</div>`;return}
  box.innerHTML=`<div class="tbl-wrap"><table><thead><tr><th>السائق</th><th>سفرات</th><th>الأجرة</th><th>المستلَم</th><th>الباقي</th><th>كم بالـ GPS</th><th>بدون سفرة</th><th>ساعات التتبع</th><th>رفض</th><th>انقطاعات</th><th></th></tr></thead><tbody>
  ${accRows.map(r=>`<tr>
    <td>${plateHTML(r.plate)} <b>${esc(r.driver_name)}</b></td>
    <td class="num">${fmt(r.trips)}</td><td class="num">${fmt(r.fares)}</td><td class="num">${fmt(r.paid)}</td>
    <td class="num"><b style="color:${r.fares-r.paid>0?"var(--bad)":"var(--ok)"}">${fmt(r.fares-r.paid)}</b></td>

async function showRange(carId,from,to){

function wtDraw(T){const w=$("#f-wt");if(!w)return;
  w.innerHTML=T.map((x,i)=>`<div class="wt-row"><label>بعد <input inputmode="numeric" class="wt-m" value="${x.m}" aria-label="الدقائق ${i+1}"> دقيقة</label><label>= <input inputmode="numeric" class="wt-f" value="${x.f}" aria-label="المبلغ ${i+1}"> دينار</label>${T.length>2?`<button type="button" class="btn sm wt-del" data-i="${i}" aria-label="احذف السطر">✕</button>`:""}</div>`).join("")+`<button type="button" class="btn sm" id="wt-add">+ سطر</button>`;
  w.querySelectorAll(".wt-del").forEach(b=>b.onclick=()=>{const t=wtRows();t.splice(+b.dataset.i,1);wtDraw(t)});
  $("#wt-add").onclick=()=>{const t=wtRows(),l=t[t.length-1]||{m:0,f:0};t.push({m:l.m+15,f:l.f});wtDraw(t)};
  w.querySelectorAll("input").forEach(i=>i.oninput=wtEx); wtEx()}
function wtRows(){return [...document.querySelectorAll("#f-wt .wt-row")].map(r=>({m:parseInt(r.querySelector(".wt-m").value.replace(/\D/g,""))||0,f:parseInt(r.querySelector(".wt-f").value.replace(/\D/g,""))||0})).filter(x=>x.m>0)}
function wtRead(){return wtRows().map(x=>x.m+":"+x.f).join(",")}
function wtEx(){const e=$("#f-wt-ex");if(!e)return;const T=wtRows();if(!T.length){e.textContent="";return}
  e.textContent="أمثلة: "+[5,10,20,45,60,75,130].map(m=>`${m} د = ${fmt(waitFee(m*60,T))}`).join(" · ")}
function modal(html){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="sheet">${html}</div>`;m.onclick=e=>{if(e.target===m)m.remove()};document.body.append(m);return m}

async function renderRoutes(){
  const v=$("#view");

  if(typeof L!=="undefined"){RT.map=L.map("rmap").setView([33.315,44.366],12);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(RT.map);setTimeout(()=>RT.map&&RT.map.invalidateSize(),100)}
  let d; try{d=await rpc("taxi_admin_routes",{p_pin:PIN})}catch(e){$("#rlist").innerHTML=`<div class="err">${esc(e.message)}</div>`;return}
  RT.data=d;
  const mins=x=>x==null?"—":x<1?Math.round(x*60)+" ث":x+" د";
  $("#rlist").innerHTML=`<div class="bar" style="margin:0"><h2 style="margin:0">الطرق</h2><button class="btn sm" id="rexp">⬇ تنزيل البيانات</button></div>
    <p class="note" style="margin:0">كل سفرة تنتهي ينحفظ طريقها الحقيقي من GPS السائق للأبد: <b>${fmt(d.total)}</b> طريق · <b>${d.total_km}</b> كم. اختار منطقة تشوف كل الطرق اللي انمشت إلها، والأسرع بالأخضر.</p>
    ${d.zones.length?d.zones.map(z=>`<button class="rz" data-z="${z.zone_id??""}" aria-pressed="false"><b>${esc(z.name)}</b><small>${z.trips} سفرة · الأسرع ${mins(z.best_min)} · المعدل ${mins(z.avg_min)}${z.avg_km?` · ${z.avg_km} كم`:""}</small></button>`).join("")
      :`<div class="empty">ماكو طرق محفوظة بعد. أول ما تنتهي سفرة، طريقها ينحفظ هنا.</div>`}
    <div id="rtrips"></div>`;
  $("#rexp").onclick=exportRoutes;
  $("#rlist").querySelectorAll(".rz").forEach(b=>b.onclick=()=>{$("#rlist").querySelectorAll(".rz").forEach(x=>x.setAttribute("aria-pressed",x===b));showZoneRoutes(b.dataset.z===""?null:+b.dataset.z,b)});
}
async function showZoneRoutes(zone,btn){
  let rs; try{rs=await rpc("taxi_admin_zone_routes",{p_pin:PIN,p_zone:zone})}catch(e){toast(e.message);return}
  if(RT.map){RT.layers.forEach(l=>RT.map.removeLayer(l));RT.layers=[]}
  const best=rs.find(r=>!r.short);
  const box=document.createElement("div");box.className="rt-trips";
  const t2=s=>{const m=Math.floor(s/60),x=s%60;return m?`${m} د${x?` ${x} ث`:""}`:`${x} ث`};
  const dt=ts=>new Date(ts).toLocaleString("ar-IQ",{weekday:"short",day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"});
  box.innerHTML=rs.map(r=>`<button data-tr="${r.trip_id}" class="${best&&r.trip_id===best.trip_id?"best":""}" aria-pressed="false"><span>${best&&r.trip_id===best.trip_id?"🏆 ":""}<b>${t2(r.drive_sec)}</b> · ${r.km} كم${r.avg_kmh?` · ${r.avg_kmh} كم/س`:""}${r.short?` <small>(قصيرة)</small>`:""}<br><small>${esc(r.driver_name||"")} · ${dt(r.started_at)}</small></span></button>`).join("");
  document.querySelectorAll("#rlist .rt-trips").forEach(x=>x.remove());
  btn.after(box);
  const lines={};
  if(RT.map&&typeof L!=="undefined"){
    rs.slice().reverse().forEach(r=>{if(!r.path||r.path.length<2)return;const isB=best&&r.trip_id===best.trip_id;
      const l=L.polyline(r.path,{color:isB?"#1a9e5a":"#5b7c80",weight:isB?7:3,opacity:isB?.95:.5}).addTo(RT.map).bindTooltip(`${t2(r.drive_sec)} · ${esc(r.driver_name||"")}`);
      RT.layers.push(l);lines[r.trip_id]=l;
      if(isB&&r.path.length){const s=L.circleMarker(r.path[0],{radius:7,color:"#fff",weight:2,fillColor:"#1a9e5a",fillOpacity:1}).addTo(RT.map).bindTooltip("البداية");const e=L.circleMarker(r.path[r.path.length-1],{radius:7,color:"#fff",weight:2,fillColor:"#d6332b",fillOpacity:1}).addTo(RT.map).bindTooltip("الوصول");RT.layers.push(s,e)}});
    if(best&&lines[best.trip_id]) lines[best.trip_id].bringToFront();
    const all=RT.layers.filter(l=>l.getBounds);if(all.length){const g=L.featureGroup(all);RT.map.fitBounds(g.getBounds(),{padding:[30,30]})}
  }
  box.querySelectorAll("[data-tr]").forEach(b=>b.onclick=()=>{box.querySelectorAll("[data-tr]").forEach(x=>x.setAttribute("aria-pressed",x===b));
    const l=lines[b.dataset.tr];if(!l||!RT.map)return;Object.values(lines).forEach(x=>x.setStyle({opacity:.25}));l.setStyle({opacity:1}).bringToFront();RT.map.fitBounds(l.getBounds(),{padding:[30,30]})});
}
async function exportRoutes(){
  let rs; try{rs=await rpc("taxi_admin_routes_export",{p_pin:PIN})}catch(e){toast(e.message);return}
  // GeoJSON: opens in Google Earth, QGIS, geojson.io, Kepler…; coordinates are [lng, lat]
  const gj={type:"FeatureCollection",features:rs.filter(r=>r.points&&r.points.length>1).map(r=>({type:"Feature",
    properties:{trip_id:r.trip_id,zone:r.zone,driver:r.driver,plate:r.plate,started_at:r.started_at,ended_at:r.ended_at,drive_sec:r.drive_sec,km:Number(r.km),avg_kmh:r.avg_kmh==null?null:Number(r.avg_kmh),times_sec:r.points.map(p=>p[2])},
    geometry:{type:"LineString",coordinates:r.points.map(p=>[p[1],p[0]])}}))};
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(gj)],{type:"application/geo+json"}));
  a.download=`mansour-taxi-routes-${new Date().toISOString().slice(0,10)}.geojson`;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  toast(`نزل ${gj.features.length} طريق`);
}

  $("#ln-ok",m).onclick=async()=>{const q=$("#ln-q",m).value.trim();if(!sel&&q.length<2){$("#ln-e",m).textContent="اكتب اسم المنطقة";return}
    const b=$("#ln-ok",m);b.disabled=true;
    try{await rpc("taxi_driver_trip",{p_code:CODE,p_action:"line",p:{zone_id:sel||"",dropoff:q}});m.remove();toast("انسجل الخط، بالسلامة");curTrip=undefined;if(EXT)setExt(true);else await refreshTrip()}
    catch(e){$("#ln-e",m).textContent=e.message;b.disabled=false}};
}
// "زبون خاص": a free ride the office approves; the driver writes who exactly it is
function specialBox(t){
  const st=t.special_status;
  if(st==="pending") return `<div class="spbox wait"><b>⏳ زبون خاص: بانتظار موافقة الإدارة</b><small>${esc(t.special_note||"")}</small><small>ما تكدر تبدي أو تنهي السفرة لحد ما ترد الإدارة.</small></div>`;
  if(st==="approved") return `<div class="spbox ok"><b>⭐ زبون خاص: بدون كروة</b><small>${esc(t.special_note||"")}${t.special_by?` · وافق ${esc(t.special_by)}`:""}</small></div>`;
  const rej=st==="rejected"?`<div class="spbox bad"><b>✖ الإدارة رفضت الزبون الخاص: السفرة بكروة عادية</b>${t.special_reason?`<small>${esc(t.special_reason)}</small>`:""}</div>`:"";
  return rej+(t.waiting?"":`<button type="button" class="btn big" id="tr-sp">⭐ زبون خاص (بدون كروة)</button>`);
}
function specialForm(t){
  const zs=today.zones||[];
  const m=modal(`<h3>⭐ زبون خاص</h3><p style="margin:0">سفرة بدون كروة. اكتب منو الزبون بالضبط، والطلب يروح للإدارة توافق عليه، وبعدها تكمّل السفرة.</p>
    <div class="field"><label for="sp-n">منو الزبون بالضبط؟</label><textarea id="sp-n" rows="3" maxlength="200" placeholder="مثال: أبو علي، مدير المجمّع، عمارة B3"></textarea></div>
    ${t?"":`<div class="field"><label for="sp-z">إلى وين؟</label><select id="sp-z" class="btn" style="width:100%"><option value="">ما أعرف بعد</option>${zs.map(z=>`<option value="${z.id}">${esc(z.name)}</option>`).join("")}</select></div>`}
    <div class="err" id="sp-e"></div><div class="row"><button class="btn" id="sp-x">رجوع</button><button class="btn primary" id="sp-ok">إرسال للإدارة</button></div>`);
  $("#sp-x",m).onclick=()=>m.remove(); setTimeout(()=>$("#sp-n",m).focus(),50);
  $("#sp-ok",m).onclick=async()=>{const n=$("#sp-n",m).value.trim();if(n.length<3){$("#sp-e",m).textContent="اكتب منو الزبون بالضبط";return}
    const b=$("#sp-ok",m);b.disabled=true;
    try{await rpc("taxi_driver_trip",{p_code:CODE,p_action:"special",p:{note:n,zone_id:t?"":$("#sp-z",m).value}});m.remove();toast("انرسل للإدارة، انتظر الموافقة");curTrip=undefined;if(EXT)setExt(true);else await refreshTrip()}
    catch(e){$("#sp-e",m).textContent=e.message;b.disabled=false}};
}
// paid waiting meter: tiers [{m,f}] per cycle (the last tier is the cycle, e.g. an hour = 5000)
const WT_DEF=[{m:10,f:250},{m:15,f:1500},{m:30,f:2500},{m:60,f:5000}];
function waitFee(sec,tiers){const T=(tiers&&tiers.length?tiers:WT_DEF),cyc=T[T.length-1].m,mins=Math.floor(Math.max(0,sec||0)/60),r=mins%cyc;let f=0;T.forEach(x=>{if(x.m<=r)f=x.f});return Math.floor(mins/cyc)*T[T.length-1].f+f}
function waitNext(sec,tiers){const T=(tiers&&tiers.length?tiers:WT_DEF),cyc=T[T.length-1].m,mins=Math.floor(Math.max(0,sec||0)/60),base=mins-mins%cyc,r=mins%cyc;const n=T.find(x=>x.m>r);if(!n)return null;return {in:(base+n.m)*60-sec,f:waitFee((base+n.m)*60,T)}}
// the customer changed his mind mid-trip: the office has 30 s; no answer = two fares
function destChangeBox(t){
  const dc=t.dest_change, waitingC=dc&&(dc.status==="awaiting_customer"||dc.status==="pending");
  if(waitingC) return `<div class="chgbox"><b>${esc(dc.title)}</b><small>${esc(dc.msg)}</small><small>${dc.status==="awaiting_customer"?"إذا ما ردّ خلال دقيقة يتغيّر وحده":"جارٍ التغيير"} · <span id="chg-left" dir="ltr">0:${String(dc.seconds_left).padStart(2,"0")}</span></small></div>`;
  const bad=dc&&(dc.status==="customer_refused"||dc.status==="reverted");
  const note=dc?`<div class="chgbox ${bad?"":"done"}"><b>${esc(dc.title)}</b>${dc.msg?`<small>${esc(dc.msg)}</small>`:""}</div>`:"";
  return note+(t.waiting?"":`<button type="button" class="btn big" id="tr-chg">🔀 الزبون غيّر مساره</button>`);
}
function destChangeForm(t){
  const zs=(today.zones||[]).filter(z=>z.id!==t.zone_id);
  const m=modal(`<h3>🔀 الزبون غيّر مساره</h3><p style="margin:0">وين يريد يروح هسه؟ الأجرة تنحسب حسب شكد مشيت من الطريق:</p>
    <ul class="note" style="margin:0;padding-inline-start:18px"><li>قبل الثلث: سعر المنطقة الجديدة بس</li><li>بالنص: نص الكروة القديمة + الجديدة</li><li>بعد الثلثين: كروتين</li></ul>
    <p class="note" style="margin:0">إذا الزبون عنده حساب، يوصله طلب يأكّد من تلفونه.</p>
    <div class="field"><label for="chg-q">المنطقة الجديدة</label><input id="chg-q" type="search" placeholder="ابحث…" autocomplete="off"></div>
    <div class="zones" id="chg-z" role="radiogroup" aria-label="المنطقة الجديدة"></div>
    <div class="err" id="chg-e"></div><div class="row"><button class="btn" id="chg-c">رجوع</button><button class="btn primary" id="chg-ok">إرسال للإدارة</button></div>`);
  let sel=null;
  const draw=()=>{const q=$("#chg-q",m).value.trim();$("#chg-z",m).innerHTML=zs.filter(z=>!q||z.name.includes(q)).map(z=>`<button type="button" role="radio" aria-checked="${sel===z.id}" class="zchip${sel===z.id?" on":""}" data-z="${z.id}">${esc(z.name)} — ${fmt(z.price)}</button>`).join("")||`<div class="empty">ماكو منطقة بهذا الاسم.</div>`;
    $("#chg-z",m).querySelectorAll("[data-z]").forEach(b=>b.onclick=()=>{sel=+b.dataset.z;draw()})};
  draw();$("#chg-q",m).oninput=draw;$("#chg-c",m).onclick=()=>m.remove();
  $("#chg-ok",m).onclick=async()=>{if(!sel){$("#chg-e",m).textContent="اختار المنطقة الجديدة";return}const b=$("#chg-ok",m);b.disabled=true;
    try{await rpc("taxi_driver_change_dest",{p_code:CODE,p_zone:sel});m.remove();toast("انسجل التغيير");curTrip=undefined;if(EXT)setExt(true);else await refreshTrip()}catch(e){$("#chg-e",m).textContent=e.message;b.disabled=false}};
}
// driver's cash: what he holds for the company, and the "إيداع" (hand over to the office) button
function moneyCard(){
  const m=today.money; if(!m) return "";
  const last=(m.deposits||[])[0], free=Math.max(0,(m.in_hand||0)-(m.pending||0));
  const lastLine=!last?"":last.status==="pending"?`⏳ إيداع ${dinar(last.amount)} بانتظار تأكيد الإدارة`
    :last.status==="confirmed"?`✔ الإدارة استلمت ${dinar(last.received??last.amount)}${last.received!=null&&last.received!==last.amount?` (من ${dinar(last.amount)})`:""}${last.decided_by&&/يدوي/.test(last.decided_by)?" (كانت مسجّلة عند الإدارة)":""}`
    :`✖ انرفض إيداع ${dinar(last.amount)}${last.reason?`: ${esc(last.reason)}`:""}`;
  return `<div class="money"><div class="money-top"><span>💵 المبلغ اللي بيدك للشركة</span><b>${dinar(m.in_hand||0)}</b></div>
    ${m.pending?`<small>منها ${dinar(m.pending)} بانتظار تأكيد الإدارة</small>`:""}
    ${lastLine?`<small class="money-last">${lastLine}</small>`:""}
    ${free>0?`<button type="button" class="btn primary big" id="dep-btn">إيداع: سلّمت المبلغ للإدارة</button>`
      :`<div class="money-ok">✔ ما عليك شي للشركة هسه${m.pending?"، والإيداع بانتظار التأكيد":""}${m.last_collected&&!m.pending?`<br><small>آخر استلام سجّلته الإدارة: ${dinar(m.last_collected.amount)} · ${new Date(m.last_collected.at).toLocaleString("ar-IQ",{weekday:"short",hour:"2-digit",minute:"2-digit"})}</small>`:""}</div>`}</div>`;
}
function depositForm(){
  const m=today.money||{}, free=Math.max(0,(m.in_hand||0)-(m.pending||0));
  const md=modal(`<h3>💵 إيداع للإدارة</h3><p style="margin:0">اكتب المبلغ اللي سلّمته للإدارة (أكثر شي ${dinar(free)}). ينحسب بعد ما الإدارة تأكد إنها استلمته.</p>
    <div class="field"><label for="dp-a">المبلغ (دينار)</label><input id="dp-a" inputmode="numeric" value="${free}" style="font:600 24px var(--mono);text-align:center"></div>
    <div class="field"><label for="dp-n">ملاحظة (اختياري)</label><input id="dp-n" placeholder="مثال: سلّمته لأبو علي"></div>
    <div class="err" id="dp-e"></div><div class="row"><button class="btn" id="dp-c">رجوع</button><button class="btn primary" id="dp-ok">إرسال الإيداع</button></div>`);
  $("#dp-c",md).onclick=()=>md.remove();
  $("#dp-ok",md).onclick=async()=>{const a=parseInt(($("#dp-a",md).value||"").replace(/\D/g,""),10);const b=$("#dp-ok",md);
    if(!a){$("#dp-e",md).textContent="اكتب المبلغ";return}
    b.disabled=true;try{const r=await rpc("taxi_driver_deposit",{p_code:CODE,p_amount:a,p_note:$("#dp-n",md).value});today.money=r;md.remove();toast("انرسل الإيداع، بانتظار تأكيد الإدارة");curTrip=undefined;showTrip(null,true)}
    catch(e){$("#dp-e",md).textContent=e.message;b.disabled=false}};
}
function clock(s){s=Math.max(0,s|0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")}
async function tripAct(a,p){
  try{await rpc("taxi_driver_trip",{p_code:CODE,p_action:a,p:p||{}});toast(a==="end"?"انسجلت السفرة":a==="reject"?"انرفضت":"تم");if(EXT)setExt(true);else await refreshTrip()}catch(e){toast(e.message)}
}
function goOn(){
  ON=true;store.set("taxi_on","1");
  const r=$("#ring");r.className="ring wait";$("#rs").textContent="إطفاء التتبع";$("#rsub").textContent="جارٍ تحديد الموقع…";
  keepAwake();startWatch();clearInterval(hb);hb=setInterval(heartbeat,15000);
  clearInterval(tripPoll);refreshTrip();tripPoll=setInterval(refreshTrip,8000);
}
function goOff(){
  ON=false;store.set("taxi_on","0");clearInterval(tripPoll);showTrip(null,true);
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}
  clearInterval(hb);siren(false);gpsBad=false;$("#block").hidden=true;
  try{wake&&wake.release()}catch{}wake=null;
  report("stopped");
  const r=$("#ring");r.className="ring off";$("#rs").textContent="تشغيل التتبع";$("#rsub").textContent="التتبع مطفأ";
}
function confirmStop(){
  const m=modal(`<h3>إطفاء التتبع؟</h3><p style="margin:0">راح يتوقف إرسال موقعك للإدارة.</p><div class="row"><button class="btn" id="cn">لا، استمر</button><button class="btn primary" id="cy">إطفاء التتبع</button></div>`);
  $("#cn",m).onclick=()=>m.remove();$("#cy",m).onclick=()=>{m.remove();goOff()};
}
function unlockAudio(){try{actx=actx||new AudioContext();actx.resume()}catch{}}
function siren(on){
  clearInterval(sirenT);
  if(on&&actx){const tone=()=>{try{const o=actx.createOscillator(),g=actx.createGain();o.type="square";o.frequency.setValueAtTime(950,actx.currentTime);o.frequency.setValueAtTime(650,actx.currentTime+.25);o.connect(g);g.connect(actx.destination);g.gain.value=.15;o.start();o.stop(actx.currentTime+.5)}catch{}};tone();sirenT=setInterval(tone,1500)}
  if(on&&navigator.vibrate) try{navigator.vibrate([500,200,500,200,500])}catch{}
}
async function keepAwake(){try{if("wakeLock" in navigator&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>wake=null)}}catch{}}
function startWatch(){
  if(!("geolocation" in navigator)) return gpsError({code:2});
  if(watchId!==null) navigator.geolocation.clearWatch(watchId);
  watchId=navigator.geolocation.watchPosition(onFix,gpsError,{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}
function onFix(pos){
  if(!ON) return;
  lastFix=pos;
  if(gpsBad){gpsBad=false;$("#block").hidden=true;siren(false)}
  const c=pos.coords, r=$("#ring");
  r.className="ring"; $("#rs").textContent="إطفاء التتبع"; $("#rsub").textContent="التتبع شغّال";
  $("#st-acc").textContent=Math.round(c.accuracy)+" م";
  $("#st-spd").textContent=c.speed!=null?Math.round(c.speed*3.6)+" كم/س":"0 كم/س";
  if(Date.now()-lastSent>4000) send(c);
}
async function send(c){
  try{const r=await rpc("taxi_ping_v2",{p_code:CODE,p_lat:c.latitude,p_lng:c.longitude,p_speed:c.speed,p_acc:c.accuracy,p_heading:c.heading,p_battery:battery});
    lastSent=Date.now();sentCount++;$("#st-n").textContent=sentCount;
    if(r) showTrip(r.trip);
  }catch(e){
    if(/رمز/.test(e.message)){store.del("taxi_driver_code");if(store.get("taxi_role")==="driver")store.del("taxi_role");CODE=null;location.reload()}
    $("#rsub").textContent="لا يوجد إنترنت، سيُعاد الإرسال تلقائيًا";
  }
}
function heartbeat(){
  if(gpsBad||!ON) return;
  navigator.geolocation.getCurrentPosition(p=>{lastFix=p;send(p.coords)},gpsError,{enableHighAccuracy:true,maximumAge:10000,timeout:15000});
}
function gpsError(err){
  if(err.code===3||!ON) return; // timeout only: keep waiting
  gpsBad=true;
  const denied=err.code===1;
  $("#ring").className="ring bad"; $("#rs").textContent="إطفاء التتبع"; $("#rsub").textContent=denied?"⚠ إذن الموقع مرفوض":"⚠ الـ GPS مطفأ";
  $("#bt").textContent=denied?"إذن الموقع مرفوض":"الـ GPS مطفأ";
  $("#bp").textContent=denied?"افتح إعدادات المتصفح ← أذونات الموقع ← اسمح لهذا الموقع. الإدارة تم إبلاغها.":"شغّل الموقع (GPS) من إعدادات الهاتف حالًا. الإدارة تم إبلاغها.";
  $("#block").hidden=false; siren(true);
  report(denied?"denied":"off");
}
function report(state){rpc("taxi_gps_state",{p_code:CODE,p_state:state}).catch(()=>{})}
function beacon(state){
  try{const body=new Blob([JSON.stringify({p_code:CODE,p_state:state})],{type:"application/json"});
    navigator.sendBeacon(`${SB_URL}/rest/v1/rpc/taxi_gps_state?apikey=${encodeURIComponent(SB_KEY)}`,body)}catch{}
}

route();
</script>
