<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#014e55">
<title>المنصور تاكسي</title>
<meta name="description" content="المنصور تاكسي: تكاسي مجمّع المنصور، سواق مسجّلين وكل سيارة متتبَّعة مباشرة.">
<meta property="og:title" content="المنصور تاكسي">
<meta property="og:description" content="تكاسي مجمّع المنصور، سواق مسجّلين وكل سيارة متتبَّعة مباشرة.">
<meta property="og:image" content="https://ftyo979vfemail-code.github.io/mansour-city/taxi/img/og.png">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Al-Mansour Taxi: the logo's deep teal towers + taxi-yellow road; landing page rides a dashed road line */
:root{
  --bg:#f2f5f4; --panel:#ffffff; --line:#d9e2e0; --fg:#0f2326; --muted:#5d6f71;
  --teal:#014e55; --teal-deep:#00383d; --on-teal:#eaf2f1;
  --amber:#febd02; --amber-ink:#2a1f00; --ok:#16935a; --warn:#d97706; --bad:#d6332b; --idle:#8a9294;
  --plate:#ffffff; --plate-band:#1f4fa3;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1d20; --panel:#12292d; --line:#21403f; --fg:#e8efee; --muted:#93a8a8;
  --teal:#01474e; --teal-deep:#003237; --on-teal:#eaf2f1;
  --amber:#febd02; --amber-ink:#2a1f00; --ok:#2fbf7a; --warn:#f0a030; --bad:#ff5a4f; --idle:#7f8c8e;
  --plate:#f4f4f0; --plate-band:#2a5cb8; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--body)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;font-weight:600}
a.btn{color:var(--fg);text-decoration:none;display:inline-block}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.field input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%}
.err{color:var(--bad);font-size:14px;min-height:1.4em}

/* Plate */
.plate{display:inline-flex;align-items:stretch;border:2px solid #1b1d22;border-radius:6px;overflow:hidden;background:var(--plate);color:#111;font-family:var(--mono);font-weight:600;direction:ltr;line-height:1}
.plate b{background:var(--plate-band);color:#fff;font:600 10px/1 var(--body);padding:4px 5px;display:flex;align-items:center;writing-mode:vertical-rl}
.plate span{padding:5px 9px;font-size:15px;letter-spacing:.06em;display:flex;align-items:center}
.plate.lg span{font-size:28px;padding:10px 16px}
.plate.lg b{font-size:13px;padding:6px 8px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.s-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.s-bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.s-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.s-idle{color:var(--idle);background:color-mix(in srgb,var(--idle) 14%,transparent)}
.s-ok.live::before{animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* Gate */
.gate{min-height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
.gate-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:44px;height:44px;display:grid;place-items:center}
.brand-mark img{width:100%;height:100%;object-fit:contain}
.logo-dark{display:none}
@media (prefers-color-scheme:dark){.logo-light{display:none}.logo-dark{display:inline}}
.brand small{display:block;color:var(--muted);font-size:13px}
.code-input{font:600 30px var(--mono)!important;text-align:center;letter-spacing:.35em;direction:ltr}
.switch{font-size:14px;color:var(--muted);text-align:center}
.switch a{color:var(--fg);font-weight:600}

/* Admin shell */
.shell{height:100vh;height:100dvh;display:grid;grid-template-rows:auto auto 1fr}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));background:var(--panel);border-bottom:1px solid var(--line)}
.top .brand{margin-inline-end:auto}
.counts{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;padding:8px max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--fg);border-color:var(--amber)}
.view{min-height:0;overflow:auto}
.alert{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--bad) 14%,var(--panel));color:var(--bad);font-weight:600;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));border-bottom:1px solid color-mix(in srgb,var(--bad) 30%,var(--line))}

.live{display:grid;grid-template-columns:340px 1fr;height:100%}
.list{border-inline-end:1px solid var(--line);overflow:auto;background:var(--panel)}
.car{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;text-align:start;width:100%;background:none;border-inline:0;border-top:0}
.car:hover,.car.sel{background:color-mix(in srgb,var(--amber) 9%,transparent)}
.car .who{font-weight:600}
.car .meta{grid-column:1/-1;color:var(--muted);font-size:13px;display:flex;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
#map{height:100%;min-height:360px;background:var(--line)}
.empty{padding:28px 20px;color:var(--muted);text-align:center}

.wrap{padding:18px max(16px,env(safe-area-inset-right)) 28px max(16px,env(safe-area-inset-left));max-width:1100px;margin:0 auto}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar h2{margin-inline-end:auto;font-size:20px}
.tbl-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:11px 14px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
tr:last-child td{border-bottom:0}
td .acts{display:flex;gap:6px;flex-wrap:wrap}
.code{font:600 15px var(--mono);letter-spacing:.15em;direction:ltr;display:inline-block}
.log li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.log{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.log time{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.share{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.share code{font-family:var(--mono);direction:ltr;word-break:break-all;flex:1;min-width:0}

/* Modal */
.modal{position:fixed;inset:0;background:rgb(0 0 0/.45);display:grid;place-items:center;padding:16px;z-index:2000}
.sheet{background:var(--panel);border-radius:16px;width:min(520px,100%);max-height:90vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sheet .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:3000}

/* Driver */
.drv{min-height:100%;display:flex;flex-direction:column;gap:18px;padding:22px max(16px,env(safe-area-inset-right)) 22px max(16px,env(safe-area-inset-left));max-width:520px;margin:0 auto}
.ring{align-self:center;width:210px;height:210px;border-radius:50%;display:grid;place-items:center;text-align:center;border:10px solid var(--ok);position:relative}
.ring{background:var(--ok);color:#fff;cursor:pointer;box-shadow:0 8px 24px rgb(0 0 0/.18);font:inherit;-webkit-tap-highlight-color:transparent;transition:transform .12s}
.ring:active{transform:scale(.96)}
.ring{border-color:color-mix(in srgb,var(--ok) 70%,#000)}
.ring.off{background:var(--bad);border-color:color-mix(in srgb,var(--bad) 70%,#000)}
.ring strong{font-size:26px} .ring small{color:rgb(255 255 255/.9)!important}
.ring::after{content:"";position:absolute;inset:-22px;border-radius:50%;border:2px solid currentColor;color:var(--ok);opacity:.4;animation:ripple 2s infinite}
.ring.bad::after,.ring.wait::after,.ring.off::after{display:none}
@keyframes ripple{from{transform:scale(.85);opacity:.5}to{transform:scale(1.1);opacity:0}}
.ring strong{font:700 22px var(--display)}
.ring small{color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat small{color:var(--muted);font-size:12.5px;display:block}
.stat b{font:600 17px var(--mono);font-variant-numeric:tabular-nums}
.note{font-size:13.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.block{position:fixed;inset:0;background:var(--bad);color:#fff;z-index:5000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
.block h2{font-size:30px}
.block p{max-width:340px;font-size:17px}
.block .btn{background:#fff;color:var(--bad);border:0;font-size:18px;padding:14px 26px}

@media (max-width:820px){
  .live{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto}
  .list{border-inline-end:0;order:2}
  #map{order:1}
  .grid2{grid-template-columns:1fr}
}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi small{color:var(--muted);font-size:13px}
.kpi b{font:700 22px var(--display);font-variant-numeric:tabular-nums}
.kpi-bad{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 7%,var(--panel))}
.kpi-bad b{color:var(--bad)}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.h4{font:600 15px var(--display);margin:6px 0 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap .note{margin:0 0 14px}
select.btn{font-weight:500}
.trip{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.trip h3{font-size:19px}.trip p{margin:0;color:var(--muted);line-height:1.8}.trip p b{color:var(--fg)}
.trip.offer{border:2px solid var(--amber);background:color-mix(in srgb,var(--amber) 10%,var(--panel))}
.trip.on{border:2px solid var(--ok)}
.btn.big{font-size:18px;padding:14px;width:100%}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.wk{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wk b{font:600 15px var(--display);font-variant-numeric:tabular-nums}
.kpi-warn{border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.kpi-warn b{color:var(--warn)}
.calc{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.calc div{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.calc div:last-child{border-bottom:0}
.calc b{font-variant-numeric:tabular-nums}
.calc .tot{background:color-mix(in srgb,var(--amber) 14%,var(--panel));font-size:17px}
.rcpt{display:flex;flex-direction:column;gap:12px}
.rcpt p{margin:0}
.rc-head{display:flex;align-items:center;gap:14px;border-bottom:2px solid var(--amber);padding-bottom:10px}
.rc-head img{height:64px;width:auto}
.rc-head small{color:var(--muted)}
.rc-trips{min-width:0;font-size:13px}
.rc-trips th,.rc-trips td{padding:6px 8px}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:22px}
.sig div{border-top:1px solid var(--fg);padding-top:6px;text-align:center;color:var(--muted);font-size:13px}
@media print{
  body *{visibility:hidden}
  .rc-modal,.rc-modal *{visibility:visible}
  .rc-modal{position:absolute;inset:0;background:#fff;display:block;padding:0}
  .rc-modal .sheet{width:100%!important;max-height:none;box-shadow:none;color:#000;background:#fff}
  .no-print{display:none!important}
}
.steps-sm{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted);line-height:1.7}
.steps-sm b{color:var(--fg)} .steps-sm code{font-family:var(--mono);background:var(--bg);padding:1px 6px;border-radius:6px;color:var(--fg)}
.chk{display:flex;gap:10px;align-items:center;font-weight:600}
.chk input{width:20px;height:20px;accent-color:var(--ok)}
.trip details{color:var(--muted);font-size:14px}.trip summary{cursor:pointer;font-weight:600;margin-bottom:6px}
/* ---------- Landing ---------- */
.lp{min-height:100%;display:flex;flex-direction:column}
.lp-in{width:100%;max-width:1120px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.hero{background:radial-gradient(120% 90% at 85% 10%,#02656d 0%,var(--teal) 45%,var(--teal-deep) 100%);color:var(--on-teal);position:relative;overflow:hidden}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px}
.hero-top img{height:46px;width:auto}
.hero-top a{color:var(--on-teal);text-decoration:none;font-weight:600;font-size:14px;border:1px solid rgb(255 255 255/.25);border-radius:999px;padding:7px 16px}
.hero-top a:hover{background:rgb(255 255 255/.08)}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:center;padding-block:28px 120px}
.hero h1{font-size:clamp(34px,6vw,62px);line-height:1.15;font-weight:700;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--amber)}
.hero p.lead{font-size:clamp(16px,2vw,19px);line-height:1.8;color:rgb(234 242 241/.85);max-width:34em;margin:18px 0 0}
.lp-live{display:inline-flex;align-items:center;gap:10px;margin-top:22px;background:rgb(0 0 0/.18);border:1px solid rgb(255 255 255/.14);border-radius:999px;padding:8px 16px 8px 14px;font-weight:600;font-size:15px}
.lp-live i{width:10px;height:10px;border-radius:50%;background:#46d38a;box-shadow:0 0 0 0 rgb(70 211 138/.6);animation:beacon 1.8s infinite}
.lp-live b{font:700 18px var(--display);font-variant-numeric:tabular-nums;color:var(--amber)}
@keyframes beacon{70%{box-shadow:0 0 0 10px rgb(70 211 138/0)}100%{box-shadow:0 0 0 0 rgb(70 211 138/0)}}
.ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.cta{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font:700 17px var(--display);border-radius:14px;padding:14px 22px;transition:transform .15s}
.cta:hover{transform:translateY(-2px)}
.cta.call{background:var(--amber);color:var(--amber-ink)}
.cta.wa{background:rgb(255 255 255/.1);color:var(--on-teal);border:1px solid rgb(255 255 255/.25)}
.cta small{display:block;font:500 13px var(--mono);direction:ltr;opacity:.8}
.hours{margin-top:14px;font-size:14px;color:rgb(234 242 241/.75)}
.no-contact{margin-top:22px;font-size:14px;color:rgb(234 242 241/.7);border:1px dashed rgb(255 255 255/.25);border-radius:12px;padding:10px 14px;display:inline-block}
.hero-art{justify-self:center;max-width:100%}
.hero-art img{width:min(340px,70vw);height:auto;filter:drop-shadow(0 24px 40px rgb(0 0 0/.35))}
.road{position:absolute;inset:auto 0 0 0;height:110px;pointer-events:none}
.road svg{width:100%;height:100%;display:block}
.road .cab{offset-path:path("M-40 70 C 300 20, 700 110, 1640 40");offset-rotate:auto;animation:drive 9s linear infinite}
@keyframes drive{from{offset-distance:0%}to{offset-distance:100%}}
@media (prefers-reduced-motion:reduce){.road .cab{animation:none;offset-distance:62%}.lp-live i{animation:none}}

.sec{padding-block:64px}
.sec h2{font-size:clamp(26px,3.6vw,38px);font-weight:700;color:var(--fg)}
.sec .kicker{font:600 13px var(--display);letter-spacing:.06em;color:var(--teal);margin-bottom:8px;display:block}
@media (prefers-color-scheme:dark){.sec .kicker{color:var(--amber)}}
.why{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:28px}
.why article{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:10px}
.why h3{font-size:19px}
.why p{margin:0;color:var(--muted);line-height:1.8}
.why .ico{width:46px;height:46px;border-radius:12px;background:color-mix(in srgb,var(--teal) 12%,transparent);color:var(--teal);display:grid;place-items:center}
@media (prefers-color-scheme:dark){.why .ico{background:color-mix(in srgb,var(--amber) 14%,transparent);color:var(--amber)}}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:30px;counter-reset:st;position:relative}
.steps li{list-style:none;padding:0 0 0 18px;position:relative;counter-increment:st}
.steps li::before{content:counter(st,arabic-indic);font:700 40px var(--display);color:var(--amber);display:block;line-height:1}
.steps li h3{font-size:18px;margin-top:10px}
.steps li p{color:var(--muted);margin:6px 0 0;line-height:1.8}
.steps{padding:0;border-top:3px dashed color-mix(in srgb,var(--amber) 70%,transparent);padding-top:24px}
.band{background:var(--panel);border-block:1px solid var(--line)}
.drv-band{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-block:34px}
.drv-band p{margin:6px 0 0;color:var(--muted);max-width:40em}
.lp-foot{margin-top:auto;background:var(--teal-deep);color:rgb(234 242 241/.8);font-size:14px}
.lp-foot .lp-in{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:22px}
.lp-foot img{height:40px}
.lp-foot nav{display:flex;gap:18px;flex-wrap:wrap}
.lp-foot a{color:var(--on-teal);text-decoration:none;font-weight:600}
.lp-foot a:hover{text-decoration:underline}
@media (max-width:820px){
  .hero-grid{grid-template-columns:1fr;padding-block:8px 110px;text-align:start}
  .hero-art{order:-1}
  .hero-art img{width:min(220px,55vw)}
  .why,.steps{grid-template-columns:1fr}
  .steps{gap:22px}
}
.leaflet-container{font-family:var(--body)}
.mk{background:var(--amber);color:var(--amber-ink);border:2px solid #1b1d22;border-radius:8px;font:600 11px/1 var(--mono);padding:4px 6px;white-space:nowrap;box-shadow:0 2px 6px rgb(0 0 0/.3);direction:ltr}

const sess={get(k){try{return sessionStorage.getItem(k)}catch{return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch{}},del(k){try{sessionStorage.removeItem(k)}catch{}}};

async function rpc(fn,args){
  const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:"POST",headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(args||{})});
  const t=await r.text(); let j=null; try{j=t?JSON.parse(t):null}catch{}
  if(!r.ok) throw new Error((j&&j.message)||"تعذّر الاتصال بالخادم");
  return j;
}
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),2600)}
function plateHTML(p,lg){return `<span class="plate${lg?" lg":""}"><b>IRQ</b><span>${esc(p)}</span></span>`}
function ago(ts){if(!ts)return "—";const s=Math.max(0,(Date.now()-new Date(ts))/1000|0);if(s<60)return `قبل ${s} ث`;if(s<3600)return `قبل ${s/60|0} د`;if(s<86400)return `قبل ${s/3600|0} س`;return new Date(ts).toLocaleDateString("ar-IQ")}
function status(c){
  if(!c.active) return {k:"idle",t:"موقوفة"};
  if(c.gps_state==="never"||!c.last_seen) return {k:"idle",t:"لم يبدأ"};
  if(c.gps_state==="stopped") return {k:"idle",t:"أنهى الدوام"};
  if(c.gps_state==="off") return {k:"bad",t:"GPS مطفأ"};
  if(c.gps_state==="denied") return {k:"bad",t:"رفض الموقع"};
  if(c.gps_state==="closed") return {k:"bad",t:"أغلق التطبيق"};
  if(c.gps_state==="lost") return {k:"bad",t:"انقطع الإرسال"};
  const old=(Date.now()-new Date(c.last_seen))/1000>STALE_SEC;
  if(old) return {k:"bad",t:"انقطع الإرسال"};
  if(c.unlogged_flagged) return {k:"bad",t:"⚠ يتحرك بدون سفرة"};
  if(c.trip&&TS[c.trip.status]) return {k:c.trip.status==="assigned"?"warn":"ok",t:TS[c.trip.status][1]};
  return {k:"ok",t:"فاضي"};
}
const TS={assigned:["s-warn","بانتظار قبول السائق"],accepted:["s-ok","رايح للزبون"],started:["s-ok","بسفرة"],done:["s-idle","انتهت"],cancelled:["s-idle","ملغية"],rejected:["s-bad","رفضها السائق"]};
const fmt=n=>Number(n||0).toLocaleString("en-US");
const dinar=n=>fmt(n)+" د.ع";
const EVT={started:["s-ok","بدأ الدوام"],stopped:["s-idle","أنهى الدوام"],gps_on:["s-ok","رجع الإرسال"],off:["s-bad","أطفأ الـ GPS"],denied:["s-bad","رفض إذن الموقع"],background:["s-warn","خرج من الصفحة"],closed:["s-bad","أغلق التطبيق"],lost:["s-bad","انقطع الإرسال (بطارية أو شبكة)"],unlogged:["s-bad","تحرّك بدون سفرة مسجّلة"],rejected:["s-bad","رفض سفرة من المكتب"]};
const ICON=`<img class="logo-light" src="img/mark.png" alt=""><img class="logo-dark" src="img/mark-light.png" alt="">`;
const ICON_OLD=`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M6 17v2M18 17v2M4 13l2-6a2 2 0 0 1 2-1h8a2 2 0 0 1 2 1l2 6v4H4z"/><path d="M10 4h4"/><circle cx="7.5" cy="13.5" r="1"/><circle cx="16.5" cy="13.5" r="1"/></svg>`;

  pin:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>`,
  shield:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>`,
  phone:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>`,
  wa:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.3-3.9A8.5 8.5 0 1 1 8 19z"/><path d="M9 9.5c.3 2.4 2.1 4.3 4.5 4.6l1-1.1 1.8.8-.4 1.6c-3.9.2-7-2.9-6.9-6.8l1.6-.4.8 1.8z"/></svg>`
};
function telHref(n){return "tel:"+String(n).replace(/[^\d+]/g,"")}
function waHref(n){let d=String(n).replace(/\D/g,"");if(d.startsWith("07"))d="964"+d.slice(1);return "https://wa.me/"+d}
function landingApp(){
  document.title="المنصور تاكسي";
  $("#app").innerHTML=`<div class="lp">
  <header class="hero">
    <div class="lp-in hero-top"><img src="img/wordmark-light.png" alt="المنصور تاكسي" width="140" height="74"><a href="#admin">دخول الإدارة</a></div>
    <div class="lp-in hero-grid">
      <div>
        <h1>تكسي المجمّع<br><em>أقرب إلك</em> من باب العمارة</h1>
        <p class="lead">المنصور تاكسي يخدم سكّان مجمّع المنصور: سواق معروفين ومسجّلين عند الإدارة، وكل سيارة تنشاف على الخريطة لحظة بلحظة طول ما هي بالخدمة.</p>

        <path d="M-40 70 C 300 20, 700 110, 1640 40" fill="none" stroke="var(--teal-deep)" stroke-width="2.5" stroke-dasharray="26 22"/>
        <g class="cab"><rect x="-16" y="-9" width="32" height="18" rx="5" fill="var(--amber)" stroke="var(--teal-deep)" stroke-width="2.5"/><rect x="-5" y="-14" width="10" height="5" rx="1.5" fill="var(--teal-deep)"/></g>
      </svg>
    </div>
  </header>

  <section class="sec"><div class="lp-in">
    <span class="kicker">ليش المنصور تاكسي</span>
    <h2>تتنقّل وإنت مرتاح بال</h2>
    <div class="why">
      <article><div class="ico">${IC.id}</div><h3>سواق مسجّلين</h3><p>كل سائق مسجّل عند إدارة المجمّع باسمه ورقم هاتفه، وكل سيارة برقمها وموديلها ولونها.</p></article>
      <article><div class="ico">${IC.pin}</div><h3>تتبّع مباشر</h3><p>موقع كل تكسي يوصل للإدارة كل بضع ثواني طول الدوام، ومسار كل سفرة محفوظ.</p></article>
      <article><div class="ico">${IC.shield}</div><h3>أمان لعائلتك</h3><p>إذا سائق أطفأ الموقع أو انقطع الإرسال، الإدارة يرن عليها إنذار بنفس اللحظة.</p></article>
    </div>
  </div></section>

  <section class="sec" style="padding-top:0"><div class="lp-in">
    <span class="kicker">شلون تطلب</span>
    <h2>ثلاث خطوات وتوصل</h2>
    <ol class="steps">
      <li><h3>اتصل أو راسلنا</h3><p>على رقم الحجز أو الواتساب بهاي الصفحة.</p></li>
      <li><h3>گول وين إنت</h3><p>رقم العمارة أو البوابة اللي تنتظر عندها.</p></li>
      <li><h3>التكسي يجيك</h3><p>أقرب سيارة شغّالة تتحرك إلك.</p></li>
    </ol>
  </div></section>

  <section class="band"><div class="lp-in drv-band">
    <div><h2 style="font-size:22px">إنت سائق بالمنصور تاكسي؟</h2><p>نصّب تطبيق السائق وادخل بالرمز اللي انطتك إياه الإدارة.</p></div>
    <div class="ctas" style="margin:0"><a class="btn primary" style="text-decoration:none;padding:12px 18px" href="${APK_URL}">تحميل تطبيق السائق</a><a class="btn" style="text-decoration:none;padding:12px 18px" href="#driver">صفحة السائق</a></div>
  </div></section>

  <footer class="lp-foot"><div class="lp-in">
    <img src="img/logo-light.png" alt="المنصور تاكسي" width="26" height="40" style="width:auto">

    <span>© ${new Date().getFullYear()} المنصور تاكسي</span>
  </div></footer>
  </div>`;
  const render=i=>{
    if(i.cars>0){$("#live").hidden=false;
      $("#live span").innerHTML=i.online>0?`<b>${i.online}</b> سيارة شغّالة هسه من أصل <b>${i.cars}</b>`:`<b>${i.cars}</b> سيارة مسجّلة بأسطول المنصور تاكسي`;
      $("#live i").style.background=i.online>0?"":"var(--amber)"}
    const c=$("#contact");
    if(!i.phone&&!i.whatsapp){c.innerHTML=`<div class="no-contact">أرقام الحجز تنضاف هنا قريبًا</div>`;return}
    c.innerHTML=`<div class="ctas">${i.phone?`<a class="cta call" href="${telHref(i.phone)}">${IC.phone}<span>اتصل واحجز<small>${esc(i.phone)}</small></span></a>`:""}${i.whatsapp?`<a class="cta wa" href="${waHref(i.whatsapp)}" target="_blank" rel="noopener">${IC.wa}<span>واتساب<small>${esc(i.whatsapp)}</small></span></a>`:""}</div>${i.hours?`<div class="hours">أوقات العمل: ${esc(i.hours)}</div>`:""}`;
  };
  const load=()=>rpc("taxi_public_info",{}).then(render).catch(()=>{});
  load(); setInterval(load,30000);

window.addEventListener("hashchange",()=>location.reload());

/* ---------------- ADMIN ---------------- */
let PIN=sess.get("taxi_pin"), cars=[], map, markers={}, trailLine=null, selId=null, tab="live", pollT, evT, prevBad=new Set(), audioCtx;

function adminApp(){ PIN?adminShell():adminGate(); }
function adminGate(msg){
  $("#app").innerHTML=`<div class="gate"><form class="gate-card" id="g">
    <div class="brand"><div class="brand-mark">${ICON}</div><div><h1>المنصور تاكسي</h1><small>لوحة الإدارة والتتبع</small></div></div>
    <div class="field"><label for="pin">رمز المدير</label><input id="pin" class="code-input" inputmode="numeric" autocomplete="off" maxlength="12" required></div>
    <div class="err" id="ge">${esc(msg||"")}</div>
    <button class="btn primary">دخول</button>
    <div class="switch"><a href="#">الصفحة الرئيسية</a> · سائق؟ <a href="#driver">صفحة السائق</a></div></form></div>`;
  $("#g").onsubmit=async e=>{e.preventDefault();const p=$("#pin").value.trim();
    try{cars=await rpc("taxi_admin_list",{p_pin:p});PIN=p;sess.set("taxi_pin",p);adminShell()}catch(err){$("#ge").textContent=err.message}};
}
function adminShell(){
  $("#app").innerHTML=`<div class="shell">
   <header class="top">
     <div class="brand"><div class="brand-mark">${ICON}</div><div><h1>المنصور تاكسي</h1><small id="clock">تحديث مباشر كل 5 ثوانٍ</small></div></div>
     <div class="counts" id="counts"></div>
     <button class="btn primary" id="tripBtn">+ حجز سفرة</button>
     <button class="btn" id="addBtn">+ إضافة سيارة</button>
     <button class="btn sm" id="out">خروج</button>
   </header>
   <div>
     <div class="alert" id="alert" hidden></div>
     <nav class="tabs" role="tablist">
       <button role="tab" data-t="live">الخريطة الحيّة</button>
       <button role="tab" data-t="trips">السفرات</button>
       <button role="tab" data-t="week">التسوية الأسبوعية</button>
       <button role="tab" data-t="acc">الحسابات</button>
       <button role="tab" data-t="cars">السيارات والسائقين</button>
       <button role="tab" data-t="log">سجل التنبيهات</button>
       <button role="tab" data-t="set">الإعدادات</button>
     </nav>
   </div>
   <main class="view" id="view"></main></div>`;
  $("#addBtn").onclick=()=>carForm();
  $("#tripBtn").onclick=()=>tripForm();
  $("#out").onclick=()=>{sess.del("taxi_pin");PIN=null;clearInterval(pollT);clearInterval(evT);adminGate()};
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;renderTab()});
  document.addEventListener("pointerdown",()=>{try{audioCtx=audioCtx||new AudioContext()}catch{}},{once:true});
  renderTab(); poll(); pollT=setInterval(poll,5000);
}
async function poll(){
  try{cars=await rpc("taxi_admin_list",{p_pin:PIN})}catch(e){if(/رمز المدير/.test(e.message)){sess.del("taxi_pin");PIN=null;return adminGate(e.message)}return}
  const st=cars.map(c=>[c,status(c)]);
  const n={ok:0,bad:0,warn:0,idle:0}; st.forEach(([,s])=>n[s.k]++);
  $("#counts").innerHTML=`<span class="pill s-ok">${n.ok} متصل</span><span class="pill s-bad">${n.bad} منقطع</span>${n.warn?`<span class="pill s-warn">${n.warn} بالخلفية</span>`:""}<span class="pill s-idle">${cars.length} سيارة</span>`;
  const bad=st.filter(([,s])=>s.k==="bad");
  const al=$("#alert");
  if(bad.length){al.hidden=false;al.innerHTML=`⚠ تنبيه: ${bad.map(([c,s])=>`${esc(c.driver_name)} (${esc(c.plate)}) — ${s.t}`).join("، ")}`}else al.hidden=true;
  const nowBad=new Set(bad.map(([c])=>c.id));
  if([...nowBad].some(id=>!prevBad.has(id))) beep();
  prevBad=nowBad;
  if(tab==="live") renderLive(); else if(tab==="cars") renderCars(); else if(tab==="trips") loadTrips(true);
}
function beep(){try{if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.2,audioCtx.currentTime);o.start();o.stop(audioCtx.currentTime+.35)}catch{}}
function renderTab(){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===tab));
  clearInterval(evT); map=null; markers={}; trailLine=null;
  const v=$("#view");
  if(tab==="live"){v.innerHTML=`<div class="live"><div class="list" id="list"></div><div id="map"></div></div>`;initMap();renderLive()}
  if(tab==="cars"){v.innerHTML=`<div class="wrap" id="carsWrap"></div>`;renderCars()}
  if(tab==="log"){v.innerHTML=`<div class="wrap"><div class="bar"><h2>سجل التنبيهات</h2></div><ul class="log" id="log"><li class="empty">جارٍ التحميل…</li></ul></div>`;loadLog();evT=setInterval(loadLog,10000)}
  if(tab==="set") renderSettings();
  if(tab==="trips") renderTrips();
  if(tab==="acc") renderAccounts();
  if(tab==="week") renderWeek();
}
function initMap(){
  if(typeof L==="undefined"){$("#map").innerHTML=`<div class="empty">تعذّر تحميل الخريطة. تأكد من الإنترنت.</div>`;return}
  map=L.map("map",{zoomControl:true}).setView([33.315,44.366],12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
  setTimeout(()=>map&&map.invalidateSize(),100);
}
let fitted=false;
function renderLive(){
  const list=$("#list"); if(!list) return;
  if(!cars.length){list.innerHTML=`<div class="empty">لا توجد سيارات بعد.<br>اضغط «إضافة سيارة» لتسجيل أول تكسي وسائقه.</div>`;return}
  list.innerHTML=cars.map(c=>{const s=status(c);return `<button class="car${c.id===selId?" sel":""}" data-id="${c.id}">
    <div>${plateHTML(c.plate)} <span class="who">${esc(c.driver_name)}</span></div>
    <span class="pill s-${s.k}${s.k==="ok"?" live":""}">${s.t}</span>
    ${c.trip?`<div class="meta" style="color:var(--fg)">🚕 ${esc(c.trip.pickup||"—")} ← ${esc(c.trip.dropoff||"—")}${c.trip.customer_phone?` · <span dir="ltr">${esc(c.trip.customer_phone)}</span>`:""}</div>`:""}
    <div class="meta"><span>${esc([c.model,c.year].filter(Boolean).join(" "))||"—"}</span><span>آخر إشارة: ${ago(c.last_seen)}</span>${c.last_speed!=null?`<span>${Math.round((c.last_speed||0)*3.6)} كم/س</span>`:""}${c.battery!=null?`<span>بطارية ${c.battery}%</span>`:""}</div></button>`}).join("");
  list.querySelectorAll(".car").forEach(b=>b.onclick=()=>selectCar(b.dataset.id));
  if(!map) return;
  const pts=[];
  cars.forEach(c=>{
    if(c.last_lat==null) return; const s=status(c);
    const cls=s.k==="ok"?"":s.k==="bad"&&c.gps_state!=="ok"?"off":"stale";
    const html=`<div class="mk ${cls}">${esc(c.plate)}</div>`;
    const icon=L.divIcon({html,className:"",iconSize:null});
    const pos=[c.last_lat,c.last_lng]; pts.push(pos);
    const pop=`<b>${esc(c.driver_name)}</b><br>${esc(c.plate)} · ${esc(c.model)}<br>${s.t} · ${ago(c.last_seen)}${c.driver_phone?`<br><span dir="ltr">${esc(c.driver_phone)}</span>`:""}`;
    if(markers[c.id]){markers[c.id].setLatLng(pos).setIcon(icon).setPopupContent(pop)}
    else markers[c.id]=L.marker(pos,{icon}).addTo(map).bindPopup(pop);
  });
  Object.keys(markers).forEach(id=>{if(!cars.find(c=>c.id===id&&c.last_lat!=null)){map.removeLayer(markers[id]);delete markers[id]}});
  if(!fitted&&pts.length){map.fitBounds(pts,{padding:[50,50],maxZoom:15});fitted=true}
}
async function selectCar(id){
  selId=id; renderLive(); const c=cars.find(x=>x.id===id); if(!c||!map) return;
  if(c.last_lat!=null){map.setView([c.last_lat,c.last_lng],16);markers[id]&&markers[id].openPopup()}
  try{const t=await rpc("taxi_admin_trail",{p_pin:PIN,p_id:id,p_hours:12});
    if(trailLine) map.removeLayer(trailLine);
    if(t.length>1) trailLine=L.polyline(t.map(p=>[p[0],p[1]]),{color:getComputedStyle(document.documentElement).getPropertyValue("--amber").trim()||"#f2a400",weight:4,opacity:.85}).addTo(map);
  }catch{}
}

/* ---------- Trips (office dispatch) ---------- */
let tripsDay=null, tripsCache=[];
function todayStr(){const d=new Date(Date.now()+3*3600e3);return d.toISOString().slice(0,10)}
function hm(ts){return ts?new Date(ts).toLocaleTimeString("ar-IQ",{hour:"2-digit",minute:"2-digit"}):"—"}
function renderTrips(){
  tripsDay=tripsDay||todayStr();
  $("#view").innerHTML=`<div class="wrap">
    <div class="bar"><h2>السفرات</h2><label class="sr" for="tday">اليوم</label><input id="tday" type="date" value="${tripsDay}" class="btn"><button class="btn primary" id="nt">+ حجز سفرة</button></div>
    <div id="tsum" class="kpis"></div>
    <div id="tlist"><div class="empty">جارٍ التحميل…</div></div></div>`;
  $("#tday").onchange=e=>{tripsDay=e.target.value;loadTrips()};
  $("#nt").onclick=()=>tripForm();
  loadTrips();
}
async function loadTrips(quiet){
  const box=$("#tlist"); if(!box) return;
  if(document.querySelector(".modal")&&quiet) return;
  try{tripsCache=await rpc("taxi_admin_trips",{p_pin:PIN,p_day:tripsDay})}catch(e){box.innerHTML=`<div class="empty">${esc(e.message)}</div>`;return}
  const done=tripsCache.filter(t=>t.status==="done"), open=tripsCache.filter(t=>["assigned","accepted","started"].includes(t.status));
  $("#tsum").innerHTML=`<div class="kpi"><small>سفرات مكتملة</small><b>${done.length}</b></div><div class="kpi"><small>مجموع الأجرة</small><b>${dinar(done.reduce((a,t)=>a+(t.fare||0),0))}</b></div><div class="kpi"><small>مفتوحة هسه</small><b>${open.length}</b></div><div class="kpi"><small>مرفوضة</small><b>${tripsCache.filter(t=>t.status==="rejected").length}</b></div>`;
  if(!tripsCache.length){box.innerHTML=`<div class="empty card">ماكو سفرات بهذا اليوم. اضغط «حجز سفرة» لما يخابرك زبون، واختار السائق، فتوصله السفرة على تطبيقه.</div>`;return}
  box.innerHTML=`<div class="tbl-wrap"><table><thead><tr><th>الوقت</th><th>السائق</th><th>من ← إلى</th><th>الزبون</th><th>المصدر</th><th>الحالة</th><th>الأجرة</th><th>كم</th><th></th></tr></thead><tbody>
  ${tripsCache.map(t=>{const st=TS[t.status]||["s-idle",t.status];const openT=["assigned","accepted","started"].includes(t.status);return `<tr>
    <td style="font-variant-numeric:tabular-nums">${hm(t.created_at)}${t.ended_at?`<br><small style="color:var(--muted)">${hm(t.started_at)}–${hm(t.ended_at)}</small>`:""}</td>
    <td>${t.plate?plateHTML(t.plate):""} ${esc(t.driver_name||"—")}</td>
    <td>${esc(t.pickup||"—")} ← ${esc(t.dropoff||"—")}${t.note?`<br><small style="color:var(--muted)">${esc(t.note)}</small>`:""}</td>
    <td dir="ltr" style="text-align:right">${esc(t.customer_phone||"—")}</td>
    <td>${t.source==="office"?"المكتب":"السائق"}</td>
    <td><span class="pill ${st[0]}">${st[1]}</span>${t.cancel_reason?`<br><small style="color:var(--muted)">${esc(t.cancel_reason)}</small>`:""}</td>
    <td style="font-variant-numeric:tabular-nums">${t.fare?fmt(t.fare):"—"}</td><td>${t.km!=null?t.km:"—"}</td>
    <td><div class="acts">${["assigned","rejected"].includes(t.status)?`<button class="btn sm" data-ta="re" data-id="${t.id}">تحويل لسائق</button>`:""}${openT?`<button class="btn sm danger" data-ta="cancel" data-id="${t.id}">إلغاء</button>`:""}</div></td></tr>`}).join("")}
  </tbody></table></div>`;
  box.querySelectorAll("[data-ta]").forEach(b=>b.onclick=()=>{
    const id=+b.dataset.id;
    if(b.dataset.ta==="cancel") confirmBox("إلغاء هذي السفرة؟","إلغاء السفرة",async()=>{await rpc("taxi_admin_trip_action",{p_pin:PIN,p_id:id,p_action:"cancel"});toast("انلغت");loadTrips()});
    else pickDriver("تحويل السفرة لسائق ثاني",async car=>{await rpc("taxi_admin_trip_action",{p_pin:PIN,p_id:id,p_action:"reassign",p_car:car});toast("انرسلت للسائق");loadTrips()});
  });
}
function driverOptions(){
  const rank=c=>{const s=status(c);return c.trip?3:s.k==="ok"?0:s.k==="warn"?1:2};
  return [...cars].filter(c=>c.active).sort((a,b)=>rank(a)-rank(b)).map(c=>{const s=status(c);return `<option value="${c.id}" ${c.trip?"disabled":""}>${esc(c.driver_name)} · ${esc(c.plate)} — ${c.trip?"عنده سفرة":s.t}</option>`}).join("");
}
function pickDriver(title,fn){
  const m=modal(`<h3>${esc(title)}</h3><div class="field"><label for="pd">السائق</label><select id="pd" class="btn" style="width:100%">${driverOptions()}</select></div><div class="err" id="pe"></div><div class="row"><button class="btn" id="pc">رجوع</button><button class="btn primary" id="po">إرسال</button></div>`);
  $("#pc",m).onclick=()=>m.remove();
  $("#po",m).onclick=async()=>{try{await fn($("#pd",m).value);m.remove()}catch(e){$("#pe",m).textContent=e.message}};
}
function tripForm(){
  if(!cars.filter(c=>c.active).length) return toast("أضف سيارة أولًا");
  const m=modal(`<h3>حجز سفرة جديدة</h3>
   <form id="tf" style="display:flex;flex-direction:column;gap:12px">
    <div class="grid2">
      <div class="field"><label for="t-ph">رقم الزبون</label><input id="t-ph" inputmode="tel" dir="ltr" placeholder="07xx xxx xxxx"></div>
      <div class="field"><label for="t-drv">السائق</label><select id="t-drv" class="btn" style="width:100%">${driverOptions()}</select></div>
      <div class="field"><label for="t-from">من (مكان الزبون)</label><input id="t-from" required placeholder="مثال: عمارة T5، البوابة 2"></div>
      <div class="field"><label for="t-to">إلى</label><input id="t-to" placeholder="مثال: الكرادة"></div>
    </div>
    <div class="field"><label for="t-note">ملاحظة</label><input id="t-note" placeholder="اختياري"></div>
    <p class="note" style="margin:0">السفرة توصل للسائق على تطبيقه، ولازم يقبلها. إذا رفضها تنسجل عليه وتگدر تحوّلها لسائق ثاني.</p>
    <div class="err" id="tfe"></div>
    <div class="row"><button type="button" class="btn" id="tfc">إلغاء</button><button class="btn primary">إرسال للسائق</button></div>
   </form>`);
  $("#tfc",m).onclick=()=>m.remove();
  $("#tf",m).onsubmit=async e=>{e.preventDefault();
    try{await rpc("taxi_admin_trip_create",{p_pin:PIN,p:{car_id:$("#t-drv",m).value,customer_phone:$("#t-ph",m).value,pickup:$("#t-from",m).value,dropoff:$("#t-to",m).value,note:$("#t-note",m).value}});
      const c=cars.find(x=>x.id===$("#t-drv",m).value);m.remove();toast("انرسلت السفرة لـ "+(c?c.driver_name:"السائق"));poll();if(tab==="trips")loadTrips();
    }catch(err){$("#tfe",m).textContent=err.message}};
}

/* ---------- Accounts: who drove how much, and what came in ---------- */
let accMonth=null, accRows=[];
function renderAccounts(){
  accMonth=accMonth||todayStr().slice(0,7);
  $("#view").innerHTML=`<div class="wrap">
    <div class="bar"><h2>الحسابات الشهرية</h2><label class="sr" for="mon">الشهر</label><input id="mon" type="month" value="${accMonth}" class="btn"></div>
    <div id="akpi" class="kpis"></div>
    <p class="note">«تحرّك بدون سفرة» يعني الـ GPS سجّل السيارة تمشي مسافة أكثر من 300 متر بدون ما يكون عند السائق سفرة مفتوحة. هاي أول علامة إنه دا يشتغل لحسابه.</p>
    <div id="alist"><div class="empty">جارٍ الحساب…</div></div></div>`;
  $("#mon").onchange=e=>{accMonth=e.target.value;loadAccounts()};
  loadAccounts();
}
async function loadAccounts(){
  const box=$("#alist"); if(!box) return;
  try{accRows=await rpc("taxi_admin_statement",{p_pin:PIN,p_month:accMonth+"-01"})}catch(e){box.innerHTML=`<div class="empty">${esc(e.message)}</div>`;return}
  const base=accRows[0]?.fare_base, perkm=accRows[0]?.fare_per_km;
  const est=r=>base?(r.unlogged*base+(perkm?Math.round(r.unlogged_km*perkm):0)):null;
  const sum=k=>accRows.reduce((a,r)=>a+Number(r[k]||0),0);
  const lost=base?accRows.reduce((a,r)=>a+est(r),0):null;
  $("#akpi").innerHTML=`<div class="kpi"><small>الأجرة المسجّلة</small><b>${dinar(sum("fares"))}</b></div>
    <div class="kpi"><small>المستلَم من السواق</small><b>${dinar(sum("paid"))}</b></div>
    <div class="kpi"><small>باقي بذمّة السواق</small><b>${dinar(sum("fares")-sum("paid"))}</b></div>
    <div class="kpi ${sum("unlogged")?"kpi-bad":""}"><small>تحرّكات بدون سفرة</small><b>${fmt(sum("unlogged"))} <span style="font-size:14px">(${sum("unlogged_km").toFixed(1)} كم)</span></b>${lost!=null?`<small>تقدير الضايع ≈ ${dinar(lost)}</small>`:`<small><a href="#" id="setf">حدّد الأجرة</a> حتى نقدّر الضايع</small>`}</div>`;
  const sf=$("#setf"); if(sf) sf.onclick=e=>{e.preventDefault();tab="set";renderTab()};
  if(!accRows.length){box.innerHTML=`<div class="empty card">ماكو سيارات.</div>`;return}
  box.innerHTML=`<div class="tbl-wrap"><table><thead><tr><th>السائق</th><th>سفرات</th><th>الأجرة</th><th>المستلَم</th><th>الباقي</th><th>كم بالـ GPS</th><th>بدون سفرة</th><th>ساعات التتبع</th><th>رفض</th><th>انقطاعات</th><th></th></tr></thead><tbody>
  ${accRows.map(r=>`<tr>
    <td>${plateHTML(r.plate)} <b>${esc(r.driver_name)}</b></td>
    <td class="num">${fmt(r.trips)}</td><td class="num">${fmt(r.fares)}</td><td class="num">${fmt(r.paid)}</td>
    <td class="num"><b style="color:${r.fares-r.paid>0?"var(--bad)":"var(--ok)"}">${fmt(r.fares-r.paid)}</b></td>
    <td class="num">${r.km_total}</td>
    <td>${r.unlogged?`<span class="pill s-bad">${r.unlogged} مرة · ${r.unlogged_km} كم</span>${base?`<br><small style="color:var(--muted)">≈ ${dinar(est(r))}</small>`:""}`:`<span class="pill s-ok">ماكو</span>`}</td>
    <td class="num">${r.online_hours}</td><td class="num">${r.rejected?`<b style="color:var(--bad)">${r.rejected}</b>`:0}</td><td class="num">${r.cutoffs?`<b style="color:var(--bad)">${r.cutoffs}</b>`:0}</td>
    <td><div class="acts"><button class="btn sm primary" data-cash="${r.id}">استلام مبلغ</button><button class="btn sm" data-det="${r.id}">التفاصيل</button></div></td></tr>`).join("")}
  </tbody></table></div>`;
  box.querySelectorAll("[data-cash]").forEach(b=>b.onclick=()=>cashForm(accRows.find(r=>r.id===b.dataset.cash)));
  box.querySelectorAll("[data-det]").forEach(b=>b.onclick=()=>driverDetail(accRows.find(r=>r.id===b.dataset.det)));
}
function cashForm(r){
  const m=modal(`<h3>استلام مبلغ من ${esc(r.driver_name)}</h3>
   <p style="margin:0">الباقي بذمّته هذا الشهر: <b>${dinar(r.fares-r.paid)}</b></p>
   <form id="cf2" style="display:flex;flex-direction:column;gap:12px">
    <div class="field"><label for="cm">المبلغ المستلَم (دينار)</label><input id="cm" inputmode="numeric" required value="${Math.max(r.fares-r.paid,0)||""}"></div>
    <div class="field"><label for="cn2">ملاحظة</label><input id="cn2" placeholder="اختياري"></div>
    <div class="err" id="cme"></div>
    <div class="row"><button type="button" class="btn" id="cmc">إلغاء</button><button class="btn primary">تسجيل الاستلام</button></div></form>`);
  $("#cmc",m).onclick=()=>m.remove();
  $("#cf2",m).onsubmit=async e=>{e.preventDefault();try{await rpc("taxi_admin_cash",{p_pin:PIN,p_action:"add",p:{car_id:r.id,amount:$("#cm",m).value,note:$("#cn2",m).value}});m.remove();toast("انسجل الاستلام");loadAccounts()}catch(err){$("#cme",m).textContent=err.message}};
}
async function driverDetail(r){
  const m=modal(`<h3>${esc(r.driver_name)} · ${esc(r.plate)}</h3><div id="dd"><div class="empty">جارٍ التحميل…</div></div><div class="row"><button class="btn" id="ddc">سدّ</button></div>`);
  m.querySelector(".sheet").style.width="min(760px,100%)";
  $("#ddc",m).onclick=()=>m.remove();
  let d; try{d=await rpc("taxi_admin_driver_detail",{p_pin:PIN,p_car:r.id,p_month:accMonth+"-01"})}catch(e){$("#dd",m).innerHTML=`<div class="err">${esc(e.message)}</div>`;return}
  const dt=ts=>new Date(ts).toLocaleString("ar-IQ",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"});
  $("#dd",m).innerHTML=`
   <h4 class="h4">تحرّكات بدون سفرة (${d.moves.length})</h4>
   ${d.moves.length?`<ul class="log">${d.moves.map((v,i)=>`<li><span class="pill s-bad">${v.km} كم</span><span>${dt(v.started_at)} ← ${hm(v.ended_at)}</span><button class="btn sm" data-mv="${i}">عرض المسار</button></li>`).join("")}</ul>`:`<p class="note">ماكو. كل حركة السيارة چانت ضمن سفرات مسجّلة.</p>`}
   <h4 class="h4">السفرات (${d.trips.length})</h4>
   ${d.trips.length?`<ul class="log">${d.trips.map(t=>`<li><span class="pill ${(TS[t.status]||["s-idle"])[0]}">${(TS[t.status]||["",t.status])[1]}</span><span>${dt(t.created_at)} · ${esc(t.pickup||"—")} ← ${esc(t.dropoff||"—")}</span><b>${t.fare?fmt(t.fare):"—"}</b></li>`).join("")}</ul>`:`<p class="note">ماكو سفرات مسجّلة هذا الشهر.</p>`}
   <h4 class="h4">المبالغ المستلَمة (${d.cash.length})</h4>
   ${d.cash.length?`<ul class="log">${d.cash.map(k=>`<li><span class="pill s-ok">${fmt(k.amount)}</span><span>${dt(k.at)}${k.note?" · "+esc(k.note):""}</span>${(Date.now()-new Date(k.at))<48*3600e3?`<button class="btn sm danger" data-cdel="${k.id}">حذف</button>`:"<span></span>"}</li>`).join("")}</ul>`:`<p class="note">ما استلمت منه شي هذا الشهر.</p>`}`;
  $("#dd",m).querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{const v=d.moves[+b.dataset.mv];m.remove();showRange(r.id,v.started_at,v.ended_at)});
  $("#dd",m).querySelectorAll("[data-cdel]").forEach(b=>b.onclick=async()=>{try{await rpc("taxi_admin_cash",{p_pin:PIN,p_action:"delete",p:{id:b.dataset.cdel}});m.remove();toast("انحذف");loadAccounts()}catch(e){toast(e.message)}});
}
async function showRange(carId,from,to){
  tab="live"; selId=carId; renderTab();
  try{const t=await rpc("taxi_admin_trail_range",{p_pin:PIN,p_car:carId,p_from:from,p_to:to});
    if(!map||t.length<2) return toast("ماكو نقاط كافية لهذا المسار");
    if(trailLine) map.removeLayer(trailLine);
    const pts=t.map(p=>[p[0],p[1]]);
    trailLine=L.polyline(pts,{color:getComputedStyle(document.documentElement).getPropertyValue("--bad").trim()||"#d6332b",weight:5,opacity:.9}).addTo(map);
    L.circleMarker(pts[0],{radius:7,color:"#16935a",fillOpacity:1}).addTo(map).bindTooltip("بداية "+hm(from));
    L.circleMarker(pts[pts.length-1],{radius:7,color:"#d6332b",fillOpacity:1}).addTo(map).bindTooltip("نهاية "+hm(to));
    fitted=true; map.fitBounds(pts,{padding:[40,40]});
    toast("المسار الأحمر: تحرّك بدون سفرة");
  }catch(e){toast(e.message)}
}

/* ---------- Weekly settlement: collect fares, pay each driver his share ---------- */
let weekDay=null, weekData=null;
const dmy=d=>{const [y,m,dd]=String(d).split("-");return `${+dd}/${+m}`};
function shiftWeek(n){const d=new Date((weekDay||todayStr())+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+7*n);weekDay=d.toISOString().slice(0,10);loadWeek()}
function renderWeek(){
  weekDay=weekDay||todayStr();
  $("#view").innerHTML=`<div class="wrap">
    <div class="bar"><h2>التسوية الأسبوعية</h2>
      <div class="wk"><button class="btn sm" id="wprev" aria-label="الأسبوع السابق">‹ السابق</button><b id="wlabel">…</b><button class="btn sm" id="wnext" aria-label="الأسبوع الجاي">الجاي ›</button></div></div>
    <div id="wkpi" class="kpis"></div>
    <div id="wrule"></div>
    <div id="wlist"><div class="empty">جارٍ الحساب…</div></div></div>`;
  $("#wprev").onclick=()=>shiftWeek(-1); $("#wnext").onclick=()=>shiftWeek(1);
  loadWeek();
}
async function loadWeek(){
  const box=$("#wlist"); if(!box) return;
  try{weekData=await rpc("taxi_admin_week",{p_pin:PIN,p_day:weekDay})}catch(e){box.innerHTML=`<div class="empty">${esc(e.message)}</div>`;return}
  const W=weekData, rows=W.rows;
  $("#wlabel").textContent=`السبت ${dmy(W.week_start)} — الجمعة ${dmy(W.week_end)}`;
  const ruleSet=(W.share_pct||W.per_trip);
  $("#wrule").innerHTML=ruleSet?`<p class="note">حصة السائق = ${W.share_pct?`${W.share_pct}% من أجرة سفراته`:""}${W.share_pct&&W.per_trip?" + ":""}${W.per_trip?`${fmt(W.per_trip)} د.ع لكل سفرة`:""}. تنحسب من السفرات المسجّلة بس: السفرة اللي ما انسجلت ما إلها حصة. <a href="#" id="wset">تغيير</a></p>`
    :`<p class="note" style="border-color:var(--warn)">⚠ ما حدّدت حصة السائق بعد، فالحصة تطلع صفر. <a href="#" id="wset">حدّدها من الإعدادات</a></p>`;
  $("#wset").onclick=e=>{e.preventDefault();tab="set";renderTab()};
  const sum=k=>rows.reduce((a,r)=>a+Number(r[k]||0),0);
  const fares=sum("fares")+sum("settled_fares"), share=sum("share")+sum("settled_share");
  $("#wkpi").innerHTML=`<div class="kpi"><small>أجرة السفرات المسجّلة</small><b>${dinar(fares)}</b><small>${fmt(sum("trips")+sum("settled_trips"))} سفرة</small></div>
    <div class="kpi"><small>حصص السواق</small><b>${dinar(share)}</b></div>
    <div class="kpi"><small>صافي الشركة</small><b>${dinar(fares-share)}</b></div>
    <div class="kpi ${sum("fares")?"kpi-warn":""}"><small>باقي ما تسوّى</small><b>${dinar(sum("fares"))}</b><small>${fmt(sum("trips"))} سفرة</small></div>`;
  if(!rows.length){box.innerHTML=`<div class="empty card">ماكو سيارات.</div>`;return}
  box.innerHTML=`<div class="tbl-wrap"><table><thead><tr><th>السائق</th><th>سفرات</th><th>الأجرة اللي بيده</th><th>حصّته</th><th>يسلّم للشركة (صافي)</th><th>بدون سفرة</th><th>الحالة</th><th></th></tr></thead><tbody>
  ${rows.map(r=>{const pend=Number(r.trips)>0;const settled=r.settlement_ids.length>0;return `<tr>
    <td>${plateHTML(r.plate)} <b>${esc(r.driver_name)}</b></td>
    <td class="num">${fmt(r.trips)}${settled?`<br><small style="color:var(--muted)">+${fmt(r.settled_trips)} مسوّاة</small>`:""}</td>
    <td class="num">${fmt(r.fares)}</td><td class="num" style="color:var(--ok)"><b>${fmt(r.share)}</b></td>
    <td class="num"><b>${fmt(r.fares-r.share)}</b></td>
    <td>${r.unlogged?`<span class="pill s-bad">${r.unlogged} مرة · ${r.unlogged_km} كم</span>`:`<span class="pill s-ok">ماكو</span>`}</td>
    <td>${pend?`<span class="pill s-warn">بانتظار التسوية</span>`:settled?`<span class="pill s-ok">✔ مسوّاة</span>`:`<span class="pill s-idle">ماكو سفرات</span>`}</td>
    <td><div class="acts">${pend?`<button class="btn sm primary" data-settle="${r.id}">تسوية</button>`:""}${r.settlement_ids.map(id=>`<button class="btn sm" data-rcpt="${id}">وصل #${id}</button>`).join("")}</div></td></tr>`}).join("")}
  </tbody></table></div>`;

async function driverStart(){
  let car;
  try{car=await rpc("taxi_driver_login",{p_code:CODE})}catch(e){store.del("taxi_driver_code");CODE=null;return driverGate(e.message)}
  $("#app").innerHTML=`<div class="drv">
    <div class="brand"><div class="brand-mark">${ICON}</div><div><h1>${esc(car.driver_name)}</h1><small>${esc([car.model,car.year,car.color].filter(Boolean).join(" · "))}</small></div></div>
    <div style="align-self:center">${plateHTML(car.plate,true)}</div>
    <button class="ring off" id="ring" type="button"><div><strong id="rs">تشغيل التتبع</strong><br><small id="rsub">التتبع مطفأ</small></div></button>
    <div class="stats">
      <div class="stat"><small>آخر إرسال</small><b id="st-sent">—</b></div>
      <div class="stat"><small>دقة الموقع</small><b id="st-acc">—</b></div>
      <div class="stat"><small>السرعة</small><b id="st-spd">—</b></div>
      <div class="stat"><small>عدد الإرسالات</small><b id="st-n">0</b></div>
    </div>
    <div id="tripBox"></div>
    <p class="note" id="tips">الزر الأحمر يشغّل التتبع، ولما يشتغل يصير أخضر، واضغطه مرة ثانية حتى تطفيه. أثناء الدوام أبقِ الصفحة مفتوحة، وإطفاء الـ GPS أو إغلاق الصفحة يُسجَّل عند الإدارة فورًا.</p>
  </div>
  <div class="block" id="block" hidden><h2 id="bt">الـ GPS مطفأ</h2><p id="bp">شغّل الموقع (GPS) من إعدادات الهاتف حالًا. الإدارة تم إبلاغها.</p><button class="btn" id="retry">شغّلته، أعد المحاولة</button><button class="btn" id="toExt" hidden>عندي آيفون: استخدم تطبيق Traccar</button></div>`;
  $("#retry").onclick=()=>{unlockAudio();startWatch()};
  $("#toExt").hidden=!/iPhone|iPad|iPod/.test(navigator.userAgent)&&!(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  $("#toExt").onclick=()=>{siren(false);$("#block").hidden=true;gpsBad=false;if(!$("#extCard"))renderExtCard();$("#extOn").checked=true;setExt(true);window.scrollTo(0,0)};
  unlockAudio();
  try{if(navigator.getBattery){const b=await navigator.getBattery();battery=Math.round(b.level*100);b.addEventListener("levelchange",()=>battery=Math.round(b.level*100))}}catch{}
  $("#ring").onclick=()=>{unlockAudio();ON?confirmStop():goOn()};
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  if(ios&&store.get("taxi_ext")===null){EXT=true;store.set("taxi_ext","1")}
  if(ios||EXT) renderExtCard();
  if(EXT){ON=false;store.set("taxi_on","0");setExt(true)}
  else if(ON) goOn();
  setInterval(()=>{$("#st-sent")&&($("#st-sent").textContent=lastSent?ago(lastSent):"—")},1000);
  document.addEventListener("visibilitychange",()=>{
    if(!ON) return;
    if(document.visibilityState==="hidden") report("background");
    else {keepAwake();startWatch();heartbeat()}
  });
  window.addEventListener("pagehide",()=>{if(ON)beacon("closed")});
  if(navigator.permissions&&navigator.permissions.query){try{const p=await navigator.permissions.query({name:"geolocation"});p.onchange=()=>{if(!ON)return;if(p.state==="denied")gpsError({code:1});else startWatch()}}catch{}}
}
/* ---------- iPhone: background tracking through the Traccar Client app ---------- */
const TRACCAR_URL="https://xdyxcvyhoidojtfpoepk.supabase.co/functions/v1/traccar";
const APPSTORE_URL="https://apps.apple.com/app/traccar-client/id843156974";
function traccarLink(){return "org.traccar.client://config?url="+encodeURIComponent(TRACCAR_URL)+"&id="+encodeURIComponent(CODE)+"&interval=30&accuracy=highest&distance=0"}
function renderExtCard(){
  const box=document.createElement("div");box.className="trip";box.id="extCard";
  box.innerHTML=`<h3>📱 تشغيل التتبع على الآيفون</h3>
   <p>الآيفون يوقف موقع المتصفح أول ما تطلع من الصفحة، فالتتبع بالخلفية يشتغل عن طريق تطبيق <b>Traccar Client</b> المجاني.</p>
   <a class="btn big" href="${APPSTORE_URL}" target="_blank" rel="noopener" style="text-align:center">١- تنزيل التطبيق من الـ App Store</a>
   <a class="btn primary big" href="${traccarLink()}" id="extGo" style="text-align:center">٢- تشغيل التتبع بضغطة وحدة</a>
   <p style="font-size:13px">الزر الثاني يفتح التطبيق ويضبط رمزك والسيرفر وحده. اختار <b>«فتح»</b>، وبعدها اسمح للموقع <b>«دائمًا / Always»</b>، وشغّل الزر الأخضر بالتطبيق.</p>
   <details><summary>ما اشتغل الزر؟ الضبط اليدوي</summary>
     <ol class="steps-sm">
       <li><b>Device identifier</b>: <code dir="ltr">${esc(CODE)}</code></li>
       <li><b>Server URL</b>: <code dir="ltr" style="word-break:break-all">${TRACCAR_URL}</code> <button class="btn sm" id="cpu" type="button">نسخ</button></li>
       <li><b>Location accuracy</b>: High · <b>Heartbeat</b>: 60 · فعّل <b>Prevent suspend</b></li>
     </ol></details>
   <label class="chk"><input type="checkbox" id="extOn" ${EXT?"checked":""}> أستخدم Traccar للتتبع، وهاي الصفحة للسفرات بس</label>`;
  $(".drv").insertBefore(box,$("#ring"));
  $("#cpu").onclick=()=>copy(TRACCAR_URL);
  $("#extGo").addEventListener("click",()=>{ if(!EXT){ $("#extOn").checked=true; setExt(true); } });
  $("#extOn").onchange=e=>setExt(e.target.checked);
}
let extT;
function setExt(on){
  EXT=on;store.set("taxi_ext",on?"1":"0");
  $("#ring").hidden=on; $("#tips").hidden=on; document.querySelectorAll(".drv > .stats").forEach(x=>x.hidden=on);
  clearInterval(extT); clearInterval(tripPoll);
  if(on){
    if(ON) goOff();
    siren(false); gpsBad=false; $("#block").hidden=true;
    let st=$("#extStatus"); if(!st){st=document.createElement("div");st.id="extStatus";st.className="stat";$(".drv").insertBefore(st,$("#tripBox"))}
    const upd=async()=>{try{const s=await rpc("taxi_driver_state",{p_code:CODE});const fresh=s.last_seen&&(Date.now()-new Date(s.last_seen))<180000&&["ok","background"].includes(s.gps_state);
      st.innerHTML=`<small>التتبع عن طريق Traccar</small><b style="color:${fresh?"var(--ok)":"var(--bad)"}">${fresh?"✔ موقعك يوصل للإدارة":"⚠ ما دا يوصل موقع"}</b><small>آخر إشارة: ${ago(s.last_seen)}</small>`;
      today={trips:s.today_trips,fares:s.today_fares,base:s.fare_base,share:s.week_share||0};showTrip(s.trip,true)}catch{}};
    upd(); extT=setInterval(upd,8000);
  }else{const st=$("#extStatus"); if(st) st.remove(); showTrip(null,true)}
}

/* ---------- Driver trips ---------- */
let curTrip, tripPoll, lastOffer=null, today={trips:0,fares:0,base:null};
async function refreshTrip(){
  if(!CODE) return;
  try{const st=await rpc("taxi_driver_state",{p_code:CODE});today={trips:st.today_trips,fares:st.today_fares,base:st.fare_base,share:st.week_share||0};showTrip(st.trip,true)}catch{}
}
function showTrip(t,force){
  const box=$("#tripBox"); if(!box) return;
  const key=JSON.stringify(t&&[t.id,t.status]);
  if(!force&&key===JSON.stringify(curTrip&&[curTrip.id,curTrip.status])) return;
  curTrip=t;
  if(!ON&&!EXT){box.innerHTML="";return}
  const sum=`<div class="stats" style="margin-top:10px"><div class="stat"><small>سفرات اليوم</small><b>${today.trips} · ${fmt(today.fares)}</b></div><div class="stat"><small>حصتك هذا الأسبوع</small><b style="color:var(--ok)">${fmt(today.share)} د.ع</b></div></div><p class="note" style="margin:8px 0 0">حصتك تنحسب من السفرات المسجّلة بس.</p>`;
  if(!t){box.innerHTML=`<div class="trip"><h3>ماكو سفرة</h3><p>إذا ركب زبون، سجّل السفرة قبل لا تتحرك. الحركة بدون سفرة تنسجل وتوصل للإدارة.</p>
      <div class="field"><label for="tr-to">إلى وين؟ (اختياري)</label><input id="tr-to"></div>
      <button class="btn primary big" id="tr-start">بدء سفرة</button></div>${sum}`;
    $("#tr-start").onclick=()=>tripAct("start",{dropoff:$("#tr-to").value});return}
  const where=`<p><b>من:</b> ${esc(t.pickup||"—")}<br><b>إلى:</b> ${esc(t.dropoff||"—")}${t.customer_phone?`<br><b>الزبون:</b> <span dir="ltr">${esc(t.customer_phone)}</span>`:""}${t.note?`<br><b>ملاحظة:</b> ${esc(t.note)}`:""}</p>`;
  if(t.status==="assigned"){
    if(lastOffer!==t.id){lastOffer=t.id;try{navigator.vibrate&&navigator.vibrate([400,150,400])}catch{};siren(true);setTimeout(()=>siren(false),3000)}
    box.innerHTML=`<div class="trip offer"><h3>📣 سفرة جديدة من المكتب</h3>${where}<div class="row2"><button class="btn primary big" id="tr-acc">قبول</button><button class="btn big" id="tr-rej">رفض</button></div></div>`;
    $("#tr-acc").onclick=()=>{siren(false);tripAct("accept")};
    $("#tr-rej").onclick=()=>{siren(false);const m=modal(`<h3>رفض السفرة؟</h3><p style="margin:0">الرفض ينسجل عليك ويوصل للإدارة.</p><div class="field"><label for="rr">السبب</label><input id="rr" placeholder="مثال: بعيد، عندي عطل"></div><div class="row"><button class="btn" id="rn">رجوع</button><button class="btn primary" id="ry">رفض</button></div>`);$("#rn",m).onclick=()=>m.remove();$("#ry",m).onclick=()=>{m.remove();tripAct("reject",{reason:$("#rr",m).value})}};
    return}
  if(t.status==="accepted"){box.innerHTML=`<div class="trip"><h3>رايح للزبون</h3>${where}<button class="btn primary big" id="tr-go">وصلت، ابدأ السفرة</button></div>`;$("#tr-go").onclick=()=>tripAct("start");return}
  box.innerHTML=`<div class="trip on"><h3>بسفرة من ${hm(t.started_at)}</h3>${where}
    <div class="field"><label for="tr-fare">الأجرة المستلمة (دينار)</label><input id="tr-fare" inputmode="numeric" value="${today.base||""}" style="font:600 22px var(--mono);text-align:center"></div>
    <button class="btn primary big" id="tr-end">إنهاء السفرة</button></div>`;
  $("#tr-end").onclick=()=>tripAct("end",{fare:$("#tr-fare").value});
}
async function tripAct(a,p){
  try{await rpc("taxi_driver_trip",{p_code:CODE,p_action:a,p:p||{}});toast(a==="end"?"انسجلت السفرة":a==="reject"?"انرفضت":"تم");if(EXT)setExt(true);else await refreshTrip()}catch(e){toast(e.message)}
}
function goOn(){
  ON=true;store.set("taxi_on","1");
  const r=$("#ring");r.className="ring wait";$("#rs").textContent="إطفاء التتبع";$("#rsub").textContent="جارٍ تحديد الموقع…";
  keepAwake();startWatch();clearInterval(hb);hb=setInterval(heartbeat,15000);
  clearInterval(tripPoll);refreshTrip();tripPoll=setInterval(refreshTrip,8000);
}
function goOff(){
  ON=false;store.set("taxi_on","0");clearInterval(tripPoll);showTrip(null,true);
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}
  clearInterval(hb);siren(false);gpsBad=false;$("#block").hidden=true;
  try{wake&&wake.release()}catch{}wake=null;
  report("stopped");
  const r=$("#ring");r.className="ring off";$("#rs").textContent="تشغيل التتبع";$("#rsub").textContent="التتبع مطفأ";
}
function confirmStop(){
  const m=modal(`<h3>إطفاء التتبع؟</h3><p style="margin:0">راح يتوقف إرسال موقعك للإدارة.</p><div class="row"><button class="btn" id="cn">لا، استمر</button><button class="btn primary" id="cy">إطفاء التتبع</button></div>`);
  $("#cn",m).onclick=()=>m.remove();$("#cy",m).onclick=()=>{m.remove();goOff()};
}
function unlockAudio(){try{actx=actx||new AudioContext();actx.resume()}catch{}}
function siren(on){
  clearInterval(sirenT);
  if(on&&actx){const tone=()=>{try{const o=actx.createOscillator(),g=actx.createGain();o.type="square";o.frequency.setValueAtTime(950,actx.currentTime);o.frequency.setValueAtTime(650,actx.currentTime+.25);o.connect(g);g.connect(actx.destination);g.gain.value=.15;o.start();o.stop(actx.currentTime+.5)}catch{}};tone();sirenT=setInterval(tone,1500)}
  if(on&&navigator.vibrate) try{navigator.vibrate([500,200,500,200,500])}catch{}
}
async function keepAwake(){try{if("wakeLock" in navigator&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>wake=null)}}catch{}}
function startWatch(){
  if(!("geolocation" in navigator)) return gpsError({code:2});
  if(watchId!==null) navigator.geolocation.clearWatch(watchId);
  watchId=navigator.geolocation.watchPosition(onFix,gpsError,{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}
function onFix(pos){
  if(!ON) return;
  lastFix=pos;
  if(gpsBad){gpsBad=false;$("#block").hidden=true;siren(false)}
  const c=pos.coords, r=$("#ring");
  r.className="ring"; $("#rs").textContent="إطفاء التتبع"; $("#rsub").textContent="التتبع شغّال";
  $("#st-acc").textContent=Math.round(c.accuracy)+" م";
  $("#st-spd").textContent=c.speed!=null?Math.round(c.speed*3.6)+" كم/س":"0 كم/س";
  if(Date.now()-lastSent>4000) send(c);
}
async function send(c){
  try{const r=await rpc("taxi_ping_v2",{p_code:CODE,p_lat:c.latitude,p_lng:c.longitude,p_speed:c.speed,p_acc:c.accuracy,p_heading:c.heading,p_battery:battery});
    lastSent=Date.now();sentCount++;$("#st-n").textContent=sentCount;
    if(r) showTrip(r.trip);
  }catch(e){
    if(/رمز/.test(e.message)){store.del("taxi_driver_code");CODE=null;location.reload()}
    $("#rsub").textContent="لا يوجد إنترنت، سيُعاد الإرسال تلقائيًا";
  }
}
function heartbeat(){
  if(gpsBad||!ON) return;
  navigator.geolocation.getCurrentPosition(p=>{lastFix=p;send(p.coords)},gpsError,{enableHighAccuracy:true,maximumAge:10000,timeout:15000});
}
function gpsError(err){
  if(err.code===3||!ON) return; // timeout only: keep waiting
  gpsBad=true;
  const denied=err.code===1;
  $("#ring").className="ring bad"; $("#rs").textContent="إطفاء التتبع"; $("#rsub").textContent=denied?"⚠ إذن الموقع مرفوض":"⚠ الـ GPS مطفأ";
  $("#bt").textContent=denied?"إذن الموقع مرفوض":"الـ GPS مطفأ";
  $("#bp").textContent=denied?"افتح إعدادات المتصفح ← أذونات الموقع ← اسمح لهذا الموقع. الإدارة تم إبلاغها.":"شغّل الموقع (GPS) من إعدادات الهاتف حالًا. الإدارة تم إبلاغها.";
  $("#block").hidden=false; siren(true);
  report(denied?"denied":"off");
}
function report(state){rpc("taxi_gps_state",{p_code:CODE,p_state:state}).catch(()=>{})}
function beacon(state){
  try{const body=new Blob([JSON.stringify({p_code:CODE,p_state:state})],{type:"application/json"});
    navigator.sendBeacon(`${SB_URL}/rest/v1/rpc/taxi_gps_state?apikey=${encodeURIComponent(SB_KEY)}`,body)}catch{}
}

route();
</script>
</body>
