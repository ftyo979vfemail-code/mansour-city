name: Taxi driver app (Android)

on:
  push:
    branches: [main]
    paths:
      - 'taxi-android/**'
      - '.github/workflows/taxi-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p taxi-android assembleRelease --no-daemon --stacktrace

      - name: Publish to the "taxi-driver" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp taxi-android/app/build/outputs/apk/release/app-release.apk taxi-driver.apk
          if ! gh release view taxi-driver >/dev/null 2>&1; then
            gh release create taxi-driver --title "تطبيق سائق التكاسي" --notes "حمّل taxi-driver.apk وثبّته على تلفون السائق." --latest=false
          fi
          gh release upload taxi-driver taxi-driver.apk --clobber
