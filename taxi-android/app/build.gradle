plugins {
    id 'com.android.application'
}

android {
    namespace 'iq.mansour.taxi'
    compileSdk 34

    defaultConfig {
        applicationId 'iq.mansour.taxi'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName '1.0.' + (System.getenv('VERSION_CODE') ?: '1')
    }

    signingConfigs {
        release {
            storeFile file('taxi.keystore')
            storePassword 'taxi1234'
            keyAlias 'taxi'
            keyPassword 'taxi1234'
            // v1 too, so older phones and some file managers / installers accept it
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
