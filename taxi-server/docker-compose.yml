name: taxi

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: taxi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD}
      TZ: Asia/Baghdad
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taxi"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@db:5432/taxi
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_DB_POOL: 10
      PGRST_OPENAPI_MODE: disabled
      PGRST_SERVER_PORT: 3000

  web:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../taxi:/srv:ro
      - caddy_data:/data
      - caddy_config:/config

  # Daily database backup (kept 14 days) + cleanup of old trail points.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Baghdad
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/taxi-$$(date +%Y-%m-%d_%H%M).dump
          pg_dump -h db -U postgres -d taxi -Fc -f "$$f" && echo "backup ok: $$f"
          psql -h db -U postgres -d taxi -qc "select public.taxi_cleanup()"
          find /backups -name 'taxi-*.dump' -mtime +14 -delete
          sleep 86400
        done

volumes:
  pgdata:
  caddy_data:
  caddy_config:
